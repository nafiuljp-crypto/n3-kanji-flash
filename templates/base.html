<!DOCTYPE html>
<html lang="{{ 'ja' if lang == 'ja' else 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ T.home_title }}{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ base }}static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ base }}static/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ base }}static/apple-touch-icon.png">
    <script>
    /* Theme bootstrap. Runs before the stylesheet so data-theme is already
       set on the first paint (no flash of the wrong theme, including when
       navigating between pages). Saved choice beats the OS setting. */
    (function () {
        var KEY = 'n3theme:v1';

        function savedTheme() {
            try {
                var v = localStorage.getItem(KEY);
                return (v === 'dark' || v === 'light') ? v : null;
            } catch (e) { return null; }
        }

        function preferredTheme() {
            var saved = savedTheme();
            if (saved) return saved;
            return (window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var next = theme === 'dark' ? 'light' : 'dark';
            var label = btn.getAttribute('data-' + next) || next;
            btn.setAttribute('title', label);
            btn.setAttribute('aria-label', label);
        }

        /* The visible moon/sun label is swapped by CSS from data-theme; only
           the accessible name needs this late pass once the button exists. */
        applyTheme(preferredTheme());
        document.addEventListener('DOMContentLoaded', function () {
            applyTheme(document.documentElement.getAttribute('data-theme') ||
                preferredTheme());
        });
        document.addEventListener('click', function (e) {
            var btn = e.target && e.target.closest
                ? e.target.closest('#theme-toggle') : null;
            if (!btn) return;
            var next = document.documentElement.getAttribute('data-theme') === 'dark'
                ? 'light' : 'dark';
            try { localStorage.setItem(KEY, next); } catch (err) { /* private mode */ }
            applyTheme(next);
        });
    })();
    </script>
    <link rel="stylesheet" href="{{ base }}static/style.css">
    <script>
    /* Language switcher + cookie initializer. Runs before any UI renders. */
    (function () {
        function getCookie(name) {
            var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return m ? m[2] : null;
        }
        function setCookie(name, value) {
            /* Scoped to the site, not to every project on *.github.io (B15). */
            var path = '{{ base }}' || '/';
            document.cookie = name + '=' + value + '; path=' + path +
                '; max-age=31536000; SameSite=Lax';
        }
        if (!getCookie('lang')) {
            setCookie('lang', '{{ default_lang | default("ja") }}');
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-lang]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var newLang = a.getAttribute('data-lang');
                    setCookie('lang', newLang);
                    var m = location.pathname.match(/^(.*?)\/(en|ja)(\/.*)?$/);
                    var prefix = m ? m[1] : location.pathname.replace(/\/?[^\/]*$/, '');
                    var rest = (m && m[3]) ? m[3] : '/';
                    if (!rest.endsWith('/')) rest += '/';
                    location.href = prefix + '/' + newLang + rest;
                });
            });
        });
    })();
    </script>
</head>
<body>
    <nav class="navbar">
        <a href="{{ base }}{{ lang }}/" class="nav-brand">📚 {{ T.brand }}</a>
        <div class="nav-links">
            <a href="{{ base }}{{ lang }}/">{{ T.nav_home }}</a>
            <a href="{{ base }}{{ lang }}/test/">{{ T.nav_tests }}</a>
            <div class="lang-switch">
                <span class="lang-label">{{ T.lang_label }}</span>
                {% for code in supported_langs %}
                    {% if code == lang %}
                        <span class="lang-current">{{ T['lang_' + code] }}</span>
                    {% else %}
                        <a href="#lang-{{ code }}" data-lang="{{ code }}" class="lang-link">{{ T['lang_' + code] }}</a>
                    {% endif %}
                {% endfor %}
            </div>
            <button type="button" class="theme-toggle" id="theme-toggle"
                    data-dark="{{ T.theme_dark }}" data-light="{{ T.theme_light }}"
                    title="{{ T.theme_dark }}" aria-label="{{ T.theme_dark }}">
                <span class="theme-icon when-light" aria-hidden="true">🌙</span>
                <span class="theme-icon when-dark" aria-hidden="true">☀️</span>
                <span class="theme-label when-light">{{ T.theme_dark }}</span>
                <span class="theme-label when-dark">{{ T.theme_light }}</span>
            </button>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>{{ T.footer }}</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
