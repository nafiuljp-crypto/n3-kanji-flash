    <script>
    /* Theme bootstrap. Runs before the stylesheet so data-theme is already
       set on the first paint (no flash of the wrong theme, including when
       navigating between pages). Saved choice beats the OS setting. */
    (function () {
        var KEY = 'n3theme:v1';

        function savedTheme() {
            try {
                var v = localStorage.getItem(KEY);
                return (v === 'dark' || v === 'light') ? v : null;
            } catch (e) { return null; }
        }

        function preferredTheme() {
            var saved = savedTheme();
            if (saved) return saved;
            return (window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var next = theme === 'dark' ? 'light' : 'dark';
            var label = btn.getAttribute('data-' + next) || next;
            btn.setAttribute('title', label);
            btn.setAttribute('aria-label', label);
        }

        /* The visible moon/sun label is swapped by CSS from data-theme; only
           the accessible name needs this late pass once the button exists. */
        applyTheme(preferredTheme());
        document.addEventListener('DOMContentLoaded', function () {
            applyTheme(document.documentElement.getAttribute('data-theme') ||
                preferredTheme());
        });
        document.addEventListener('click', function (e) {
            var btn = e.target && e.target.closest
                ? e.target.closest('#theme-toggle') : null;
            if (!btn) return;
            var next = document.documentElement.getAttribute('data-theme') === 'dark'
                ? 'light' : 'dark';
            try { localStorage.setItem(KEY, next); } catch (err) { /* private mode */ }
            applyTheme(next);
        });
    })();
    </script>
    <script>
    /* Password lock bootstrap. Runs before the stylesheet so the locked
       class is already on <html> for the first paint (no flash of page
       content). Only the SHA-256 of the site password is stored — here and
       as the localStorage value; the password itself is never written down.
       Any page with this key set to the hash stays unlocked in this browser. */
    (function () {
        var KEY = 'n3lock:v1';
        var HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
        var root = document.documentElement;

        function isUnlocked() {
            try { return localStorage.getItem(KEY) === HASH; } catch (e) { return false; }
        }

        function setLocked(locked) {
            root.classList.toggle('n3-locked', locked);
        }

        function sha256Hex(text) {
            return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text))
                .then(function (buf) {
                    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
                        return ('0' + b.toString(16)).slice(-2);
                    }).join('');
                });
        }

        setLocked(!isUnlocked());

        document.addEventListener('DOMContentLoaded', function () {
            var form = document.getElementById('lock-form');
            var input = document.getElementById('lock-input');
            var error = document.getElementById('lock-error');
            var errorTimer = null;

            function clearError() {
                if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
                if (error) error.hidden = true;
            }

            function showError() {
                if (!error) return;
                error.hidden = false;
                if (errorTimer) clearTimeout(errorTimer);
                errorTimer = setTimeout(clearError, 4000);
            }

            if (form && input) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    clearError();
                    var value = input.value;
                    if (!value) return;
                    if (!(window.crypto && crypto.subtle && window.TextEncoder)) return;
                    sha256Hex(value).then(function (hex) {
                        if (hex === HASH) {
                            try { localStorage.setItem(KEY, HASH); } catch (err) {}
                            setLocked(false);
                            input.value = '';
                            window.scrollTo(0, 0);
                        } else {
                            input.value = '';
                            input.focus();
                            showError();
                        }
                    }).catch(showError);
                });
                input.addEventListener('input', clearError);
                if (root.classList.contains('n3-locked')) input.focus();
            }

            var lockBtn = document.getElementById('lock-btn');
            if (lockBtn) {
                lockBtn.addEventListener('click', function () {
                    try { localStorage.removeItem(KEY); } catch (e) {}
                    setLocked(true);
                    clearError();
                    if (input) { input.value = ''; input.focus(); }
                    window.scrollTo(0, 0);
                });
            }
        });
    })();
    </script>

    <script>
    /* Language switcher + cookie initializer. Runs before any UI renders. */
    (function () {
        function getCookie(name) {
            var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return m ? m[2] : null;
        }
        function setCookie(name, value) {
            /* Scoped to the site, not to every project on *.github.io (B15). */
            var path = '/n3-kanji-flash/' || '/';
            document.cookie = name + '=' + value + '; path=' + path +
                '; max-age=31536000; SameSite=Lax';
        }
        if (!getCookie('lang')) {
            setCookie('lang', 'ja');
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-lang]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var newLang = a.getAttribute('data-lang');
                    setCookie('lang', newLang);
                    var m = location.pathname.match(/^(.*?)\/(en|ja)(\/.*)?$/);
                    var prefix = m ? m[1] : location.pathname.replace(/\/?[^\/]*$/, '');
                    var rest = (m && m[3]) ? m[3] : '/';
                    if (!rest.endsWith('/')) rest += '/';
                    location.href = prefix + '/' + newLang + rest;
                });
            });
        });
    })();
    </script>

</section>
