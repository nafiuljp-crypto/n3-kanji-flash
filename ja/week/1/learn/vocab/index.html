<script id="page-data" type="application/json">
{"items": [{"char": "\u53f7", "id": 2725, "image": null, "kanji": ["\u53f7"], "meaning": "Number", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.\n\nThis word is generally added to the end of a number, as in \u4e09\u53f7 (\"number 3\"). It can also go together with other words to give things like train car numbers, as in \uff12\u53f7\u8eca (\"car 2\"), and room numbers. When used on its own, it indicates the edition number of magazines and the like.", "radicals": [], "reading_display": "\u3054\u3046", "reading_mnemonic": "This word is made up of a single kanji all alone, but it uses the on\u0027yomi reading. This is probably because you\u0027ll usually see this word attached to other things, like numbers. This shows the edition or number of an item. So, even though it\u0027s alone, it\u0027s usually used like jukugo, which is why the reading for this one is the same as the reading you learned when you learned the kanji.", "url": "https://www.wanikani.com/vocabulary/%E5%8F%B7"}, {"char": "\u5411\u304f", "id": 3496, "image": null, "kanji": ["\u5411"], "meaning": "To Turn Toward", "meaning_mnemonic": "You know that the kanji means \u003ckanji\u003eyonder\u003c/kanji\u003e, which is like \"over there.\" This is the verb version of \"yonder.\" That being said, \"to yonder\" isn\u0027t really a thing, so you have to think of what happens when you \"look yonder.\" This word means \u003cvocabulary\u003eto turn toward\u003c/vocabulary\u003e or \u003cvocabulary\u003eto face\u003c/vocabulary\u003e. You\u0027re looking yonder, but you have to turn towards said yonder to look that way.\n\nThis word can also mean \u003cvocabulary\u003eto be suitable\u003c/vocabulary\u003e, as in a good fit for a job, role, or situation. After all, you turn toward the things you\u0027re most suitable for, right?", "radicals": [], "reading_display": "\u3080\u304f", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: \n\nYou turn \u003cvocabulary\u003eto face\u003c/vocabulary\u003e a new direction and look out into the distance. There is a single cow out there. It turns to face you too, and says \u003creading\u003emoo\u003c/reading\u003e (\u3080).", "url": "https://www.wanikani.com/vocabulary/%E5%90%91%E3%81%8F"}, {"char": "\u5411\u3051\u308b", "id": 7530, "image": null, "kanji": ["\u5411"], "meaning": "To Turn Something Towards", "meaning_mnemonic": "You know that \u5411\u304f means \"to face\" or \"to turn towards\", and this verb is related. This is a transitive verb, meaning it takes a direct object. It\u0027s when someone turns or points something. That something doesn\u0027t just turn on its own. So this verb means \u003cvocabulary\u003eto turn something towards\u003c/vocabulary\u003e or \u003cvocabulary\u003eto point something at\u003c/vocabulary\u003e.\n\nIn order to remember that this word means \"to turn something towards,\" focus on the \u3051. You have a bottle of ketchup in your hands and you\u0027re turning it toward your worst enemy to spray them. Picture yourself pointing the ketchup toward them.", "radicals": [], "reading_display": "\u3080\u3051\u308b", "reading_mnemonic": "The reading for this one is the same as \u5411\u304f which you learned in a previous level. As long as you know that one you should be able to learn this one\u0027s reading as well.", "url": "https://www.wanikani.com/vocabulary/%E5%90%91%E3%81%91%E3%82%8B"}, {"char": "\u5411\u3053\u3046", "id": 3428, "image": null, "kanji": ["\u5411"], "meaning": "Over There", "meaning_mnemonic": "You know that \u5411 means \u003ckanji\u003eyonder\u003c/kanji\u003e, and this is its noun version, meaning \u003cvocabulary\u003eover there\u003c/vocabulary\u003e.\n\n\u5411\u3053\u3046 is used when speaking generally about something distant from yourself, whether it\u0027s a place, as in \u5411\u3053\u3046\u306e\u5c71 (the mountain \u003cvocabulary\u003eover that way\u003c/vocabulary\u003e), or a person, as in \u5411\u3053\u3046\u306e\u4eba (the person on the \u003cvocabulary\u003eother side\u003c/vocabulary\u003e). Sometimes, it can even be used for time, like \u5411\u3053\u3046\u4e00\u9031\u9593 (the next week ahead).", "radicals": [], "reading_display": "\u3080\u3053\u3046", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You learned that with \u5411\u304f, but here\u0027s a mnemonic for you in case you forgot:\n\n\u003cvocabulary\u003eOver there\u003c/vocabulary\u003e, a cow is saying \u003creading\u003emoo\u003c/reading\u003e (\u3080). It\u0027s way over there, though, so you can\u0027t see or hear it. Kinda makes you wonder: if a cow moos way over there and no one\u0027s around to listen, did it really moo at all?", "url": "https://www.wanikani.com/vocabulary/%E5%90%91%E3%81%93%E3%81%86"}, {"char": "\u756a\u53f7", "id": 3047, "image": null, "kanji": ["\u756a", "\u53f7"], "meaning": "Number", "meaning_mnemonic": "A \u003ckanji\u003enumber in a series\u003c/kanji\u003e plus a \u003ckanji\u003enumber\u003c/kanji\u003e. You know what happens when two kanji with basically the same meaning get combined into one by now, right? It just turns out to be the same meaning, basically. This word means \u003cvocabulary\u003enumber\u003c/vocabulary\u003e, and it\u0027s used in contexts like phone numbers, exam numbers, and serial numbers.", "radicals": [], "reading_display": "\u3070\u3093\u3054\u3046", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E7%95%AA%E5%8F%B7"}, {"char": "\u301c\u5411\u3051", "id": 3485, "image": null, "kanji": ["\u5411"], "meaning": "Made For", "meaning_mnemonic": "You\u0027ve hopefully seen \u5411\u304f and \u5411\u3051\u308b by now. They mean \"to face\" and \"to turn toward.\" This has a similar idea. When you add \u5411\u3051 to something imagine you\u0027re turning it, aiming it at someone. It\u0027s aimed at them, meaning it\u0027s \u003cvocabulary\u003emade for\u003c/vocabulary\u003e them. Turn a book toward someone, now it\u0027s \u003cvocabulary\u003eaimed at\u003c/vocabulary\u003e them, it\u0027s made for them. See the connection?", "radicals": [], "reading_display": "\u3080\u3051", "reading_mnemonic": "The reading is the same as the word \u5411\u304f so work off of that word to be able to read this one.", "url": "https://www.wanikani.com/vocabulary/%E3%80%9C%E5%90%91%E3%81%91"}, {"char": "\u6a2a", "id": 3219, "image": null, "kanji": ["\u6a2a"], "meaning": "Side", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well. Please note that this word refers to \"the side of something.\" Not \"the left side,\" for example. That would be \u5de6\u5074.", "radicals": [], "reading_display": "\u3088\u3053", "reading_mnemonic": "The reading for this vocab is the same as the one you learned with the kanji, lucky you!", "url": "https://www.wanikani.com/vocabulary/%E6%A8%AA"}, {"char": "\u6b21", "id": 2870, "image": null, "kanji": ["\u6b21"], "meaning": "Next", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "radicals": [], "reading_display": "\u3064\u304e", "reading_mnemonic": "Since this word is made up of a single kanji, it should use the kun\u0027yomi reading. When learning the kanji, you didn\u0027t learn that reading, so here\u0027s a mnemonic to help you with this word: \n\nSomeone yells out \"NEXT!\" because the first thing didn\u0027t work on you. That was a single guillotine. Now they are going to try \u003creading\u003etwo gui\u003c/reading\u003ellotines (\u3064\u304e) and see how that works on your thick neck. NEXXXXT!", "url": "https://www.wanikani.com/vocabulary/%E6%AC%A1"}, {"char": "\u7dda", "id": 3218, "image": null, "kanji": ["\u7dda"], "meaning": "Line", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well. This also works for \"train lines\" as well. You\u0027ll see this attached onto the ends of names describing them.", "radicals": [], "reading_display": "\u305b\u3093", "reading_mnemonic": "The reading you learned with the kanji is the same for this vocab word. Enjoy it!", "url": "https://www.wanikani.com/vocabulary/%E7%B7%9A"}, {"char": "\u7dda\u8def", "id": 3196, "image": null, "kanji": ["\u7dda", "\u8def"], "meaning": "Railroad Track", "meaning_mnemonic": "A \u003ckanji\u003eline\u003c/kanji\u003e that runs on a \u003ckanji\u003eroad\u003c/kanji\u003e is a \u003cvocabulary\u003erailroad track\u003c/vocabulary\u003e. First you have to get into your mind that the \"line\" in question is a railway line. Then, what railway line runs on a road and what kind of road is it? It\u0027s a \u003cvocabulary\u003erailroad track\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u305b\u3093\u308d", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E7%B7%9A%E8%B7%AF"}, {"char": "\u901f\u3044", "id": 7472, "image": null, "kanji": ["\u901f"], "meaning": "Fast", "meaning_mnemonic": "Just like the meaning of the kanji (\u003ckanji\u003efast\u003c/kanji\u003e) this adjective also means \u003cvocabulary\u003efast\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u306f\u3084\u3044", "reading_mnemonic": "Remember how \u65e9\u3044 means \"early\"? If you are early to something, it probably means you moved \u003cvocabulary\u003efast\u003c/vocabulary\u003e to get there. These two words share a reading (and have similar meanings, in a way, as well!).", "url": "https://www.wanikani.com/vocabulary/%E9%80%9F%E3%81%84"}, {"char": "\u6307", "id": 3289, "image": null, "kanji": ["\u6307"], "meaning": "Finger", "meaning_mnemonic": "The kanji and the word are almost exactly the same. The only difference is that this word can mean \u003cvocabulary\u003efinger\u003c/vocabulary\u003e or \u003cvocabulary\u003etoe\u003c/vocabulary\u003e. What are toes but small, walking fingers?", "radicals": [], "reading_display": "\u3086\u3073", "reading_mnemonic": "Since this word is made up of a single kanji, it probably uses the kun\u0027yomi reading. You did not learn this reading, so here\u0027s a mnemonic to help you to remember: \n\nWhat do you use your \u003cvocabulary\u003efinger\u003c/vocabulary\u003e for the most? For pointing, of course! Imagine going up to people and saying, \"What will \u003creading\u003eyou be\u003c/reading\u003e (\u3086\u3073) when you grow up?\" Point your finger at the next person, \"What will you be?\" Keep going until you\u0027re just saying, \"You be? You be?\" with your finger out.", "url": "https://www.wanikani.com/vocabulary/%E6%8C%87"}, {"char": "\u6307\u3059", "id": 3288, "image": null, "kanji": ["\u6307"], "meaning": "To Point", "meaning_mnemonic": "The kanji means \u003ckanji\u003efinger\u003c/kanji\u003e. So, if you \"to finger\" something, what are you doing? You\u0027re pointing. That\u0027s why this word means \u003cvocabulary\u003eto point\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3055\u3059", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you:\n\nYou are pointing at something in fear. It is a \u003creading\u003esaw\u003c/reading\u003e (\u3055). Thing is, you\u0027re pointing at this saw with a missing finger. It just cut off your finger and you\u0027re freaking out, trying to point with a bloody non-finger.", "url": "https://www.wanikani.com/vocabulary/%E6%8C%87%E3%81%99"}, {"char": "\u6307\u5b9a\u3059\u308b", "id": 3291, "image": null, "kanji": ["\u6307", "\u5b9a"], "meaning": "To Appoint", "meaning_mnemonic": "When you \u003ckanji\u003edetermine\u003c/kanji\u003e and use your \u003ckanji\u003efinger\u003c/kanji\u003e to point at someone or something, you\u0027re going \u003cvocabulary\u003eto appoint\u003c/vocabulary\u003e them. Just imagine yourself determining who\u0027s the best for the job then pointing with your finger. That is who you will appoint. The \u3059\u308b on the end makes it a verb, so \u003cvocabulary\u003e\u6307\u5b9a\u003c/vocabulary\u003e would be \"appointment\" or \"designation\" or something along those lines. Cool how \u3059\u308b works.", "radicals": [], "reading_display": "\u3057\u3066\u3044\u3059\u308b", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own.", "url": "https://www.wanikani.com/vocabulary/%E6%8C%87%E5%AE%9A%E3%81%99%E3%82%8B"}, {"char": "\u301c\u968e", "id": 7452, "image": null, "kanji": ["\u968e"], "meaning": "Floor", "meaning_mnemonic": "You know that the kanji refers to a \u003ckanji\u003efloor\u003c/kanji\u003e (as in the \"fifth floor\"). This word represents the version that comes after a number, shown with a \u301c. Essentially, this has the same meaning as the kanji you learned, making it nice and easy.\n\nNote that floor-counting systems can vary across different countries. In Japan the ground floor is generally called \u4e00\u968e, with the floors above being \u4e8c\u968e, \u4e09\u968e, and so on.", "radicals": [], "reading_display": "\u304b\u3044", "reading_mnemonic": "The reading is the same as the one you learned with the kanji. Don\u0027t type in the \u301c or you\u0027ll get it wrong!", "url": "https://www.wanikani.com/vocabulary/%E3%80%9C%E9%9A%8E"}, {"char": "\u4fe1\u3058\u308b", "id": 3732, "image": null, "kanji": ["\u4fe1"], "meaning": "To Believe", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003ebelieve\u003c/kanji\u003e so the verb vocab version is \u003cvocabulary\u003eto believe\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3057\u3093\u3058\u308b", "reading_mnemonic": "The reading for \u4fe1 is \u3057\u3093 no matter what! See, if you believe, good things will happen. You should be able to read this.", "url": "https://www.wanikani.com/vocabulary/%E4%BF%A1%E3%81%98%E3%82%8B"}, {"char": "\u4fe1\u53f7", "id": 3734, "image": null, "kanji": ["\u4fe1", "\u53f7"], "meaning": "Traffic Light", "meaning_mnemonic": "If you \u003ckanji\u003ebelieve\u003c/kanji\u003e in the \u003ckanji\u003enumber\u003c/kanji\u003es, there will be no traffic because the \u003cvocabulary\u003etraffic light\u003c/vocabulary\u003e will be functioning properly. Traffic lights are based all off of traffic data and numbers. You just have to believe and hope it all works out in terms of these traffic lights.", "radicals": [], "reading_display": "\u3057\u3093\u3054\u3046", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E4%BF%A1%E5%8F%B7"}, {"char": "\u5f0f", "id": 3758, "image": null, "kanji": ["\u5f0f"], "meaning": "Ceremony", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "radicals": [], "reading_display": "\u3057\u304d", "reading_mnemonic": "The reading is the same as what you learned with the kanji. In fact, this kanji\u0027s on\u0027yomi AND kun\u0027yomi are \u3057\u304d, so you can never go wrong.", "url": "https://www.wanikani.com/vocabulary/%E5%BC%8F"}, {"char": "\u6574\u3048\u308b", "id": 7754, "image": null, "kanji": ["\u6574"], "meaning": "To Arrange", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003earrange\u003c/kanji\u003e, and the verb version also means \u003cvocabulary\u003eto arrange\u003c/vocabulary\u003e or \u003cvocabulary\u003eto put in order\u003c/vocabulary\u003e. This has to do with putting things in their rightful place, getting affairs in order, or even preparing equipment.", "radicals": [], "reading_display": "\u3068\u3068\u306e\u3048\u308b", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: \n\nEverything in your room has finally been \u003cvocabulary\u003eput in order\u003c/vocabulary\u003e. Just as you finish, you hear a crash and turn to see your dog has jumped up onto your desk. \"\u003creading\u003eToto no\u003c/reading\u003e (\u3068\u3068\u306e)!\" you yell as he knocks everything over. Guess you have  \u003cvocabulary\u003eto arrange\u003c/vocabulary\u003e  it all over again. Dammit Toto.", "url": "https://www.wanikani.com/vocabulary/%E6%95%B4%E3%81%88%E3%82%8B"}, {"char": "\u30b4\u30df\u7bb1", "id": 3858, "image": null, "kanji": ["\u7bb1"], "meaning": "Garbage Can", "meaning_mnemonic": "\u30b4\u30df means \"garbage.\" Add a \u003ckanji\u003ebox\u003c/kanji\u003e to it and you have a garbage box aka a \u003cvocabulary\u003egarbage can\u003c/vocabulary\u003e or \u003cvocabulary\u003egarbage bin\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3054\u307f\u3070\u3053", "reading_mnemonic": "The reading is just the kun\u0027yomi reading, the one you learned with the kanji. Be sure to pay attention to the rendaku though. \u306f\u3053 changes to \u3070\u3053.", "url": "https://www.wanikani.com/vocabulary/%E3%82%B4%E3%83%9F%E7%AE%B1"}, {"char": "\u5371\u306a\u3044", "id": 3816, "image": null, "kanji": ["\u5371"], "meaning": "Dangerous", "meaning_mnemonic": "This is a single kanji with an \u3044 on the end, meaning you know it\u0027s probably an adjective. What\u0027s the adjective form of \u003ckanji\u003edangerous\u003c/kanji\u003e? It\u0027s \u003cvocabulary\u003edangerous\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3042\u3076\u306a\u3044", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: Someone is in danger! It\u0027s poor old \u003creading\u003eabe\u003c/reading\u003e (\u3042\u3076) Lincoln. You try to save him, yelling out \u5371\u306a\u3044\u3088\uff01\uff01\uff01\uff01, but he gets shot in the back of the head anyways.", "url": "https://www.wanikani.com/vocabulary/%E5%8D%B1%E3%81%AA%E3%81%84"}, {"char": "\u5371\u967a", "id": 3815, "image": null, "kanji": ["\u5371", "\u967a"], "meaning": "Risky", "meaning_mnemonic": "Something that is \u003ckanji\u003edangerous\u003c/kanji\u003e and \u003ckanji\u003erisky\u003c/kanji\u003e is probably pretty \u003cvocabulary\u003erisky\u003c/vocabulary\u003e, \u003cvocabulary\u003edangerous\u003c/vocabulary\u003e, and \u003cvocabulary\u003eunsafe\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u304d\u3051\u3093", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E5%8D%B1%E9%99%BA"}, {"char": "\u7bb1", "id": 3859, "image": null, "kanji": ["\u7bb1"], "meaning": "Box", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "radicals": [], "reading_display": " u5e38\u306b", "id": 3982, "image": null, "kanji": ["\u5e38"], "meaning": "Always", "meaning_mnemonic": "The particle \u306b here is a clue that this word is an adverb. An adverb describes actions, so what\u0027s a \u003ckanji\u003enormal\u003c/kanji\u003e action? It\u0027s one you\u0027re \u003cvocabulary\u003ealways\u003c/vocabulary\u003e, or \u003cvocabulary\u003econstantly\u003c/vocabulary\u003e, doing. That\u0027s what makes it normal!", "radicals": [], "reading_display": "\u3064\u306d\u306b", "reading_mnemonic": "The reading is the kun\u0027yomi reading, which you didn\u0027t learn. In order to learn it, think of this:\n\nI \u003cvocabulary\u003ealways\u003c/vocabulary\u003e \u003creading\u003etune\u003c/reading\u003e (\u3064\u306d) my violin, but today I didn\u0027t tune it. So, now I sound terrible. Imagine how terrible my untuned violin sounds, compared to how it always sounds.", "url": "https://www.wanikani.com/vocabulary/%E5%B8%B8%E3%81%AB"}, {"char": "\u7121\u3057", "id": 7590, "image": null, "kanji": ["\u7121"], "meaning": "Without", "meaning_mnemonic": "This is the noun version of the kanji \u003ckanji\u003enothing\u003c/kanji\u003e, so when you have nothing, you are \u003cvocabulary\u003ewithout\u003c/vocabulary\u003e. ", "radicals": [], "reading_display": "\u306a\u3057", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: \n\nWhen you are \u003cvocabulary\u003ewithout\u003c/vocabulary\u003e you don\u0027t have anything to eat either, so you end up \u003creading\u003egnashi\u003c/reading\u003eng (\u306a\u3057) your teeth together instead.", "url": "https://www.wanikani.com/vocabulary/%E7%84%A1%E3%81%97"}, {"char": "\u975e\u5e38", "id": 4045, "image": null, "kanji": ["\u975e", "\u5e38"], "meaning": "Emergency", "meaning_mnemonic": "When an \u003ckanji\u003einjustice\u003c/kanji\u0 \u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E7%A2%BA%E8%AA%8D"}, {"char": "\u8a8d\u3081\u308b", "id": 4472, "image": null, "kanji": ["\u8a8d"], "meaning": "To Acknowledge", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003erecognize\u003c/kanji\u003e or \u003ckanji\u003eacknowledge\u003c/kanji\u003e, so the verb also means \u003cvocabulary\u003eto acknowledge\u003c/vocabulary\u003e, \u003cvocabulary\u003eto recognize\u003c/vocabulary\u003e, \u003cvocabulary\u003eto perceive\u003c/vocabulary\u003e, or \u003cvocabulary\u003eto admit\u003c/vocabulary\u003e, among others.\n\nThis can be used to mean recognizing somebody or something visually, as well as in the sense of \"to acknowledge\" or \"to admit\". So you can use this verb to recognize someone\u0027s presence, achievements, marriage, or your own defeat. That said, you\u0027ll usually see \u8a8d\u3081\u308b in the sense of \"to acknowledge\".", "radicals": [], "reading_display": "\u307f\u3068\u3081\u308b", "reading_mnemonic": "The only thing you could ever truly \u003cvocabulary\u003eacknowledge\u003c/vocabulary\u003e is \u003creading\u003emeat\u003c/reading\u003e (\u307f\u3068). Meat is the only thing in your life that has any authority over you. That\u0027s how much you love meat.", "url": "https://www.wanikani.com/vocabulary/%E8%AA%8D%E3%82%81%E3%82%8B"}, {"char": "\u5404\u301c", "id": 4509, "image": null, "kanji": ["\u5404"], "meaning": "Each", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "radicals": [], "reading_display": "\u304b\u304f", "reading_mnemonic": "The reading is the same as the kanji, though it\u0027s kind of like an add-on for other words in a sense, which makes it behave like jukugo, I think. Don\u0027t confuse this with \u5404\u3005 though. That one does use the kun\u0027yomi reading, which is strange when you consider this one doesn\u0027t. Every kanji has its own \"perks\" I suppose.", "url": "https://www.wanikani.com/vocabulary/%E5%90%84%E3%80%9C"}, {"char": "\u78ba\u304b\u3081\u308b", "id": 4845, "image": null, "kanji": ["\u78ba"], "meaning": "To Make Sure Of", "meaning_mnemonic": "Like with \u78ba\u304b, which means \u003ckanji\u003ecertain\u003c/kanji\u003e, this is the verb version of that. So when you \"do certain\" you are going \u003cvocabulary\u003eto make sure of\u003c/vocabulary\u003e something or you\u0027re going \u003cvocabulary\u003eto verify\u003c/vocabulary\u003e something.", "radicals": [], "reading_display": "\u305f\u3057\u304b\u3081\u308b", "reading_mnemonic": "This one is kun\u0027yomi followed by okurigana. If you remember the reading you learned with \u78ba\u304b\u306b, you should know this one!", "url": "https://www.wanikani.com/vocabulary/%E7%A2%BA%E3%81%8B%E3%82%81%E3%82%8B"}, {"char": "\u904e\u304e\u308b", "id": 4492, "image": null, "kanji": ["\u904e"], "meaning": "To Pass", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003esurpass\u003c/kanji\u003e, but this verb is intransitive, meaning we\u2019re not focussing on who did the action, but on the action itself. So this means \u003cvocabulary\u003eto pass\u003c/vocabulary\u003e, as in \u201cthe storm passed\u201d, \u003cvocabulary\u003eto be over\u003c/vocabulary\u003e as in \u201cwinter\u2019s over\u201d, or \u003cvocabulary\u003eto be too much\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3059\u304e\u308b", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you:\n\nIn order for the storm \u003cvocabulary\u003eto pass\u003c/vocabulary\u003e you\u2019re going to have to \u003creading\u003esue\u003c/reading\u003e (\u3059) it. Sadly storms won\u2019t pass unless you take legal action these days.", "url": "https://www.wanikani.com/vocabulary/%E9%81%8E%E3%81%8E%E3%82%8B"}, {"char": "\u98db\u3070\u3059", "id": 4844, "image": null, "kanji": ["\u98db"], "meaning": "To Let Something Fly", "meaning_mnemonic": "Remember how \u98db\u3076 is to fly? Well this word is for when you make some thing fly. So, this word is \u003cvocabulary\u003eto let something fly\u003c/vocabulary\u003e or \u003cvocabulary\u003eto send something flying\u003c/vocabulary\u003e. It also means \u003cvocabulary\u003eto skip over something\u003c/vocabulary\u003e, such as someone\u0027s turn or a question on a test.", "radicals": [], "reading_display": "\u3068\u3070\u3059", "reading_mnemonic": "The reading is just like \u98db\u3076, so if you know that reading you\u0027re close. Here\u0027s a mnemonic to help you remember the second part:\n\nYou can use your strength \u003cvocabulary\u003eto let something fly\u003c/vocabulary\u003e, and that something is a \u003creading\u003ebus\u003c/reading\u003e (\u3070\u3059). You\u0027re that buff!", "url": "https://www.wanikani.com/vocabulary/%E9%A3%9B%E3%81%B0%E3%81%99"}, {"char": "\u30d0\u30b9\u505c", "id": 4584, "image": null, "kanji": ["\u505c"], "meaning": "Bus Stop", "meaning_mnemonic": "This is where the \u003ckanji\u003ebus\u003c/kanji\u003e (\u30d0\u30b9) halts. It\u0027s the \u003cvocabulary\u003ebus stop\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3070\u3059\u3066\u3044", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E3%83%90%E3%82%B9%E5%81%9C"}, {"char": "\u512a\u3057\u3044", "id": 4632, "image": null, "kanji": ["\u512a"], "meaning": "Gentle", "meaning_mnemonic": "This is a single kanji with an \u3044 on the end, meaning you know it\u0027s probably an adjective. What\u0027s the adjective form of \u003ckanji\u003egentle\u003c/kanji\u003e? It\u0027s \u003cvocabulary\u003egentle\u003c/vocabulary\u003e (but also \u003cvocabulary\u003ekind\u003c/vocabulary\u003e or \u003cvocabulary\u003ewarm hearted\u003c/vocabulary\u003e).", "radicals": [], "reading_display": "\u3084\u3055\u3057\u3044", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: What do people who are \u003cvocabulary\u003egentle\u003c/vocabulary\u003e and \u003cvocabulary\u003ekind\u003c/vocabulary\u003e say when someone asks of them a favor? Always \"\u003creading\u003eyessir\u003c/reading\u003e\" (\u3084\u3055). Always, always \"yessir\"!", "url": "https://www.wanikani.com/vocabulary/%E5%84%AA%E3%81%97%E3%81%84"}, {"char": "\u65ad\u3064", "id": 4858, "image": null, "kanji": ["\u65ad"], "meaning": "To Cut Off", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003ecut off\u003c/kanji\u003e so the verb vocab version is \u003cvocabulary\u003eto cut off\u003c/vocabulary\u003e.\n\nThis is often used metaphorically to describe cutting off things that tie us down mentally or societally. This includes ending bad habits, so it also means \u003cvocabulary\u003eto quit doing something\u003c/vocabulary\u003e.\n\nDon\u0027t confuse this with \u65ad\u308b which means \"to refuse.\" You know this is to cut off because of the \u3064, which hints that you have had \u003creading\u003etwo\u003c/reading\u003e (\u3064) too many chocolates, and it\u0027s time to cut you off.", "radicals": [], "reading_display": "\u305f\u3064", "reading_mnemonic": "URGH! The reading isn\u0027t even the same as \u65ad\u308b, how frustrating. \u003cvocabulary\u003eto cut off\u003c/vocabulary\u003e is read as \u305f\u3064. Instead of eating too many chocolates and getting cut off, maybe you\u0027re eating too many tater \u003creading\u003etots\u003c/reading\u003e (\u305f\u3064). Don\u0027t eat so many of those, it\u0027s unhealthy. You have \u003cvocabulary\u003eto cut off\u003c/vocabulary\u003e tater tots from your diet so you don\u0027t get fat.", "url": "https://www.wanikani.com/vocabulary/%E6%96%AD%E3%81%A4"}, {"char": "\u73fe\u306b", "id": 8714, "image": null, "kanji": ["\u73fe"], "meaning": "Actually", "meaning_mnemonic": "The \u003ckanji\u003epresent time\u003c/kanji\u003e is the time you\u0027re \u003cvocabulary\u003eactually\u003c/vocabulary\u003e in. You aren\u0027t \u003cvocabulary\u003ereally\u003c/vocabulary\u003e in any other time, because that\u0027s not how time works!", "radicals": [], "reading_display": "\u3052\u3093\u306b", "reading_mnemonic": "This has the same reading as the kanji you learned, meaning you know the reading!", "url": "https://www.wanikani.com/vocabulary/%E7%8F%BE%E3%81%AB"}, {"char": "\u73fe\u308c\u308b", "id": 4642, "image": null, "kanji": ["\u73fe"], "meaning": "To Appear", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji means \u003ckanji\u003eappear\u003c/kanji\u003e, so this word means \u003cvocabulary\u003eto appear\u003c/vocabulary\u003e or \u003cvocabulary\u003eto emerge\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3042\u3089\u308f\u308c\u308b", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you:\n\nSome kind of paranormal entity starts \u003cvocabulary\u003eto appear\u003c/vocabulary\u003e in front of you. \"You\u2026 \u003creading\u003eare a wa\u003c/reading\u003elrus (\u3042\u3089\u308f)!\" you scream, terrified. Yes, it seems a ghostly walrus has appeared before you. It has come from beyond the grave to warn you that the Crabigator will get you if you don\u0027t do your reviews!", "url": "https://www.wanikani.com/vocabulary/%E7%8F%BE%E3%82%8C%E3%82%8B"}, {"char": "\u78ba\u8a8d\u3059\u308b", "id": 4577, "image": null, "kanji": ["\u78ba", "\u8a8d"], "meaning": "To Confirm", "meaning_mnemonic": "\u78ba\u8a8d is confirmation. When that\u0027s a verb, you have \u003cvocabulary\u003eto confirm\u003c/vocabulary\u003e or \u003cvocabulary\u003eto verify\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u304b\u304f\u306b\u3093\u3059\u308b", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well. It will help immensely if you know the word \u78ba\u8a8d already as well.", "url": "https://www.wanikani.com/vocabulary/%E7%A2%BA%E8%AA%8D%E3%81%99%E3%82%8B"}, {"char": "\u964d\u308a\u308b", "id": 5937, "image": null, "kanji": ["\u964d"], "meaning": "To Get Off", "meaning_mnemonic": "The kanji is \u003ckanji\u003edescend\u003c/kanji\u003e, but this verb vocab word is \u003cvocabulary\u003eto get off\u003c/vocabulary\u003e, as in, to get off the train, or to get out of the car. If you think about trains back in the day, you had to descend down to the platform to get out of them, which is how this word became what it is. You know that this word is the \"to get off\" word because once you get off the train, you enter the \u003creading\u003ereal\u003c/reading\u003e (\u308a\u308b) world, where hardships are real and not as comfy as the train.\n\nFiguratively, this word also means \u003cvocabulary\u003eto step down\u003c/vocabulary\u003e, as in \"to give up\" or \"to resign\u201d from something. For example, you can say \u30cb\u30e5\u30fc\u30b9\u756a\u7d44\u3092\u964d\u308a\u308b (to step down from a news program) or \u30b2\u30fc\u30e0\u3092\u964d\u308a\u308b (to drop out of a game).", "radicals": [], "reading_display": "\u304a\u308a\u308b", "reading_mnemonic": "The reading is unlike anything you\u0027ve seen with this kanji. Just think about how you have \u003cvocabulary\u003eto get off\u003c/vocabulary\u003e at \u003creading\u003eO\u003c/reading\u003e-station. None of the other letters are your stop. Just \u003creading\u003eO\u003c/reading\u003e-Station (\u304a).", "url": "https://www.wanikani.com/vocabulary/%E9%99%8D%E3%82%8A%E3%82%8B"}, {"char": "\u904e\u304e", "id": 4662, "image": null, "kanji": ["\u904e"], "meaning": "Too Much", "meaning_mnemonic": "\u904e\u304e\u308b is \u003cvocabulary\u003eto pass\u003c/vocabulary\u003e. When you pass what is needed, what are you left with? Just this word: \u003cvocabulary\u003etoo much\u003c/vocabulary\u003e. This can also mean \u003cvocabulary\u003eafter\u003c/vocabulary\u003e, as in \"after 5pm\", and \u003cvocabulary\u003epast\u003c/vocabulary\u003e, as in \"past sixty\".", "radicals": [], "reading_display": "\u3059\u304e", "reading_mnemonic": "The reading comes from \u904e\u304e\u308b. Know that and you know \u003cvocabulary\u003etoo much\u003c/vocabulary\u003e. Dial it down to get \u904e\u304e.", "url": "https://www.wanikani.com/vocabulary/%E9%81%8E%E3%81%8E"}, {"char": "\u4fc2\u308f\u308b", "id": 3800, "image": null, "kanji": ["\u4fc2"], "meaning": "To Be Involved", "meaning_mnemonic": "You know that the kanji means \u003ckanji\u003econnection\u003c/kanji\u003e. This is a verb, so one meaning is \u003cvocabulary\u003eto be connected\u003c/vocabulary\u003e. It can also mean \u003cvocabulary\u003eto be involved\u003c/vocabulary\u003e and \u003cvocabulary\u003eto be related\u003c/vocabulary\u003e. Basically things that have to do with being connected with something else.\n\nDoes this all sound familiar? In fact, this is another way to write \u95a2\u308f\u308b, which you already learned! The two have exactly the same meaning, but this version is a bit less common.", "radicals": [], "reading_display": "\u304b\u304b\u308f\u308b", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. It\u0027s exactly the same as the reading for \u95a2\u308f\u308b, so here\u0027s a reminder of that mnemonic to help you:\n\nRemember the \"\u003creading\u003eKaw Kaw\u003c/reading\u003e (\u304b\u304b) Crow Gang\"? They are bad news, always eating from garbage and squawking \"kaw kaw\"... You don\u0027t want \u003cvocabulary\u003eto be involved\u003c/vocabulary\u003e with them.", "url": "https://www.wanikani.com/vocabulary/%E4%BF%82%E3%82%8F%E3%82%8B"}, {"char": "\u512a\u308c\u308b", "id": 8809, "image": null, "kanji": ["\u512a"], "meaning": "To Surpass", "meaning_mnemonic": "This is the verb version of the kanji \u003ckanji\u003esuperior\u003c/kanji\u003e, so it means \u003cvocabulary\u003eto surpass\u003c/vocabulary\u003e. Someone who is superior is always going to surpass and \u003cvocabulary\u003eto excel\u003c/vocabulary\u003e beyond others. That\u0027s what makes them so superior in the first place!\n\nThis is a formal word that is often used in writing or formal speech. ", "radicals": [], "reading_display": "\u3059\u3050\u308c\u308b", "reading_mnemonic": "If you want \u003cvocabulary\u003eto surpass\u003c/vocabulary\u003e everyone, you have to be \u003creading\u003esu\u003c/reading\u003eper \u003creading\u003egoo\u003c/reading\u003ed (\u3059\u3050) at stuff. Like, super good at everything. Not pretty good, not really good \u2014 \u003cem\u003esuper good\u003c/em\u003e. Only then can you surpass all the others.", "url": "https://www.wanikani.com/vocabulary/%E5%84%AA%E3%82%8C%E3%82%8B"}, {"char": "\u66ff\u3048\u308b", "id": 4837, "image": null, "kanji": ["\u66ff"], "meaning": "To Replace", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003ereplace\u003c/kanji\u003e so the verb vocab version is \u003cvocabulary\u003eto replace\u003c/vocabulary\u003e. You know that you\u0027re doing the replacing because of the \u003creading\u003eair\u003c/reading\u003e (\u3048\u308b). You\u0027re replacing the air as quickly as you can because if you don\u0027t you wouldn\u0027t be able to breathe in this small room.\n\n\u66ff\u3048\u308b means to replace something with another item of the same kind or equivalent, rather than changing its state. Wondering how it differs from \u4ee3\u3048\u308b? While \u4ee3\u3048\u308b stresses that you\u2019re using someone or something \u201cin place of another,\u201d \u66ff\u3048\u308b simply indicates the act of swapping one thing for another similar thing. ", "radicals": [], "reading_display": "\u304b\u3048\u308b", "reading_mnemonic": "The reading is the same as the one you learned with the kanji.", "url": "https://www.wanikani.com/vocabulary/%E6%9B%BF%E3%81%88%E3%82%8B"}, {"char": "\u73fe\u3059", "id": 4879, "image": null, "kanji": ["\u73fe"], "meaning": "To Show", "meaning_mnemonic": "This is the transitive version of \u73fe\u308c\u308b (to appear), so rather than something appearing on its own, you\u0027re making it appear. So this word means \u003cvocabulary\u003eto show\u003c/vocabulary\u003e or \u003cvocabulary\u003eto reveal\u003c/vocabulary\u003e, but it\u0027s usually used in set phrases like \u59ff\u3092\u73fe\u3059 (to show up) or \u6b63\u4f53\u3092\u73fe\u3059 (to reveal one\u0027s true nature).", "radicals": [], "reading_display": "\u3042\u3089\u308f\u3059", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You learned that reading with \u73fe\u308c\u308b, but here\u0027s a mnemonic to help you:\n\nThe monster under your bed decides \u003cvocabulary\u003eto show\u003c/vocabulary\u003e you its true form. \"You\u2026 \u003creading\u003eare a wa\u003c/reading\u003elrus (\u3042\u3089\u308f)?\" you ask, shocked. Evidently, the monster under your bed was actually just a walrus who got in one day when you left the window open. You feel silly for being scared of it for so long, but you\u0027re glad it finally showed itself to you.", "url": "https://www.wanikani.com/vocabulary/%E7%8F%BE%E3%81%99"}, {"char": "\u964d\u308d\u3059", "id": 7724, "image": null, "kanji": ["\u964d"], "meaning": "To Take Down", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. You already learned that \u964d\u308a\u308b means \"to get off.\" This is when you\u0027re helping something else descend down from something, not when you yourself are getting down. So it means \u003cvocabulary\u003eto take down\u003c/vocabulary\u003e or \u003cvocabulary\u003eto lower\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u304a\u308d\u3059", "reading_mnemonic": "This word uses the kun\u0027yomi reading, which you already learned. Go you!", "url": "https://www.wanikani.com/vocabulary/%E9%99%8D%E3%82%8D%E3%81%99"}, {"char": "\u66ff\u308f\u308b", "id": 4838, "image": null, "kanji": ["\u66ff"], "meaning": "To Be Replaced", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003ereplace\u003c/kanji\u003e, and this word means \u003cvocabulary\u003eto be replaced\u003c/vocabulary\u003e, \u003cvocabulary\u003eto be substituted\u003c/vocabulary\u003e, and \u003cvocabulary\u003eto be switched\u003c/vocabulary\u003e.\n\nWondering about the difference between \u4ee3\u308f\u308b and \u66ff\u308f\u308b? \u4ee3\u308f\u308b is used when someone or something takes the place of another, like filling in for a sick coworker. Whereas \u66ff\u308f\u308b is used when things or situations switch places or are replaced with something new, like when talking about generations changing or a new governmental cabinet taking over.\n\nThis verb is intransitive, meaning it doesn\u0027t take a direct object. You\u0027ll sometimes see it with the particle \u3092, though, because the \u3092 is showing a \"path\" rather than a direct object in this case. For example, \u5e2d\u3092\u66ff\u308f\u308b (to switch seats) indicates your location is moving from one seat to another. Likewise, \u96fb\u8a71\u3092\u66ff\u308f\u308b indicates that a call is being handed off to another person.", "radicals": [], "reading_display": "\u304b\u308f\u308b", "reading_mnemonic": "The reading is the same as the one you learned with the kanji.", "url": "https://www.wanikani.com/vocabulary/%E6%9B%BF%E3%82%8F%E3%82%8B"}, {"char": "\u904e\u3054\u3059", "id": 4998, "image": null, "kanji": ["\u904e"], "meaning": "To Pass Time", "meaning_mnemonic": "\u904e\u304e\u308b means \"to pass,\" and \u904e\u3054\u3059 is \u003cvocabulary\u003eto pass time\u003c/vocabulary\u003e.\n\n\u904e\u3054\u3059 refers to how you live through or experience your time. So it usually needs some extra context when you use it, like what you do while passing time, who you pass it with, or what was it like. Check out the collocations and context sentences to get a better grasp of this word!", "radicals": [], "reading_display": "\u3059\u3054\u3059", "reading_mnemonic": "The reading is the same as  \u904e\u304e\u308b. If you know it, it\u0027s OK \u003cvocabulary\u003eto pass time\u003c/vocabulary\u003e relaxing for a bit! If you don\u2019t know it, maybe it\u0027s good \u003cvocabulary\u003eto spend time\u003c/vocabulary\u003e reviewing\u2026", "url": "https://www.wanikani.com/vocabulary/%E9%81%8E%E3%81%94%E3%81%99"}, {"char": "\u4e21\u66ff", "id": 5035, "image": null, "kanji": ["\u4e21", "\u66ff"], "meaning": "Change Money", "meaning_mnemonic": "Coins? Bills? \u003ckanji\u003eBoth\u003c/kanji\u003e can be \u003ckanji\u003ereplace\u003c/kanji\u003ed if you want to \u003cvocabulary\u003echange money\u003c/vocabulary\u003e at this \u003cvocabulary\u003emoney exchange\u003c/vocabulary\u003e. Just don\u2019t do your \u003cvocabulary\u003ecurrency exchange\u003c/vocabulary\u003e at the airport \u2014 the rates aren\u2019t so great.\n\nYou\u0027ll probably see this word the most in arcades where you can go to the \u4e21\u66ff machine and get coins to feed your crane game addiction.", "radicals": [], "reading_display": "\u308a\u3087\u3046\u304c\u3048", "reading_mnemonic": "The reading here is a bit weird. Instead of just being \u304b (it changes to \u304c for the rendaku), it is \u304c\u3048. Just think that if you want change exchanged, I\u0027m your \u003creading\u003eguy\u003c/reading\u003e (\u304c\u3048).", "url": "https://www.wanikani.com/vocabulary/%E4%B8%A1%E6%9B%BF"}, {"char": "\u6bb5\u968e", "id": 5049, "image": null, "kanji": ["\u6bb5", "\u968e"], "meaning": "Stage", "meaning_mnemonic": "Each time you take a \u003ckanji\u003estep\u003c/kanji\u003e up, you reach a new \u003ckanji\u003efloor\u003c/kanji\u003e\u2026 a new \u003cvocabulary\u003estage\u003c/vocabulary\u003e! We\u0027re talking metaphorical stages. You\u0027re making all kinds of progress. The first stage, the second stage. The third \u003cvocabulary\u003ephase\u003c/vocabulary\u003e. Man, you\u0027re blowing through all the stages and phases of Japanese learning. Keep it up!", "radicals": [], "reading_display": "\u3060\u3093\u304b\u3044", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E6%AE%B5%E9%9A%8E"}, {"char": "\u968e\u6bb5", "id": 5047, "image": null, "kanji": ["\u968e", "\u6bb5"], "meaning": "Stairs", "meaning_mnemonic": "To get to another \u003ckanji\u003efloor\u003c/kanji\u003e you have to go up one \u003ckanji\u003estep\u003c/kanji\u003e, then another, and another\u2026 These are \u003cvocabulary\u003estairs\u003c/vocabulary\u003e. The word you\u0027re looking for is stairs! Do you have any \u968e\u6bb5 in your house?", "radicals": [], "reading_display": "\u304b\u3044\u3060\u3093", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E9%9A%8E%E6%AE%B5"}, {"char": "\u5238", "id": 5130, "image": null, "kanji": ["\u5238"], "meaning": "Ticket", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.\n\n\u5238 is a standalone word that means \u003cvocabulary\u003eticket\u003c/vocabulary\u003e, but it\u0027s commonly used as a suffix to form words like \u5165\u5834\u5238 (admission ticket), \u5272\u5f15\u5238 (discount \u003cvocabulary\u003ecoupon\u003c/vocabulary\u003e), or \u5b9a\u671f\u5238 (commuter \u003cvocabulary\u003epass\u003c/vocabulary\u003e).", "radicals": [], "reading_display": "\u3051\u3093", "reading_mnemonic": "The reading is the same as what you learned with the kanji. Usually it\u0027s attached to things, because it tells you what kind of ticket something is.", "url": "https://www.wanikani.com/vocabulary/%E5%88%B8"}, {"char": "\u964d\u308b", "id": 5751, "image": null, "kanji": ["\u964d"], "meaning": "To Fall", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003edescend\u003c/kanji\u003e, but this word means something closer to \u003cvocabulary\u003eto fall\u003c/vocabulary\u003e or \u003cvocabulary\u003eto come down\u003c/vocabulary\u003e.\n\n\u964d\u308b is commonly used when talking about the weather, like \u96e8\u304c\u964d\u308b (it rains) or \u96ea\u304c\u964d\u308b (it snows). It also applies to other things falling from above, like \u706b\u5c71\u7070\u304c\u964d\u308b (volcanic ash falls) or even figuratively, as in \u5e78\u904b\u304c\u964d\u3063\u3066\u304f\u308b (good luck comes your way).", "radicals": [], "reading_display": "\u3075\u308b", "reading_mnemonic": "The rain is \u003cvocabulary\u003eto fall\u003c/vocabulary\u003e and you\u0027re outside anyway with your mouth open so you\u0027ll get a mouth \u003creading\u003efull\u003c/reading\u003e (\u3075\u308b) of rainwater! All the ponds, wells, and your yard will be full of water too!", "url": "https://www.wanikani.com/vocabulary/%E9%99%8D%E3%82%8B"}, {"char": "\u5feb\u3044", "id": 5311, "image": null, "kanji": ["\u5feb"], "meaning": "Pleasant", "meaning_mnemonic": "This is a single kanji with an \u3044 on the end, meaning you know it\u0027s probably an adjective. What\u0027s the adjective form of \u003ckanji\u003epleasant\u003c/kanji\u003e? It is also \u003cvocabulary\u003epleasant\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3053\u3053\u308d\u3088\u3044", "reading_mnemonic": "This word\u0027s reading is pretty weird. We\u0027re going to think back to a couple different words to put this one together. The word for heart (\u5fc3), is \u3053\u3053\u308d. The word for good is \u3088\u3044 (or \u3044\u3044, but for this word\u0027s sake, \u3088\u3044). A \"good heart (feeling)\" is one where your heart feels nice and warm and fuzzy (figuratively, not literally. If it\u0027s literal, go to the hospital please). That is a \u003cvocabulary\u003epleasant\u003c/vocabulary\u003e feeling. A \u3053\u3053\u308d\u3088\u3044 feeling.", "url": "https://www.wanikani.com/vocabulary/%E5%BF%AB%E3%81%84"}, {"char": "\u5feb\u901f", "id": 5313, "image": null, "kanji": ["\u5feb", "\u901f"], "meaning": "High Speed", "meaning_mnemonic": "It\u0027s \u003ckanji\u003epleasant\u003c/kanji\u003e but also \u003ckanji\u003efast\u003c/kanji\u003e. When getting on a train, it\u0027s nice to find a train that\u0027s both of these things. What makes it pleasant? That would be the \u003cvocabulary\u003ehigh speed\u003c/vocabulary\u003e. What makes it fast? Also the \u003cvocabulary\u003ehigh speed\u003c/vocabulary\u003e. Really, if you\u0027re on a train you\u0027d rather get to your destination sooner than later, so a high speed \u5feb\u901f train is the way to go.", "radicals": [], "reading_display": "\u304b\u3044\u305d\u304f", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E5%BF%AB%E9%80%9F"}, {"char": "\u62bc\u3055\u3048\u308b", "id": 9080, "image": null, "kanji": ["\u62bc"], "meaning": "To Hold Something Down", "meaning_mnemonic": "The kanji means \u003ckanji\u003epush\u003c/kanji\u003e, and this verb means things like \u003cvocabulary\u003eto hold something down\u003c/vocabulary\u003e and \u003cvocabulary\u003eto grasp something\u003c/vocabulary\u003e. This verb is pretty versatile, and you can use it if you\u0027re holding down a piece of paper, holding a cloth to a wound, or grasping a concept.", "radicals": [], "reading_display": "\u304a\u3055\u3048\u308b", "reading_mnemonic": "This has the same reading as the kanji you learned, so hopefully you can read this on your own.", "url": "https://www.wanikani.com/vocabulary/%E6%8A%BC%E3%81%95%E3%81%88%E3%82%8B"}, {"char": "\u62bc\u3057", "id": 7773, "image": null, "kanji": ["\u62bc"], "meaning": "Push", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "radicals": [], "reading_display": "\u304a\u3057", "reading_mnemonic": "This has the same reading as the kanji you learned, meaning you know the reading!", "url": "https://www.wanikani.com/vocabulary/%E6%8A%BC%E3%81%97"}, {"char": "\u62bc\u3059", "id": 5316, "image": null, "kanji": ["\u62bc"], "meaning": "To Push", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003epush\u003c/kanji\u003e so the verb vocab version is \u003cvocabulary\u003eto push\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u304a\u3059", "reading_mnemonic": "The reading is the one you learned with the kanji, actually!", "ur
