    <script>
    /* Language switcher + cookie initializer. Runs before any UI renders. */
    (function () {
        function getCookie(name) {
            var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return m ? m[2] : null;
        }
        function setCookie(name, value) {
            /* Scoped to the site, not to every project on *.github.io (B15). */
            var path = '/n3-kanji-flash/' || '/';
            document.cookie = name + '=' + value + '; path=' + path +
                '; max-age=31536000; SameSite=Lax';
        }
        if (!getCookie('lang')) {
            setCookie('lang', 'ja');
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-lang]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var newLang = a.getAttribute('data-lang');
                    setCookie('lang', newLang);
                    var m = location.pathname.match(/^(.*?)\/(en|ja)(\/.*)?$/);
                    var prefix = m ? m[1] : location.pathname.replace(/\/?[^\/]*$/, '');
                    var rest = (m && m[3]) ? m[3] : '/';
                    if (!rest.endsWith('/')) rest += '/';
                    location.href = prefix + '/' + newLang + rest;
                });
            });
        });
    })();
    </script>

<section class="test-shell" id="test-shell">
    <div class="range-panel" id="range-panel">

                    <span class="mode-name">WaniKani 方式</span>
                    <span class="mode-sub">入力して答える</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="test-mode" value="jlpt">
                    <span class="mode-name">JLPT 方式</span>
                    <span class="mode-sub">4択から選ぶ</span>
                </label>
            </div>
        </div>
        <h2 class="range-title">範囲を選ぶ</h2>
        <div class="range-row">
            <label for="range-from">開始</label>
            <input type="number" id="range-from" class="range-input" min="1" step="1"
                   inputmode="numeric" value="1">
            <label for="range-to">終了</label>
            <input type="number" id="range-to" class="range-input" min="1" step="1"
                   inputmode="numeric" value="1">
            <span class="range-of" id="range-of"></span>
        </div>
        <div class="range-hint" id="range-hint" aria-live="polite"></div>
        <button id="start-btn" class="btn btn-primary" type="button">開始</button>
    </div>

    <div class="test-top hidden" id="test-top">
        <span id="test-progress-text" class="test-progress-text"></span>
        <div class="progress-bar"><div id="test-progress-fill" class="progress-fill"></div></div>
        <span class="score-tracker">
            <span class="score-correct">✅ <span id="score-correct">0</span></span>
            <span class="score-wrong">❌ <span id="score-wrong">0</span></span>
        </span>
    </div>

    <div class="question-card hidden" id="question-card">
        <div class="question-label" id="question-label"></div>
        <div class="item-glyph" id="question-glyph">—</div>
        <input type="text" id="answer-input" class="answer-input" autocomplete="off"
               autocapitalize="off" autocorrect="off" spellcheck="false"
               aria-label="回答">
        <div class="jlpt-options hidden" id="jlpt-options" role="group"
             aria-label="JLPT 方式"></div>
        <div class="kana-preview hidden" id="kana-preview" aria-live="polite"></div>
        <div class="question-feedback hidden" id="question-feedback"></div>
        <div class="question-actions">
            <button id="check-btn" class="btn btn-primary" disabled>確認</button>
            <button id="show-btn" class="btn btn-link">答えを見る</button>
            <button id="continue-btn" class="btn btn-primary hidden">次へ</button>
        </div>
    </div>
</section>

<section class="test-shell hidden" id="test-result">
    <div class="question-card">
        <h2>テスト完了</h2>
        <div class="result-stats">
            <div class="stat-card"><div class="stat-num" id="final-correct">0</div><div class="stat-label">正解</div></div>
            <div class="stat-card"><div class="stat-num" id="final-wrong">0</div><div class="stat-label">不正解</div></div>
            <div class="stat-card"><div class="stat-num" id="final-pct">0%</div><div class="stat-label">正答率</div></div>
        </div>
        <div class="wrong-review hidden" id="wrong-review">
            <h3>復習する項目</h3>
            <div class="wrong-list" id="wrong-list"></div>
        </div>
        <div class="done-actions">
            <button id="retry-wrong-btn" class="btn btn-primary hidden">間違いだけやり直す</button>
            <button id="retake-btn" class="btn btn-secondary">もう一度受ける</button>
            <a class="btn btn-link" href="/n3-kanji-flash/ja/week/2/">← 第2週</a>
        </div>
    </div>
</section>
