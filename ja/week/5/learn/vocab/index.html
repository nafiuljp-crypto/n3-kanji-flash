    <script>
    /* Theme bootstrap. Runs before the stylesheet so data-theme is already
       set on the first paint (no flash of the wrong theme, including when
       navigating between pages). Saved choice beats the OS setting. */
    (function () {
        var KEY = 'n3theme:v1';

        function savedTheme() {
            try {
                var v = localStorage.getItem(KEY);
                return (v === 'dark' || v === 'light') ? v : null;
            } catch (e) { return null; }
        }

        function preferredTheme() {
            var saved = savedTheme();
            if (saved) return saved;
            return (window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var next = theme === 'dark' ? 'light' : 'dark';
            var label = btn.getAttribute('data-' + next) || next;
            btn.setAttribute('title', label);
            btn.setAttribute('aria-label', label);
        }

        /* The visible moon/sun label is swapped by CSS from data-theme; only
           the accessible name needs this late pass once the button exists. */
        applyTheme(preferredTheme());
        document.addEventListener('DOMContentLoaded', function () {
            applyTheme(document.documentElement.getAttribute('data-theme') ||
                preferredTheme());
        });
        document.addEventListener('click', function (e) {
            var btn = e.target && e.target.closest
                ? e.target.closest('#theme-toggle') : null;
            if (!btn) return;
            var next = document.documentElement.getAttribute('data-theme') === 'dark'
                ? 'light' : 'dark';
            try { localStorage.setItem(KEY, next); } catch (err) { /* private mode */ }
            applyTheme(next);
        });
    })();
    </script>
    <script>
    /* Password lock bootstrap. Runs before the stylesheet so the locked
       class is already on <html> for the first paint (no flash of page
       content). Only the SHA-256 of the site password is stored — here and
       as the localStorage value; the password itself is never written down.
       Any page with this key set to the hash stays unlocked in this browser. */
    (function () {
        var KEY = 'n3lock:v1';
        var HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
        var root = document.documentElement;

        function isUnlocked() {
            try { return localStorage.getItem(KEY) === HASH; } catch (e) { return false; }
        }

        function setLocked(locked) {
            root.classList.toggle('n3-locked', locked);
        }

        function sha256Hex(text) {
            return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text))
                .then(function (buf) {
                    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
                        return ('0' + b.toString(16)).slice(-2);
                    }).join('');
                });
        }

        setLocked(!isUnlocked());

        document.addEventListener('DOMContentLoaded', function () {
            var form = document.getElementById('lock-form');
            var input = document.getElementById('lock-input');
            var error = document.getElementById('lock-error');
            var errorTimer = null;

            function clearError() {
                if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
                if (error) error.hidden = true;
            }

            function showError() {
                if (!error) return;
                error.hidden = false;
                if (errorTimer) clearTimeout(errorTimer);
                errorTimer = setTimeout(clearError, 4000);
            }

            if (form && input) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    clearError();
                    var value = input.value;
                    if (!value) return;
                    if (!(window.crypto && crypto.subtle && window.TextEncoder)) return;
                    sha256Hex(value).then(function (hex) {
                        if (hex === HASH) {
                            try { localStorage.setItem(KEY, HASH); } catch (err) {}
                            setLocked(false);
                            input.value = '';
                            window.scrollTo(0, 0);
                        } else {
                            input.value = '';
                            input.focus();
                            showError();
                        }
                    }).catch(showError);
                });
                input.addEventListener('input', clearError);
                if (root.classList.contains('n3-locked')) input.focus();
            }

            var lockBtn = document.getElementById('lock-btn');
            if (lockBtn) {
                lockBtn.addEventListener('click', function () {
                    try { localStorage.removeItem(KEY); } catch (e) {}
                    setLocked(true);
                    clearError();
                    if (input) { input.value = ''; input.focus(); }
                    window.scrollTo(0, 0);
                });
            }
        });
    })();
    </script>

    /* Language switcher + cookie initializer. Runs before any UI renders. */
    (function () {
        function getCookie(name) {
            var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return m ? m[2] : null;
        }
        function setCookie(name, value) {
            /* Scoped to the site, not to every project on *.github.io (B15). */
            var path = '/n3-kanji-flash/' || '/';
            document.cookie = name + '=' + value + '; path=' + path +
                '; max-age=31536000; SameSite=Lax';
        }
        if (!getCookie('lang')) {
            setCookie('lang', 'ja');
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-lang]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var newLang = a.getAttribute('data-lang');
                    setCookie('lang', newLang);
                    var m = location.pathname.match(/^(.*?)\/(en|ja)(\/.*)?$/);
                    var prefix = m ? m[1] : location.pathname.replace(/\/?[^\/]*$/, '');
                    var rest = (m && m[3]) ? m[3] : '/';
                    if (!rest.endsWith('/')) rest += '/';
                    location.href = prefix + '/' + newLang + rest;
                });
            });
        });
    })();

cd\u09a6\u099f\u09be \u098f\u0995\u099f\u09be\u0987 \u0995\u09be\u099e\u09cd\u099c\u09bf \u09a6\u09bf\u09af\u09bc\u09c7 \u09a4\u09c8\u09b0\u09bf, \u09a4\u09be\u0987 \u0995\u09c1\u09a8\u09af\u09bc\u09cb\u09ae\u09bf \u09aa\u09a1\u09bc\u09be \u09b9\u09af\u09bc\u0964 \u098f\u099f\u09be \u09a0\u09bf\u0995 \u09b8\u09c7\u0987 \u09aa\u09a1\u09bc\u09be \u09af\u09c7\u099f\u09be \u09a4\u09c1\u09ae\u09bf \u098f\u0987 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09a4\u09c7 \u0986\u0997\u09c7 \u09b6\u09bf\u0996\u09c7\u099b\u09bf\u09b2\u09c7\u0964 \u09ae\u09c1\u0996\u09c7 \u09ac\u09b2\u09cb: \u09ae\u09c1\u09b6\u09bf\u0964", "url": "https://www.wanikani.com/vocabulary/%E8%99%AB"}, {"char": "\u305d\u306e\u4ed6", "id": 9088, "image": null, "kanji": ["\u4ed6"], "meaning": "The Others", "meaning_mnemonic": "\u305d\u306e means \"that\" or \"the\", and \u305d\u306e plus \u003ckanji\u003eother\u003c/kanji\u003e means things like \u003cvocabulary\u003ethe others\u003c/vocabulary\u003e, \u003cvocabulary\u003eother\u003c/vocabulary\u003e, and \u003cvocabulary\u003eother than that\u003c/vocabulary\u003e, depending on the context. ", "meaning_mnemonic_bn": "\u09ad\u09be\u09ac\u09cb, \u2018\u09b8\u09c7\u0987\u2019 \u09ac\u09be \u2018\u0993\u0987\u2019 \u09ac\u09cb\u099d\u09be\u09a8\u09cb \u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u2018\u0985\u09a8\u09cd\u09af\u2019 \u09ac\u09cb\u099d\u09be\u09a8\u09cb \u0995\u09be\u099e\u09cd\u099c\u09bf \u099c\u09c1\u09a1\u09bc\u09b2\u09c7 \u09b9\u09af\u09bc \u2018\u09ac\u09be\u0995\u09bf\u09b0\u09be\u2019, \u2018\u0985\u09a8\u09cd\u09af\u2019, \u09ac\u09be \u2018\u09a4\u09be\u09b0 \u09ac\u09be\u0987\u09b0\u09c7\u2019\u2014\u0995\u09cb\u09a8\u099f\u09be \u09b9\u09ac\u09c7, \u09aa\u09cd\u09b0\u09b8\u0999\u09cd\u0997\u09c7\u0987 \u09a0\u09bf\u0995 \u09b9\u09af\u09bc\u0964", "radicals": [], "reading_display": "\u305d\u306e\u307b\u304b", "reading_mnemonic": "This has two readings, but luckily you learned one of them when you learned the kanji, and the other one when you learned the word \u4ed6. The two readings are usually interchangeable, too.", "reading_mnemonic_bn": "\u09aa\u09a1\u09bc\u09be \u09a6\u09c1\u0987\u099f\u09be, \u09ad\u09af\u09bc \u09a8\u09c7\u0987: \u098f\u0995\u099f\u09be \u09b6\u09bf\u0996\u09c7\u099b \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09b8\u0999\u09cd\u0997\u09c7, \u0986\u09b0\u09c7\u0995\u099f\u09be \u09b6\u09bf\u0996\u09c7\u099b \u2018\u0985\u09a8\u09cd\u09af\u2019 \u09ac\u09cb\u099d\u09be\u09a8\u09cb \u09b6\u09ac\u09cd\u09a6\u099f\u09be\u09b0 \u09b8\u0999\u09cd\u0997\u09c7\u0964 \u09a6\u09c1\u099f\u09cb\u0987 \u09ae\u09cb\u099f\u09be\u09ae\u09c1\u099f\u09bf \u09ac\u09a6\u09b2\u09c7 \u099a\u09b2\u09c7\u0964 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb \u2018\u09b8\u09cb\u09a8\u09be\u09b0 \u09b9\u09be\u0981\u0995\u2019\u2014\u09b8\u09cb\u09a8\u09cb\u09b9\u09cb\u0995\u09be\u0964", "url": "https://www.wanikani.com/vocabulary/%E3%81%9D%E3%81%AE%E4%BB%96"}, {"char": "\u66f2", "id": 2866, "image": null, "kanji": ["\u66f2"], "meaning": "Tune", "meaning_mnemonic": "This almost shares the meaning with the kanji. It\u0027s essentially the same thing, though when it\u0027s alone it refers to a specific \u003cvocabulary\u003epiece of music\u003c/vocabulary\u003e (aka a \u003cvocabulary\u003etune\u003c/vocabulary\u003e).", "meaning_mnemonic_bn": "\u098f\u0987 \u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be \u09aa\u09cd\u09b0\u09be\u09af\u09bc \u098f\u0995\u0987 \u0985\u09b0\u09cd\u09a5\u0987 \u09a6\u09c7\u09af\u09bc\u0964 \u098f\u0995\u09be \u09a5\u09be\u0995\u09b2\u09c7 \u09ac\u09cb\u099d\u09be\u09af\u09bc \u0997\u09be\u09a8\u09c7\u09b0 \u098f\u0995\u099f\u09be \u09a8\u09bf\u09b0\u09cd\u09a6\u09bf\u09b7\u09cd\u099f \u099f\u09c1\u0995\u09b0\u09cb, \u09ae\u09be\u09a8\u09c7 \u098f\u0995\u099f\u09be \u09b8\u09c1\u09b0\u0964", "radicals": [], "reading_display": "\u304d\u3087\u304f", "reading_mnemonic": "The reading is the same as the one you learned with the kanji as well, so you should be able to read it.", "reading_mnemonic_bn": "\u09aa\u09a1\u09bc\u09be\u099f\u09be\u0993 \u09a0\u09bf\u0995 \u09b8\u09c7\u0987 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09ae\u09a4\u09cb\u0987, \u09a4\u09be\u0987 \u099a\u09bf\u09a8\u09a4\u09c7 \u09aa\u09be\u09b0\u09ac\u09c7 \u09b8\u09b9\u099c\u09c7\u0987\u2014\u09ae\u09c1\u0996\u09c7 \u09a4\u09c1\u09b2\u09cb \u0995\u09cd\u09af\u09cb\u0995\u09c1\u0964", "url": "https://www.wanikani.com/vocabulary/%E6%9B%B2"}, {"char": "\u5931\u3046", "id": 2941, "image": null, "kanji": ["\u5931"], "meaning": "To Lose", "meaning_mnemonic": "The kanji portion means \u003ckanji\u003efault\u003c/kanji\u003e, so you would think the verb version is \"to fault.\" It\u0027s a little different, though. Think of it this way, if you \"fault\" something, you\u0027re messing up. What\u0027s a great way to mess up? By losing something. That\u0027s why this word means \u003cvocabulary\u003eto lose\u003c/vocabulary\u003e. \n\nPretend like you are supposed to hold on to someone\u0027s wedding ring. You make the biggest fault of all. You lose it. Ouch.", "meaning_mnemonic_bn": "\u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be \u09ae\u09be\u09a8\u09c7 \u09a6\u09cb\u09b7, \u09a4\u09be\u0987 \u09ae\u09a8\u09c7 \u09b9\u09af\u09bc \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u099f\u09be \u09b9\u09ac\u09c7 \u09a6\u09cb\u09b7 \u09a6\u09c7\u0993\u09af\u09bc\u09be\u0964 \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u0995\u09bf\u099b\u09c1\u09a4\u09c7 \u09a6\u09cb\u09b7 \u09a6\u09bf\u09b2\u09c7 \u09a4\u09c1\u09ae\u09bf \u0997\u09cb\u09b2\u09ae\u09be\u09b2 \u0995\u09b0\u09cb\u0964 \u09b8\u09ac\u099a\u09c7\u09af\u09bc\u09c7 \u09ac\u09a1\u09bc \u0997\u09cb\u09b2\u09ae\u09be\u09b2 \u0995\u09c0? \u0995\u09bf\u099b\u09c1 \u09b9\u09be\u09b0\u09bf\u09af\u09bc\u09c7 \u09ab\u09c7\u09b2\u09be\u0964 \u09a4\u09be\u0987 \u098f\u09b0 \u09ae\u09be\u09a8\u09c7 \u09b9\u09be\u09b0\u09bf\u09af\u09bc\u09c7 \u09ab\u09c7\u09b2\u09be\u0964 \u09ad\u09be\u09ac\u09cb, \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u0995\u09be\u09b0\u0993 \u09ac\u09bf\u09af\u09bc\u09c7\u09b0 \u0986\u0982\u099f\u09bf \u0986\u0997\u09b2\u09c7 \u09b0\u09be\u0996\u09a4\u09c7 \u09a6\u09c7\u0993\u09af\u09bc\u09be \u09b9\u09af\u09bc\u09c7\u099b\u09c7\u0964 \u09a4\u09c1\u09ae\u09bf \u09b8\u09ac\u099a\u09c7\u09af\u09bc\u09c7 \u09ac\u09a1\u09bc \u09a6\u09cb\u09b7 \u0995\u09b0\u09b2\u09c7, \u0986\u0982\u099f\u09bf\u099f\u09be \u09b9\u09be\u09b0\u09bf\u09af\u09bc\u09c7 \u09ab\u09c7\u09b2\u09b2\u09c7\u0964 \u0989\u09ab!", "radicals": [], "reading_display": "\u3046\u3057\u306a\u3046", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: \n\nSo how did you lose the wedding ring anyway? Well... it was eaten by a cow. The \u003creading\u003e\u725b now\u003c/reading\u003e (\u3046\u3057 + \u306a\u3046) has to have it surgically removed. What a mess!", "reading_mnemonic_bn": "\u09a4\u09be\u09b9\u09b2\u09c7 \u0986\u0982\u099f\u09bf\u099f\u09be \u09b9\u09be\u09b0\u09be\u09b2 \u0995\u09c0\u09ad\u09be\u09ac\u09c7? \u098f\u0995\u099f\u09be \u0997\u09b0\u09c1 \u0993\u099f\u09be \u0996\u09c7\u09af\u09bc\u09c7 \u09ab\u09c7\u09b2\u09c7\u099b\u09c7\u0964 \u0997\u09b0\u09c1\u099f\u09be\u0995\u09c7 \u0989\u09b6\u09bf \u09a8\u09be\u0989 \u09ac\u09b2\u09c7 \u09a1\u09be\u0995\u09a4\u09c7 \u09b9\u09b2\u09cb, \u09a4\u09be\u09b0\u09aa\u09b0 \u0993\u09b0 \u09aa\u09c7\u099f \u09a5\u09c7\u0995\u09c7 \u09b8\u09be\u09b0\u09cd\u099c\u09be\u09b0\u09bf \u0995\u09b0\u09c7 \u0986\u0982\u099f\u09bf\u099f\u09be \u09ac\u09c7\u09b0 \u0995\u09b0\u09a4\u09c7 \u09b9\u09b2\u09cb\u0964 \u0995\u09c0 \u099c\u099f\u09bf\u09b2!", "url": "https://www.wanikani.com/vocabulary/%E5%A4%B1%E3%81%86"}, {"char": "\u5931\u793c", "id": 2942, "image": null, "kanji": ["\u5931", "\u793c"], "meaning": "Rude", "meaning_mnemonic": "When you do something that\u0027s your \u003ckanji\u003efault\u003c/kanji\u003e and then you say \"\u003ckanji\u003ethanks\u003c/kanji\u003e\" after you do it, that\u0027s super-duper \u003cvocabulary\u003erude\u003c/vocabulary\u003e, wouldn\u0027t you say? Imagine doing something like this and then thinking to yourself after... wow, I was really rude.\n\nThis is also often used to mean \u003cvocabulary\u003eexcuse me\u003c/vocabulary\u003e, typically followed by \u3067\u3059\u304c or \u3057\u307e\u3059. Occasionally, it\u2019s also used just on its own, usually when the speaker holds a higher or equal status to the person being spoken to. This particular usage is more prevalent among older generations and is commonly associated with masculine speech.\n", "meaning_mnemonic_bn": "\u09a8\u09bf\u099c\u09c7\u09b0 \u09a6\u09cb\u09b7 \u0995\u09b0\u09c7 \u09a4\u09be\u09b0\u09aa\u09b0 \u09a7\u09a8\u09cd\u09af\u09ac\u09be\u09a6 \u09ac\u09b2\u09c7 \u09a6\u09bf\u09b2\u09c7 \u09b8\u09c7\u099f\u09be \u0996\u09c1\u09ac \u0985\u09ad\u09a6\u09cd\u09b0\u0964 \u09ad\u09be\u09ac\u09cb, \u098f\u09ae\u09a8 \u0995\u09be\u099c \u0995\u09b0\u09c7 \u09aa\u09b0\u09c7 \u09ae\u09a8\u09c7 \u09b9\u09b2\u09cb\u2014\u0993\u09b9, \u0986\u09ae\u09bf \u09b8\u09a4\u09cd\u09af\u09bf\u0987 \u0985\u09ad\u09a6\u09cd\u09b0 \u099b\u09bf\u09b2\u09be\u09ae\u0964\n\n\u0995\u0996\u09a8\u09cb \u098f\u099f\u09bf \u09ae\u09be\u09ab \u0995\u09b0\u09ac\u09c7\u09a8 \u0985\u09b0\u09cd\u09a5\u09c7\u0993 \u0986\u09b8\u09c7; \u09aa\u09c7\u099b\u09a8\u09c7 \u0986\u09b0\u0993 \u0995\u09a5\u09be \u099c\u09c1\u09dc\u09b2\u09c7 \u09ac\u09cb\u099d\u09be \u09af\u09be\u09df\u0964", "radicals": [], "reading_display": "\u3057\u3064\u308c\u3044", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "reading_mnemonic_bn": "\u09b6\u09bf\u09a4\u09b8\u09c1-\u09b0\u09c7\u0987 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb: \u09b6\u09bf\u09a4\u09b8\u09c1 \u09ad\u09be\u0987\u09af\u09bc\u09be \u09b0\u09c7\u09b2\u09b2\u09be\u0987\u09a8\u09c7 \u09a6\u09be\u0981\u09a1\u09bc\u09bf\u09af\u09bc\u09c7 \u099a\u09c7\u0981\u099a\u09bf\u09af\u09bc\u09c7 \u09ac\u09b2\u09b2\u09c7\u09a8, \u09b0\u09c7\u0987!", "url": "https://www.wanikani.com/vocabulary/%E5%A4%B1%E7%A4%BC"}, {"char": "\u301c\u541b", "id": 3006, "image": null, "kanji": ["\u541b"], "meaning": "Boy Name Ender", "meaning_mnemonic": "Add this to the end of someone\u0027s name, it\u0027s like saying ______\u003ckanji\u003ebuddy\u003c/kanji\u003e. It\u0027s generally used as a name ender (like \u3055\u3093) for boys and young men. Don\u0027t use this on people who are higher ranked than you (socially or literally). As in, you wouldn\u0027t use it on your boss. Use it on your younger male subordinates as well as boys who aren\u0027t adults yet.", "meaning_mnemonic_bn": "\u0995\u09be\u09b0\u0993 \u09a8\u09be\u09ae\u09c7\u09b0 \u09b6\u09c7\u09b7\u09c7 \u098f\u099f\u09bf \u09af\u09cb\u0997 \u0995\u09b0\u09b2\u09c7 \u09ac\u09cb\u099d\u09be\u09af\u09bc \u09ac\u09a8\u09cd\u09a7\u09c1\u0964 \u09b8\u09be\u09a8\u09c7\u09b0 \u09ae\u09a4\u09cb \u09a8\u09be\u09ae\u09c7\u09b0 \u09b6\u09c7\u09b7\u09c7\u09b0 \u09aa\u09cd\u09b0\u09a4\u09cd\u09af\u09af\u09bc, \u099b\u09c7\u09b2\u09c7 \u0993 \u09a4\u09b0\u09c1\u09a3 \u09aa\u09c1\u09b0\u09c1\u09b7\u09a6\u09c7\u09b0 \u099c\u09a8\u09cd\u09af\u0964 \u09a4\u09cb\u09ae\u09be\u09b0 \u099a\u09c7\u09af\u09bc\u09c7 \u0989\u0981\u099a\u09c1 \u09aa\u09a6\u09c7\u09b0 \u09ae\u09be\u09a8\u09c1\u09b7\u09c7 \u098f\u099f\u09bf \u09a6\u09bf\u0993 \u09a8\u09be, \u09ac\u09b8\u0995\u09c7 \u09a8\u09af\u09bc\u0964 \u09a4\u09cb\u09ae\u09be\u09b0 \u09a8\u09bf\u099a\u09c7 \u0995\u09be\u099c \u0995\u09b0\u09be \u09aa\u09c1\u09b0\u09c1\u09b7 \u0986\u09b0 \u09af\u09be\u09b0\u09be \u098f\u0996\u09a8\u09cb \u09ac\u09a1\u09bc \u09b9\u09af\u09bc\u09a8\u09bf \u098f\u09ae\u09a8 \u099b\u09c7\u09b2\u09c7\u09b0 \u0995\u09cd\u09b7\u09c7\u09a4\u09cd\u09b0\u09c7 \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09cb\u0964", "radicals": [], "reading_display": "\u304f\u3093", "reading_mnemonic": "The reading is the same as the one you learned with the kanji (on\u0027yomi), probably because it usually is attached to other words (aka names, like \u3053\u3046\u3044\u3061\u541b) making it act more like jukugo words do.", "reading_mnemonic_bn": "\u09aa\u09a1\u09bc\u09be\u099f\u09be \u0995\u09c1\u09a8\u0964 \u0986\u0997\u09c7 \u09b6\u09c7\u0996\u09be \u098f\u0995\u0987 \u09aa\u09a1\u09bc\u09be, \u0995\u09be\u09b0\u09a3 \u098f\u099f\u09bf \u09b8\u09be\u09a7\u09be\u09b0\u09a3\u09a4 \u09a8\u09be\u09ae\u09c7\u09b0 \u09b6\u09c7\u09b7\u09c7 \u099c\u09c1\u09a1\u09bc\u09c7 \u09a5\u09be\u0995\u09c7, \u09af\u09c7\u09ae\u09a8 \u0995\u09cb\u0987\u099a\u09bf\u0995\u09c1\u09a8; \u09a4\u09be\u0987 \u0985\u09a8\u09cd\u09af \u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u099c\u09cb\u09a1\u09bc\u09be \u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u09ae\u09a4\u09cb \u0986\u099a\u09b0\u09a3 \u0995\u09b0\u09c7\u0964 \u0995\u09c1\u09a8\u09c1 \u09a8\u09be\u09ae\u09c7\u09b0 \u09b6\u09c1\u09b0\u09c1\u09b0 \u0995\u09c1\u09a8 \u09b6\u09c1\u09a8\u09c7 \u09aa\u09a1\u09bc\u09be\u099f\u09be \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb\u0964", "url": "https://www.wanikani.com/vocabulary/%E3%80%9C%E5%90%9B"}, {"char": "\u5168\u8eab", "id": 3028, "image": null, "kanji": ["\u5168", "\u8eab"], "meaning": "Whole Body", "meaning_mnemonic": "\u003ckanji\u003eAll\u003c/kanji\u003e of someone\u0027s \u003ckanji\u003ebody\u003c/kanji\u003e is their \u003cvocabulary\u003ewhole body\u003c/vocabulary\u003e or \u003cvocabulary\u003eentire body\u003c/vocabulary\u003e. ", "meaning_mnemonic_bn": "\u0995\u09be\u09b0\u0993 \u09b6\u09b0\u09c0\u09b0\u09c7\u09b0 \u09b8\u09ac \u0985\u0982\u09b6 \u098f\u0995\u09b8\u09be\u09a5\u09c7 \u09ae\u09bf\u09b2\u09b2\u09c7 \u09b8\u09c7\u099f\u09be\u0987 \u09a4\u09be\u09b0 \u0997\u09cb\u099f\u09be \u09b6\u09b0\u09c0\u09b0\u0964", "radicals": [], "reading_display": "\u305c\u3093\u3057\u3093", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "reading_mnemonic_bn": "\u09ae\u09c1\u0996\u09c7 \u09ae\u09c1\u0996\u09c7 \u099c\u09c7\u09a8 \u09b6\u09bf\u09a8 \u09ac\u09b2\u09cb\u0964 \u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be\u0987 \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09aa\u09a1\u09bc\u09be\u099f\u09be \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09a4\u09c7 \u09b8\u09be\u09b9\u09be\u09af\u09cd\u09af \u0995\u09b0\u09ac\u09c7\u0964", "url": "https://www.wanikani.com/vocabulary/%E5%85%A8%E8%BA%AB"}, {"char": "\u541b", "id": 3005, "image": null, "kanji": ["\u541b"], "meaning": "You", "meaning_mnemonic": "Okay, so the kanji itself means \u003ckanji\u003ebuddy\u003c/kanji\u003e and so does the word, but it also means \u003cvocabulary\u003eyou\u003c/vocabulary\u003e as well. This is one of the several ways to say \"you\" in Japanese, and this one is kind of an \"affectionate\" you. Maybe you\u0027d say it with someone you\u0027re close to. Maybe you\u0027d say it with a girlfriend or boyfriend. You wouldn\u0027t want to use it with your boss or teacher, though. Make sure to keep that in mind. It\u0027s kind of like saying \"hey buddy\" or \"hey you,\" after all.", "meaning_mnemonic_bn": "\u098f\u0987 \u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be \u09ae\u09be\u09a8\u09c7 \u09ac\u09a8\u09cd\u09a7\u09c1, \u0986\u09b0 \u09b6\u09ac\u09cd\u09a6\u099f\u09be\u0993 \u09ac\u09a8\u09cd\u09a7\u09c1 \u09ac\u09cb\u099d\u09be\u09af\u09bc, \u09a4\u09ac\u09c7 \u098f\u099f\u09be \u09a4\u09cb\u09ae\u09be\u0995\u09c7\u0993 \u09ac\u09cb\u099d\u09be\u09af\u09bc\u0964 \u099c\u09be\u09aa\u09be\u09a8\u09bf\u09a4\u09c7 \u0995\u09be\u099b\u09c7\u09b0 \u0995\u09be\u0989\u0995\u09c7 \u09a1\u09be\u0995\u09be\u09b0 \u09ae\u09a4\u09cb \u0986\u09a6\u09b0\u09c7\u09b0 \u09a4\u09c1\u09ae\u09bf\u0964 \u09aa\u09cd\u09b0\u09c7\u09ae\u09bf\u0995 \u09ac\u09be \u09aa\u09cd\u09b0\u09c7\u09ae\u09bf\u0995\u09be\u0995\u09c7 \u09ac\u09b2\u09be \u09af\u09be\u09af\u09bc; \u09ac\u09b8 \u09ac\u09be \u09b6\u09bf\u0995\u09cd\u09b7\u0995\u0995\u09c7 \u09a8\u09af\u09bc\u0964 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb, \u098f\u099f\u09be \u09af\u09c7\u09a8 \u098f\u0987 \u09ac\u09a8\u09cd\u09a7\u09c1 \u09ac\u09be \u098f\u0987 \u09a4\u09c1\u09ae\u09bf \u09a1\u09be\u0995\u09be\u09b0 \u09ae\u09a4\u09cb\u0964", "radicals": [], "reading_display": "\u304d\u307f", "reading_mnemonic": "Since this word is made up of a single kanji, it should use the kun\u0027yomi reading. When learning the kanji, you didn\u0027t learn that reading, so here\u0027s a mnemonic to help you with this word: \n\nWho\u0027s your \u003cvocabulary\u003ebuddy\u003c/vocabulary\u003e? It\u0027s \u003creading\u003eKimmy\u003c/reading\u003e (\u304d\u307f)! If you know a Kimmy, imagine her. If you don\u0027t, find a famous Kimmy or make up a Kimmy to imagine. You ask... is it you?? Wait, you\u0027re my buddy?", "reading_mnemonic_bn": "\u09a4\u09cb\u09ae\u09be\u09b0 \u09ac\u09a8\u09cd\u09a7\u09c1 \u0995\u09c7? \u0995\u09bf\u09ae\u09bf! \u099c\u09be\u09aa\u09be\u09a8\u09bf \u0989\u099a\u09cd\u099a\u09be\u09b0\u09a3 \u0995\u09bf\u09ae\u09bf-\u09b0 \u09ae\u09a4\u09cb \u09b6\u09cb\u09a8\u09be\u09af\u09bc\u0964 \u0995\u09cb\u09a8\u09cb \u0995\u09bf\u09ae\u09bf\u0995\u09c7 \u099a\u09bf\u09a8\u09b2\u09c7 \u09a4\u09be\u0995\u09c7 \u0995\u09b2\u09cd\u09aa\u09a8\u09be \u0995\u09b0\u09cb; \u09a8\u09be \u099a\u09bf\u09a8\u09b2\u09c7 \u09ac\u09bf\u0996\u09cd\u09af\u09be\u09a4 \u0995\u09bf\u09ae\u09bf \u09ad\u09be\u09ac\u09cb\u0964 \u09a4\u09c1\u09ae\u09bf \u099c\u09bf\u099c\u09cd\u099e\u09c7\u09b8 \u0995\u09b0\u09cb, \u09a4\u09c1\u09ae\u09bf\u0987? \u0986\u09b0\u09c7, \u09a4\u09c1\u09ae\u09bf \u0986\u09ae\u09be\u09b0 \u09ac\u09a8\u09cd\u09a7\u09c1?", "url": "https://www.wanikani.com/vocabulary/%E5%90%9B"}, {"char": "\u66f2\u3052\u308b", "id": 3462, "image": null, "kanji": ["\u66f2"], "meaning": "To Bend", "meaning_mnemonic": "This is a verb because it ends with an \u3046 sound. What does the kanji mean? It\u0027s \u003ckanji\u003emusic\u003c/kanji\u003e and \u003ckanji\u003ebend\u003c/kanji\u003e. In the case of this word, we\u0027re going with the \"bend\" version. The verb of that is \u003cvocabulary\u003eto bend\u003c/vocabulary\u003e. This is when you\u0027re doing the bending. You can remember this because \u3052 kind of looks like the \u003creading\u003ege\u003c/reading\u003ecko you\u0027re bending. That gecko looked good before you bent him in half.", "meaning_mnemonic_bn": "\u098f\u099f\u09be \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09aa\u09a6, \u0995\u09be\u09b0\u09a3 \u09b6\u09c7\u09b7\u09c7 \u0989 \u09a7\u09cd\u09ac\u09a8\u09bf \u09b6\u09cb\u09a8\u09be \u09af\u09be\u09af\u09bc\u0964 \u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be \u09b8\u0982\u0997\u09c0\u09a4 \u0986\u09b0 \u09ac\u09be\u0981\u0995\u09be\u09a8\u09cb \u09a6\u09c1\u099f\u09cb\u0987 \u09ac\u09cb\u099d\u09be\u09af\u09bc; \u098f\u0996\u09be\u09a8\u09c7 \u09ac\u09be\u0981\u0995\u09be\u09a8\u09cb \u0985\u09b0\u09cd\u09a5 \u09a8\u09bf\u099a\u09cd\u099b\u09bf\u0964 \u09a4\u09c1\u09ae\u09bf \u09a8\u09bf\u099c\u09c7\u0987 \u09ac\u09be\u0981\u0995\u09be\u099a\u09cd\u099b\u0964 \u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u09b6\u09c7\u09b7\u09c7\u09b0 \u09ac\u09be\u0981\u0995\u09be \u09b9\u09b0\u09ab\u099f\u09be \u09a6\u09c7\u0996\u09a4\u09c7 \u0997\u09c7\u0995\u09cb\u09b0 \u09ae\u09a4\u09cb; \u09a4\u09be\u0995\u09c7 \u0985\u09b0\u09cd\u09a7\u09c7\u0995 \u09ac\u09be\u0981\u0995\u09be\u09a8\u09cb\u09b0 \u0986\u0997\u09c7 \u09b8\u09c7 \u09b8\u09c1\u09a8\u09cd\u09a6\u09b0 \u099b\u09bf\u09b2\u0964", "radicals": [], "reading_display": "\u307e\u3052\u308b", "reading_mnemonic": "How were you able \u003cvocabulary\u003eto bend\u003c/vocabulary\u003e this gecko? Solo effort? No way! It actually took both you and your \u003creading\u003ema\u003c/reading\u003ema (\u307e) to make it happen! Just imagine you and your mighty mama, tag-teaming to bend a gecko in half!", "reading_mnemonic_bn": "\u098f\u0987 \u0997\u09c7\u0995\u09cb\u0995\u09c7 \u09ac\u09be\u0981\u0995\u09be\u09a4\u09c7 \u09a4\u09c1\u09ae\u09bf \u098f\u0995\u09be \u09aa\u09be\u09b0\u09b2\u09c7? \u098f\u0995\u09a6\u09ae \u09a8\u09be! \u09a4\u09cb\u09ae\u09be\u09b0 \u09b8\u09be\u09a5\u09c7 \u09a4\u09cb\u09ae\u09be\u09b0 \u09ae\u09be \u09b2\u09c7\u0997\u09c7\u099b\u09bf\u09b2; \u09a4\u09cb\u09ae\u09b0\u09be \u09a6\u09c1\u099c\u09a8\u09c7 \u09ae\u09bf\u09b2\u09c7 \u0997\u09c7\u0995\u09cb\u0995\u09c7 \u0985\u09b0\u09cd\u09a7\u09c7\u0995 \u09ac\u09be\u0981\u0995\u09bf\u09af\u09bc\u09c7 \u09a6\u09bf\u09b2\u09c7\u0964 \u098f\u09ad\u09be\u09ac\u09c7\u0987 \u09ae\u09be \u09a7\u09cd\u09ac\u09a8\u09bf \u09a5\u09c7\u0995\u09c7 \u09ae\u09be\u0997\u09c7\u09b0\u09c1 \u0995\u09a5\u09be\u099f\u09be \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb\u0964", "url": "https://www.wanikani.com/vocabulary/%E6%9B%B2%E3%81%92%E3%82%8B"}, {"char": "\u8eab", "id": 5503, "image": null, "kanji": ["\u8eab"], "meaning": "Body", "meaning_mnemonic": "The kanji and the vocab word are the same, so this means \u003cvocabulary\u003ebody\u003c/vocabulary\u003e or \u003cvocabulary\u003eoneself\u003c/vocabulary\u003e. It also refers to \u003cvocabulary\u003eanimal flesh\u003c/vocabulary\u003e sometimes, meaning the non-bone edible parts of animals, including seafood. It\u0027s the \"mi\" in sashimi!\n\nWondering about the difference between \u4f53 and \u8eab? Basically, \u4f53 is for the physical human (or animal) body as a whole, and is often used in relation to its condition or appearance. \u8eab can refer to a physical human body too, but unlike \u4f53, it\u0027s also used to refer to the self as an individual and, by extension, to one\u0027s social standing or circumstances.", "meaning_mnemonic_bn": "\u098f\u0987 \u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be\u0987\u2014\u0985\u09b0\u09cd\u09a5 \u09b6\u09b0\u09c0\u09b0 \u09ac\u09be \u09a8\u09bf\u099c\u09c7\u0964 \u09ae\u09be\u099d\u09c7 \u09ae\u09be\u099d\u09c7 \u09aa\u09b6\u09c1\u09b0 \u09ae\u09be\u0982\u09b8\u0993 \u09ac\u09cb\u099d\u09be\u09af\u09bc: \u09b9\u09be\u09a1\u09bc \u099b\u09be\u09a1\u09bc\u09be \u0996\u09be\u0993\u09af\u09bc\u09be\u09b0 \u0985\u0982\u09b6, \u09ae\u09be\u099b-\u099a\u09bf\u0982\u09a1\u09bc\u09bf\u09b8\u09b9\u0964 \u09b8\u09be\u09b6\u09bf\u09ae\u09bf\u09b0 \u0027\u09ae\u09bf\u0027 \u098f\u0996\u09be\u09a8\u09c7\u0987! \u0986\u09b0\u09c7\u0995\u099f\u09bf \u09a6\u09c7\u09b9-\u0995\u09be\u099e\u09cd\u099c\u09bf \u09aa\u09c1\u09b0\u09cb \u09b6\u09b0\u09c0\u09b0, \u099a\u09c7\u09b9\u09be\u09b0\u09be-\u0985\u09ac\u09b8\u09cd\u09a5\u09be \u09ac\u09cb\u099d\u09be\u09af\u09bc; \u098f\u0987 \u0995\u09be\u099e\u09cd\u099c\u09bf \u09a8\u09bf\u099c\u09c7\u0995\u09c7, \u09b8\u09be\u09ae\u09be\u099c\u09bf\u0995 \u0985\u09ac\u09b8\u09cd\u09a5\u09be\u09a8-\u09aa\u09b0\u09bf\u09b8\u09cd\u09a5\u09bf\u09a4\u09bf\u0993 \u09ac\u09cb\u099d\u09be\u09af\u09bc\u0964", "radicals": [], "reading_display": "\u307f", "reading_mnemonic": "Since this word is made up of a single kanji, it probably uses the kun\u0027yomi reading. You did not learn this reading, so here\u0027s a mnemonic to help you to remember: \n\nWho does this \u003cvocabulary\u003ebody\u003c/vocabulary\u003e belong to? To \u003creading\u003eme\u003c/reading\u003e (\u307f)!", "reading_mnemonic_bn": "\u098f\u0987 \u09b6\u09b0\u09c0\u09b0\u099f\u09be \u0995\u09be\u09b0? \u0986\u09ae\u09be\u09b0! \u09a4\u09be\u0987 \u09aa\u09a1\u09bc\u09be\u09b0 \u09b8\u09ae\u09af\u09bc \u0027\u09ae\u09bf\u0027 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb\u2014\u099c\u09be\u09aa\u09be\u09a8\u09bf\u09a4\u09c7 \u098f\u0987 \u09aa\u09a1\u09bc\u09be\u09b0 \u0989\u099a\u09cd\u099a\u09be\u09b0\u09a3\u0987 \u0027\u09ae\u09bf\u0027\u0964", "url": "https://www.wanikani.com/vocabulary/%E8%BA%AB"}, {"char": "\u66f2\u304c\u308b", "id": 3429, "image": null, "kanji": ["\u66f2"], "meaning": "To Be Bent", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means both \u003ckanji\u003emusic\u003c/kanji\u003e and \u003ckanji\u003ebend\u003c/kanji\u003e. For this word, we\u0027re looking at \"bend.\" So the verb \u66f2\u304c\u308b is \u003cvocabulary\u003eto be bent\u003c/vocabulary\u003e. \n\nIt\u0027s intransitive, so don\u0027t give it a direct object. Use it to say something gets bent or bends: a knee is bent, the road bends \u2014 that sort of thing. \n\nVerbs ending in okurigana that rhyme with \u3042\u308b tend to be intransitive like this. You can remember this because if something is \u3042\u308b, it\u0027s just there, existing, not acting \u003cem\u003eon\u003c/em\u003e anything else. That\u0027s why verbs that sound like it are often intransitive too!", "meaning_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u09c7 \u099a\u09bf\u09b9\u09cd\u09a8\u09c7\u09b0 \u09b8\u09be\u09a5\u09c7 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be \u099c\u09cb\u09a1\u09bc\u09be\u0964 \u09b6\u09c7\u09b7\u09c7 \u0989-\u098f\u09b0 \u09ae\u09a4\u09cb \u09b6\u09ac\u09cd\u09a6 \u09a5\u09be\u0995\u09be\u09af\u09bc \u09ac\u09cb\u099d\u09cb \u098f\u099f\u09be \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u0964 \u099a\u09bf\u09b9\u09cd\u09a8\u099f\u09be \u09b8\u0982\u0997\u09c0\u09a4 \u0986\u09b0 \u09ac\u09be\u0981\u0995\u09be\u09a8\u09cb\u2014\u09a6\u09c1\u099f\u09cb\u0987 \u09ac\u09cb\u099d\u09be\u09af\u09bc\u0964 \u098f\u0996\u09be\u09a8\u09c7 \u09a8\u09bf\u099a\u09cd\u099b\u09bf \u09ac\u09be\u0981\u0995\u09be\u09a8\u09cb\u0964 \u09a4\u09be\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be\u09b0 \u0985\u09b0\u09cd\u09a5 \u09ac\u09be\u0981\u0995\u09be \u09b9\u09af\u09bc\u09c7 \u09a5\u09be\u0995\u09be\u0964\n\n\u098f\u099f\u09be \u0985\u0995\u09b0\u09cd\u09ae\u0995, \u09a4\u09be\u0987 \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u0995\u09b0\u09cd\u09ae \u09a6\u09bf\u0993 \u09a8\u09be\u0964 \u09b9\u09be\u0981\u099f\u09c1 \u09ac\u09be\u0981\u0995\u09be \u09b9\u09af\u09bc, \u09b0\u09be\u09b8\u09cd\u09a4\u09be \u09ac\u09be\u0981\u0995\u09c7\u2014\u098f\u09ae\u09a8 \u0995\u09cd\u09b7\u09c7\u09a4\u09cd\u09b0\u09c7 \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u0995\u09b0\u09cb\u0964 \u09af\u09c7 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09b0 \u09b6\u09c7\u09b7\u09c7 \u0993\u0995\u09c1\u09b0\u09bf\u0997\u09be\u09a8\u09be \u0986\u09b0\u09c1-\u098f\u09b0 \u09ae\u09a4\u09cb \u09b6\u09cb\u09a8\u09be\u09af\u09bc, \u09b8\u09c7\u0997\u09c1\u09b2\u09cb \u09aa\u09cd\u09b0\u09be\u09af\u09bc\u0987 \u0985\u0995\u09b0\u09cd\u09ae\u0995\u0964 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb: \u0986\u09b0\u09c1 \u09ae\u09be\u09a8\u09c7 \u09b6\u09c1\u09a7\u09c1 \u0986\u099b\u09c7, \u0985\u09a8\u09cd\u09af \u0995\u09bf\u099b\u09c1\u09b0 \u0993\u09aa\u09b0 \u0995\u09be\u099c \u0995\u09b0\u099b\u09c7 \u09a8\u09be\u0964", "radicals": [], "reading_display": "\u307e\u304c\u308b", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You already learned this reading with \u66f2\u3052\u308b, so you should be good to go!", "reading_mnemonic_bn": "\u098f\u099f\u09be \u0995\u09c1\u09a8-\u09aa\u09a1\u09bc\u09be\u0964 \u09ac\u09be\u0981\u0995\u09be\u09a8\u09cb \u0985\u09b0\u09cd\u09a5\u09c7\u09b0 \u0986\u0997\u09c7\u09b0 \u09b6\u09ac\u09cd\u09a6\u099f\u09be\u09a4\u09c7\u0987 \u098f\u0987 \u09aa\u09a1\u09bc\u09be \u09b6\u09bf\u0996\u09c7 \u09ab\u09c7\u09b2\u09c7\u099b\u0964 \u09ae\u09be\u0997\u09c1\u09b0 \u09ae\u09be\u099b\u0995\u09c7 \u09a1\u09be\u0995\u09cb: \u09ae\u09be\u0997\u09be\u09b0\u09c1\u0964", "url": "https://www.wanikani.com/vocabulary/%E6%9B%B2%E3%81%8C%E3%82%8B"}, {"char": "\u304a\u9152", "id": 3163, "image": null, "kanji": ["\u9152"], "meaning": "Sake", "meaning_mnemonic": "This is just the noun version of the kanji \u9152 - it has an \u304a there to be nice. This word can mean both \u003cvocabulary\u003ealcohol\u003c/vocabulary\u003e (like the parent kanji) or \u003cvocabulary\u003esake\u003c/vocabulary\u003e (the main kind of Japanese alcohol, at least back in the kanji days).", "meaning_mnemonic_bn": "\u098f\u099f\u09be \u09ae\u09a6-\u09ac\u09cb\u099d\u09be\u09a8\u09cb \u0985\u0995\u09cd\u09b7\u09b0\u099f\u09be\u09b0 \u09a8\u09be\u09ae\u09c7\u09b0 \u09b0\u09c2\u09aa\u0964 \u09ad\u09a6\u09cd\u09b0\u09a4\u09be\u09b0 \u099c\u09a8\u09cd\u09af \u09b8\u09be\u09ae\u09a8\u09c7 \u098f\u0995\u099f\u09be \u0027\u0993\u0027 \u09ac\u09b8\u09be\u09a8\u09cb\u0964 \u098f \u09b6\u09ac\u09cd\u09a6 \u09b8\u09be\u09a7\u09be\u09b0\u09a3 \u09ae\u09a6\u0993 \u09ac\u09cb\u099d\u09be\u09af\u09bc, \u0986\u09ac\u09be\u09b0 \u099c\u09be\u09aa\u09be\u09a8\u09c7\u09b0 \u09aa\u09cd\u09b0\u09a7\u09be\u09a8 \u09ae\u09a6 \u09b8\u09be\u0995\u09c7\u0993 \u09ac\u09cb\u099d\u09be\u09af\u09bc\u0964", "radicals": [], "reading_display": "\u304a\u3055\u3051", "reading_mnemonic": "The reading is kun\u0027yomi, which isn\u0027t what you learned with the kanji. But, it should be pretty easy. You know what Japanese alcohol is called already, right? It\u0027s \u003creading\u003e\u3055\u3051\u003c/reading\u003e, simple as that. So long as you\u0027ve heard of sake you should be A-Okay with this reading.", "reading_mnemonic_bn": "\u098f\u0987 \u09aa\u09a1\u09bc\u09be\u099f\u09be \u0995\u09c1\u09a8-\u09aa\u09a1\u09bc\u09be, \u09a4\u09be\u0987 \u0985\u0995\u09cd\u09b7\u09b0\u09c7\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u09b6\u09c7\u0996\u09be \u09aa\u09a1\u09bc\u09be\u099f\u09be \u09a8\u09af\u09bc\u0964 \u099c\u09be\u09aa\u09be\u09a8\u09bf \u09ae\u09a6\u0995\u09c7 \u09ac\u09b2\u09c7 \u09b8\u09be\u0995\u09c7; \u09ad\u09a6\u09cd\u09b0\u09a4\u09be\u09b0 \u0027\u0993\u0027 \u099c\u09c1\u09a1\u09bc\u09c7 \u09b9\u09af\u09bc \u0993\u09b8\u09be\u0995\u09c7\u0964 \u0027\u09b8\u09be\u0995\u09c7\u0027 \u09b6\u09c1\u09a8\u09b2\u09c7\u0987 \u09a4\u09c1\u09ae\u09bf \u09a0\u09bf\u0995 \u0986\u099b\u09cb\u0964", "url": "https://www.wanikani.com/vocabulary/%E3%81%8A%E9%85%92"}, {"char": "\u66f2\u7dda", "id": 4379, "image": null, "kanji": ["\u66f2", "\u7dda"], "meaning": "Curve", "meaning_mnemonic": "A \u003ckanji\u003ebend\u003c/kanji\u003e in a \u003ckanji\u003eline\u003c/kanji\u003e is merely a \u003cvocabulary\u003ecurve\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u09b0\u09c7\u0996\u09be\u09b0 \u09ae\u09a7\u09cd\u09af\u09c7 \u098f\u0995\u099f\u09be \u09ac\u09be\u0981\u0995 \u09ae\u09be\u09a8\u09c7\u0987 \u09b6\u09c1\u09a7\u09c1 \u098f\u0995\u099f\u09be \u0995\u09be\u09b0\u09cd\u09ad\u0964", "radicals": [], "reading_display": "\u304d\u3087\u304f\u305b\u3093", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "reading_mnemonic_bn": "\u0995\u09cd\u09af\u09cb\u0995\u09c1 \u09b8\u09c7\u09a8 \u09a8\u09be\u09ae\u09c7\u09b0 \u098f\u0995 \u09b8\u09c8\u09a8\u09bf\u0995\u0995\u09c7 \u09ac\u09be\u0981\u0995\u09be \u09b0\u09c7\u0996\u09be \u099f\u09be\u09a8\u09a4\u09c7 \u09a6\u09c7\u0996\u09cb\u0964", "url": "https://www.wanikani.com/vocabulary/%E6%9B%B2%E7%B7%9A"}, {"char": "\u6700\u3082", "id": 3233, "image": null, "kanji": ["\u6700"], "meaning": "The Most", "meaning_mnemonic": "This is the adverb version of the kanji, so it has the same meaning, basically. You can say this is \u003cvocabulary\u003ethe most\u003c/vocabulary\u003e or just \u003cvocabulary\u003emost\u003c/vocabulary\u003e. You can also use it as \u003cvocabulary\u003eextremely\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be\u09b0 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09ac\u09bf\u09b6\u09c7\u09b7\u09a3 \u09b0\u09c2\u09aa\u0964 \u09a4\u09be\u0987 \u0985\u09b0\u09cd\u09a5 \u09aa\u09cd\u09b0\u09be\u09 s well.", "reading_mnemonic_bn": "\u09a4\u09c1\u09ae\u09bf \u099a\u0995 \u09b9\u09be\u09a4\u09c7 \u09b8\u09c7\u09a8 \u09ad\u09be\u0987\u09af\u09bc\u09be\u0995\u09c7 \u09b8\u09cb\u099c\u09be \u09a6\u09be\u0997 \u099f\u09be\u09a8\u09a4\u09c7 \u09a6\u09c7\u0996\u09cb\u0964 \u099a\u0995 \u0986\u09b0 \u09b8\u09c7\u09a8 \u09ae\u09bf\u09b2\u09c7 \u09b9\u09af\u09bc \u099a\u09cb\u0995\u09c1\u09b8\u09c7\u09a8 \u2014 \u098f\u09ad\u09be\u09ac\u09c7\u0987 \u09aa\u09a1\u09bc\u09cb \u099a\u09cb\u0995\u09c1\u09b8\u09c7\u09a8\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%9B%B4%E7%B7%9A"}, {"char": "\u8abf\u3079\u308b", "id": 3222, "image": null, "kanji": ["\u8abf"], "meaning": "To Investigate", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003einvestigate\u003c/kanji\u003e so the vocab verb version means \u003cvocabulary\u003eto investigate\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be \u099c\u09cb\u09a1\u09bc\u09be \u09b2\u09be\u0997\u09be \u09b6\u09ac\u09cd\u09a6, \u09b6\u09c7\u09b7\u09c7 \u0989-\u09a7\u09cd\u09ac\u09a8\u09bf \u2014 \u09a4\u09be\u0987 \u098f\u099f\u09bf \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u0964 \u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be \u09ac\u09b2\u09c7 \u0985\u09a8\u09c1\u09b8\u09a8\u09cd\u09a7\u09be\u09a8 \u0995\u09b0\u09be, \u09a4\u09be\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be\u0993 \u09ae\u09be\u09a8\u09c7 \u0985\u09a8\u09c1\u09b8\u09a8\u09cd\u09a7\u09be\u09a8 \u0995\u09b0\u09be\u0964", "radicals": [], "reading_display": "\u3057\u3089\u3079\u308b", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: \n\nYou are hired \u003cvocabulary\u003eto investigate\u003c/vocabulary\u003e someone\u0027s wife. It is said that \u003creading\u003eshe love\u003c/reading\u003es (\u3057\u3089) another man... but you need to investigate her to find out if that\u0027s true, for her husband of course.", "reading_mnemonic_bn": "\u09a4\u09c1\u09ae\u09bf \u098f\u0995\u099c\u09a8\u09c7\u09b0 \u09b8\u09cd\u09a4\u09cd\u09b0\u09c0\u0995\u09c7 \u0985\u09a8\u09c1\u09b8\u09a8\u09cd\u09a7\u09be\u09a8 \u0995\u09b0\u09a4\u09c7 \u09a8\u09bf\u09af\u09bc\u09cb\u0997 \u09aa\u09c7\u09b2\u09c7\u0964 \u09b6\u09cb\u09a8\u09be \u09af\u09be\u09af\u09bc \u09a4\u09be\u09b0 \u09b6\u09bf\u09b0\u09be\u09af\u09bc \u0985\u09a8\u09cd\u09af \u098f\u0995 \u09aa\u09c1\u09b0\u09c1\u09b7\u09c7\u09b0 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be \u09ac\u0987\u099b\u09c7\u0964 \u09b8\u09a4\u09cd\u09af\u09bf \u0995\u09bf \u09a8\u09be, \u09b8\u09cd\u09ac\u09be\u09ae\u09c0\u09b0 \u099c\u09a8\u09cd\u09af \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u0985\u09a8\u09c1\u09b8\u09a8\u09cd\u09a7\u09be\u09a8 \u0995\u09b0\u09a4\u09c7 \u09b9\u09ac\u09c7\u0964 \u09b6\u09bf\u09b0\u09be \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09b6\u09bf\u09b0\u09be\u09ac\u09c7\u09b0\u09c1 \u09aa\u09be\u09a0\u09c7\u09b0 \u09b6\u09c1\u09b0\u09c1\u099f\u09be \u09a7\u09b0\u09c7 \u09b0\u09be\u0996\u09ac\u09c7\u0964", "url": "https://www.wanikani.com/vocabulary/%E8%AA%BF%E3%81%B9%E3%82%8B"}, {"char": "\u5229\u606f", "id": 3325, "image": null, "kanji": ["\u5229", "\u606f"], "meaning": "Interest", "meaning_mnemonic": "You receive \u003ckanji\u003eprofit\u003c/kanji\u003e at every \u003ckanji\u003ebreath\u003c/kanji\u003e. What kind of profit is this? It\u0027s \u003cvocabulary\u003einterest\u003c/vocabulary\u003e. As time goes by and as you take more breaths you gain more bank interest.", "meaning_mnemonic_bn": "\u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09bf \u09a8\u09bf\u0983\u09b6\u09cd\u09ac\u09be\u09b8\u09c7 \u09a4\u09c1\u09ae\u09bf \u09b2\u09be\u09ad \u09aa\u09b is word: You smell someone\u0027s \u003creading\u003eicky\u003c/reading\u003e (\u3044\u304d) \u003cvocabulary\u003ebreath\u003c/vocabulary\u003e. It\u0027s gross. Your skin crawls and your eyes roll back in your head from the icky, icky smell. You might die.", "reading_mnemonic_bn": "\u0995\u09c7\u0989 \u09a4\u09cb\u09ae\u09be\u09b0 \u09ae\u09c1\u0996\u09c7\u09b0 \u0995\u09be\u099b\u09c7 \u098f\u09b8\u09c7 \u09b6\u09cd\u09ac\u09be\u09b8 \u09ab\u09c7\u09b2\u099b\u09c7, \u0986\u09b0 \u09a4\u09c1\u09ae\u09bf \u099f\u09c7\u09b0 \u09aa\u09be\u099a\u09cd\u099b \u0987\u0995\u09bf \u0987\u0995\u09bf \u09a6\u09c1\u09b0\u09cd\u0997\u09a8\u09cd\u09a7\u0964 \u0998\u09cb\u09b0\u09be\u0998\u09c1\u09b0\u09bf \u09b2\u09be\u0997\u099b\u09c7 \u09ae\u09be\u09a5\u09be, \u099a\u09cb\u0996 \u0989\u09b2\u09cd\u099f\u09c7 \u09af\u09be\u099a\u09cd\u099b\u09c7\u0964 \u098f\u0987 \u0987\u0995\u09bf \u0987\u0995\u09bf \u0997\u09a8\u09cd\u09a7\u09c7 \u09a4\u09c1\u09ae\u09bf \u09ae\u09b0\u09c7\u0987 \u09af\u09be\u09ac\u09c7\u0964", "url": "https://www.wanikani.com/vocabulary/%E6%81%AF"}, {"char": "\u6b6f", "id": 3384, "image": null, "kanji": ["\u6b6f"], "meaning": "Tooth", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "meaning_mnemonic_bn": "\u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be \u0986\u09b0 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u098f\u0995\u09a6\u09ae \u098f\u0995\u0964 \u09a4\u09be\u0987 \u09a4\u09c1\u09ae\u09bf \u09a6\u09c1\u099f\u09cb\u09a4\u09c7\u0987 \u098f\u0995\u0987 \u0985\u09b0\u09cd\u09a5 \u09aa\u09be\u09ac\u2014\u09a6\u09be\u0981\u09a4\u0964", "radicals": [], "reading_display": "\u306f", "reading_mnemonic": "The reading for this word is the same as the one you learned with the kanji.", "reading_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u09aa\u09a1\u09bc\u09be \u0986\u0997\u09c7\u09b0 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09aa\u09a1\u09bc\u09be\u09b0 \u09ae\u09a4\u09cb\u0987\u0964 \ 0995\u09b0\u09c7 \u0027\u09ac\u09be!\u0027 \u09ac\u09b2\u09cb, \u09a4\u09be\u0987 \u09a6\u09be\u0981\u09a4\u09c7\u09b0 \u0027\u09b9\u09be\u0027 \u09ac\u09a6\u09b2\u09c7 \u0027\u09ac\u09be\u0027 \u09b9\u09af\u09bc\u09c7 \u09af\u09be\u09af\u09bc\u0964", "url": "https://www.wanikani.com/vocabulary/%E8%99%AB%E6%AD%AF"}, {"char": "\u4e88\u60f3", "id": 3543, "image": null, "kanji": ["\u4e88", "\u60f3"], "meaning": "Expectation", "meaning_mnemonic": "If you consider the future \u003ckanji\u003ebeforehand\u003c/kanji\u003e and \u003ckanji\u003eimagine\u003c/kanji\u003e how things will turn out (based on some facts), you will have an informed \u003cvocabulary\u003eexpectation\u003c/vocabulary\u003e or \u003cvocabulary\u003eprediction\u003c/vocabulary\u003e for it.\n\n\u4e88\u60f3 refers to an expectation or prediction about the future based on current information or trends, like predicting which candidate will win an upcoming election or estimating future economic conditions.", "meaning_mnemonic_bn": "\u09a4\u09c1\u09ae\u09bf \u0986\u0997\u09c7 \u09a5\u09c7\u0995\u09c7\u0987 \u09ad\u09be\u09ac\u09cb \u09ad\u09ac\u09bf\u09b7\u09cd\u09af\u09ce \u0995\u09c7\u09ae\u09a8 \u09b9\u09ac\u09c7, \u0986\u09b0 \u09ac\u09b0\u09cd\u09a4\u09ae\u09be\u09a8 \u09a4\u09a5\u09cd\u09af \u09a6\u09c7\u0996\u09c7 \u0995\u09b2\u09cd\u09aa\u09a8\u09be \u0995\u09b0\u09cb\u2014\u09a4\u09be\u09a4\u09c7\u0987 \u09a4\u09c8\u09b0\u09bf \u09b9\u09af\u09bc \u09aa\u09b0\u09bf\u09b7\u09cd\u0995\u09be\u09b0 \u09aa\u09cd\u09b0\u09a4\u09cd\u09af\u09be\u09b6\u09be \u09ac\u09be \u09aa\u09c2\u09b0\u09cd\u09ac\u09be\u09ad\u09be\u09b8\u0964 \u09af\u09c7\u09ae\u09a8 \u09ad\u09cb\u099f\u09c7 \u0995\u09c7 \u099c\u09bf\u09a4\u09ac\u09c7 \u09ac\u09be \u0985\u09b0\u09cd\u09a5\u09a8\u09c0\u09a4\u09bf \u0995\u09c7\u09ae\u09a8 \u09b9\u09ac\u09c7, \u09a4\u09be \u09a4\u09a5\u09cd\u09af \u09a6\u09c7\u0996\u09c7 \u0986\u0997\u09c7\u0987 \u09ad\u09c7\u09ac\u09c7 \u09a8\u09c7\u0993\u09af\u09bc\u09be\u0964", "radicals": [], "reading_display": "\u3088\u305d\u3046", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "reading_mnemonic_bn": "\u09aa\u09c2\u09b0\u09cd\u09ac\u09be\u09ad\u09be\u09b8\u09c7\u09b0 \u09b8\u09ae\u09af\u09bc \u09ae\u09c1\u0996\u09c7 \u09a4\u09bf\u09a8 \u09a4\u09be\u09b2\u09c7 \u09ac\u09b2\u09cb: \u09af\u09cb \u09b8\u09cb \u0989\u0964 \u09af\u09cb \u09ad\u09be\u09ac\u09cb, \u09b8\u09cb \u0989 \u09ab\u09b2\u2014\u098f\u0987 \u099b\u09a8\u09cd\u09a6\u09c7 \u09aa\u09a1\u09bc\u09be\u099f\u09be \u09ae\u09a8\u09c7 \u09a5\u09be\u0995\u09ac\u09c7\u0964", "url": "https://www.wanikani.com/vocabulary/%E4%BA%88%E6%83%B3"}, {"char": "\u5bbf", "id": 4881, "image": null, "kanji": ["\u5bbf"], "meaning": "Lodging", "meaning_mnemonic": "A \u003ckanji\u003elodge\u003c/kanji\u003e is a form of \u003cvocabulary\u003elodging\u003c/vocabulary\u003e. It is also considered to be an \u003cvocabulary\u003einn\u003c/vocabulary\u003e or \u003cvocabulary\u003ehotel\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u098f\u0995\u099f\u09be \u09b2\u099c \u09b9\u09b2\u09cb \u09a5\u09be\u0995\u09be\u09b0 \u099c\u09be\u09af\u09bc\u0997\u09be\u09b0\u0987 \u098f\u0995 \u09b0\u0995\u09ae\u0964 \u098f\u099f\u09be\u0995\u09c7 \u0987\u09a8 \u09ac\u09be \u09b9\u09cb\u099f\u09c7\u09b2\u0993 \u09ac\u09b2\u09be \u09af\u09be\u09af\u09bc\u0964", "radicals": [], "reading_display": "\u3084\u3069", "reading_mnemonic": "\u003creading\u003eYah do\u003c/reading\u003e (\u3084\u3069) what you must to get \u003cvocabulary\u003elodging\u003c/vocabulary\u003es for the night. Whether that\u0027s an \u003cvocabulary\u003einn\u003c/vocabulary\u003e or \u003cvocabulary\u003ehotel\u003c/vocabulary\u003e or whatever. \u003creading\u003eYah do\u003c/reading\u003e what you gotta do.", "reading_mnemonic_bn": "\u09b0\u09be\u09a4\u09c7 \u09a5\u09be\u0995\u09be\u09b0 \u09ac\u09cd\u09af\u09ac\u09b8\u09cd\u09a5\u0 9cb\u099d\u09be\u09af\u09bc, \u09ac\u09bf\u09b6\u09c7\u09b7 \u0995\u09b0\u09c7 \u09ad\u09ac\u09bf\u09b7\u09cd\u09af\u09a4\u09c7\u09b0 \u0998\u099f\u09a8\u09be, \u09af\u09c7\u09ae\u09a8 \u09aa\u09cd\u09b0\u09be\u0995\u09c3\u09a4\u09bf\u0995 \u09a6\u09c1\u09b0\u09cd\u09af\u09cb\u0997\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u0986\u0997\u09c7 \u09a5\u09c7\u0995\u09c7 \u09ad\u09be\u09ac\u09be\u0964", "radicals": [], "reading_display": "\u305d\u3046\u3066\u3044", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own.", "reading_mnemonic_bn": "\u098f\u099f\u09be \u099c\u09c1\u0995\u09c1\u0997\u09cb, \u09a4\u09be\u0987 \u09a6\u09c1\u0987 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09aa\u09a1\u09bc\u09be\u09b0 \u0985\u0982\u09b6 \u099c\u09cb\u09a1\u09bc\u09be \u09b2\u09be\u0997\u09be\u0993: \u09b8\u09cb \u0986\u09b0 \u09a4\u09c7\u0987 \u09ae\u09bf\u09b2\u09c7 \u09b9\u09af\u09bc \u09b8\u09cb\u0989\u09a4\u09c7\u0987\u0964", "url": "https://www.wanikani.com/vocabulary/%E6%83%B3%E5%AE%9A"}, {"char": "\u611f\u3058\u308b", "id": 3586, "image": null, "kanji": ["\u611f"], "meaning": "To Feel", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003efeeling\u003c/kanji\u003e so the verb vocab version is \u003cvocabulary\u003eto feel\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u098f\u0995\u099f\u09be \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be \u099c\u09cb\u09a1\u09bc\u09be \u09b2\u09be\u0997\u09bf\u09af\u09bc\u09c7 \u09a4\u09c8\u09b0\u09bf\u0964 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be\u09b0 \u09b6\u09c7\u09b7\u09c7 \u0989 \u09a7\u09cd\u09ac\u09a8\u09bf \u0986\u099b\u09c7, \u09a4\u09be\u0987 \u098f\u099f\u09be \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u0964 \u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be\u09b0 \u0985\u09b0\u09cd\u09a5 \u0985\u09a8\u09c1\u09ad\u09c2\u09a4\u09bf, \u09a4\u09be\u0987 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09b0 \u09b0\u09c2\u09aa\u099f\u09be \u09b9\u09b2\u09cb \u0985\u09a8\u09c1\u09ad\u09ac \u0995\u09b0\u09be\u0964", "radicals": [], "reading_display": "\u304b\u3093\u3058\u308b", "reading_mnemonic": "Guess what? Even though this would use the vocab kun\u0027yomi reading, usually, the readings for both on\u0027yomi and kun\u0027yomi on this kanji are the same, meaning you can read this word no matter what. Feeling better now?", "reading_mnemonic_bn": "\u098f\u0987 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u0993\u09a8-\u0987\u09af\u09bc\u09cb\u09ae\u09bf \u0986\u09b0 \u0995\u09c1\u09a8-\u0987\u09af\u09bc\u09cb\u09ae\u09bf \u09a6\u09c1\u099f\u09cb\u0987 \u098f\u0995\u0987, \u09a4\u09be\u0987 \u09af\u09c7\u09ad\u09be\u09ac\u09c7\u0987 \u09aa\u09a1\u09bc\u09cb, \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09aa\u09a1\u09bc\u09a4\u09c7 \u09aa\u09be\u09b0\u09ac\u09c7\u0964 \u0995\u09be\u0981\u099c\u09bf-\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u09b0\u09c1 \u099c\u09c1\u09a1\u09bc\u09c7 \u09a6\u09be\u0993, \u09b9\u09af\u09bc\u09c7 \u09af\u09be\u09af\u09bc \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0\u09c1\u0964 \u098f\u0996\u09a8 \u09a8\u09bf\u09b6\u09cd\u099a\u09af\u09bc\u0987 \u0985\u09a8\u09c1\u09ad\u09ac \u0995\u09b0\u099b \u09ad\u09be\u09b2\u09cb?", "url": "https://www.wanikani.com/vocabulary/%E6%84%9F%E3%81%98%E3%82%8B"}, {"char": "\u71b1", "id": 3612, "image": null, "kanji": ["\u71b1"], "meaning": "Fever", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "meaning_mnemonic_bn": "\u098f\u0987 \u0995\u09be\u099e\u09cd\u099c\u09bf \u0986\u09b0 \u098f\u0987 \u09b6\u09ac\u09cd\u09a6 \u098f\u0995\u09a6\u09ae \u098f\u0995\u0964 \u09a4\u09be\u0987 \u09a6\u09c1\u0987\u09af\u09bc\u09c7\u09b0 \u0985\u09b0\u09cd\u09a5\u0993 \u098f\u0995\u0987 \u2014 \u099c\u09cd\u09ac\u09b0\u0964", "radicals": [], "reading_display": "\u306d\u3064", "reading_mnemonic": "The reading is the same as the one you learned with the kanji, so don\u0027t get all feverish over this one.", "reading_mnemonic_bn": "\u09aa\u09a1\u09bc\u09be\u099f\u09be\u0993 \u0986\u0997\u09c7\u09b0 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09ae\u09a4\u09cb\u0987 \u2014 \u09a8\u09c7\u09ce\u09b8\u09c1\u0964 \u09a4\u09be\u0987 \u098f\u0987\u099f\u09be \u09a8\u09bf\u09af\u09bc\u09c7 \u099c\u09cd\u09ac\u09b0 \u09a7\u09b0\u09bf\u09af\u09bc\u09c7 \u09ab\u09c7\u09b2\u09cb \u09a8\u09be\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%86%B1"}, {"char": "\u71b1\u3044", "id": 3613, "image": null, "kanji": ["\u71b1"], "meaning": "Hot", "meaning_mnemonic": "This is a single kanji with an \u3044 on the end, so you know it\u0027s probably an adjective. The adjective form of \u003ckanji\u003ehot\u003c/kanji\u003e is still \u003cvocabulary\u003ehot\u003c/vocabulary\u003e! \n\nThis is for something \u003cvocabulary\u003ehot to the touch\u003c/vocabulary\u003e, not for the weather (that\u0027d be \u6691\u3044). Think boiling water or someone\u0027s forehead when they have a fever \u2014 those are \u71b1\u3044. Figuratively, it can also mean \u003cvocabulary\u003epassionate\u003c/vocabulary\u003e. Burning passion, right?", "meaning_mnemonic_bn": "\u09b6\u09c7\u09b7\u09c7 \u099b\u09cb\u099f \u09b8\u09cd\u09ac\u09b0\u09ac\u09b0\u09cd\u09a3 \u09a5\u09be\u0995\u09b2\u09c7 \u098f\u099f\u09be \u09ac\u09bf\u09b6\u09c7\u09b7\u09a3, \u09a4\u09be\u0987 \u0997\u09b0\u09ae\u0987 \u09a5\u09be\u0995\u09c7\u0964 \u098f\u099f\u09be \u09b8\u09cd\u09aa\u09b0\u09cd\u09b6\u09c7 \u0997\u09b0\u09ae\u2014\u0986\u09ac\u09b9\u09be\u0993\u09af\u09bc\u09be\u09b0 \u0997\u09b0\u09ae \u09a8\u09af\u09bc\u0964 \u09ab\u09c1\u099f\u09a8\u09cd\u09a4 \u09aa\u09be\u09a8\u09bf\u09b0 \u0995\u09c7\u099f\u09b2\u09bf \u09ac\u09be \u099c\u09cd\u09ac\u09b0\u09c7\u09b0 \u0995\u09aa\u09be\u09b2\u09c7 \u09b9\u09be\u09a4 \u09b0\u09be\u0996\u09cb, \u09a4\u0996\u09a8 \u09a4\u09c1\u09ae\u09bf \u09ac\u09c1\u099d\u09ac\u09c7 \u098f\u099f\u09be \u0997\u09b0\u09ae \u09ac\u09cb\u099d\u09be\u09af\u09bc\u0964 \u09b0\u09c2\u09aa\u0995 \u0985\u09b0\u09cd\u09a5\u09c7 \u09a4\u09c0\u09ac\u09cd\u09b0 \u0986\u09ac\u09c7\u0997\u0993\u2014\u09ad\u09c7\u09a4\u09b0\u09c7 \u099c\u09cd\u09ac\u09b2\u09c7 \u09a5\u09be\u0995\u09be \u0986\u0997\u09c1\u09a8\u0964", "radicals": [], "reading_display": "\u3042\u3064\u3044", "reading_mnemonic": "This word has a kanji with hiragana attached, so you know it\u0027ll use the kun\u0027yomi reading. You didn\u0027t learn it with the kanji, but you should know a very similar word that means \u003cvocabulary\u003ehot\u003c/vocabulary\u003e and uses the same \u003creading\u003e\u3042\u3064\u3044\u003c/reading\u003e reading: \u6691\u3044! These words are for different kinds of hot, but they\u0027re pronounced exactly the same way. Just remember that hot = \u3042\u3064\u3044 and you\u0027ll be OK.", "reading_mnemonic_bn": "\u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09aa\u09b0\u09c7 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be \u09a5\u09be\u0995\u09b2\u09c7 \u0995\u09c1\u09a8 \u09aa\u09be\u09a0 \u09b9\u09af\u09bc\u0964 \u0986\u09ac\u09b9\u09be\u0993\u09af\u09bc\u09be\u09b0 \u0997\u09b0\u09ae \u09ac\u09cb\u099d\u09be\u09a8\u09cb \u09b6\u09ac\u09cd\u09a6\u099f\u09be\u0993 \u09a0\u09bf\u0995 \u098f\u0995\u0987\u09ad\u09be\u09ac\u09c7 \u0986\u09a4\u09b8\u09c1\u0987 \u0989\u099a\u09cd\u099a\u09be\u09b0\u09bf\u09a4 \u09b9\u09af\u09bc\u0964 \u09a6\u09c1\u0987 \u0997\u09b0\u09ae \u0986\u09b2\u09be\u09a6\u09be, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09ae\u09c1\u0996\u09c7 \u098f\u0995\u0987\u2014\u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb, \u0997\u09b0\u09ae \u09ae\u09be\u09a8\u09c7\u0987 \u0986\u09a4\u09b8\u09c1\u0987\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%86%B1%E3%81%84"}, {"char": "\u75b2\u308c", "id": 7055, "image": null, "kanji": ["\u75b2"], "meaning": "Tiredness", "meaning_mnemonic": "\u75b2\u308c\u308b is \"to get tired.\" This is the noun version, which makes it \u003cvocabulary\u003etiredness\u003c/vocabulary\u003e or \u003cvocabulary\u003efatigue\u003c/vocabulary\u003e.\n\n\u75b2\u308c is a more casual version of \u75b2\u52b4, so people commonly choose \u75b2\u308c over \u75b2\u52b4 in everyday conversation.", "meaning_mnemonic_bn": "\u098f\u099f\u09be \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4 \u09b9\u0993\u09af\u09bc\u09be\u09b0 \u09ad\u09be\u09ac, \u09ae\u09be\u09a8\u09c7 \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4\u09bf \u09ac\u09be \u09aa\u09b0\u09bf\u09b6\u09cd\u09b0\u09ae\u09c7\u09b0 \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4\u09bf\u0964 \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4 \u09b9\u0993\u09af\u09bc\u09be \u09ac\u09cb\u099d\u09be\u09a8\u09cb \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09aa\u09a6\u09c7\u09b0 \u098f\u0987 \u09a8\u09be\u09ae-\u09b0\u09c2\u09aa\u099f\u09be \u0986\u09b0\u09c7\u0995\u099f\u09be \u09ad\u09be\u09b0\u09c0 \u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u09b8\u09b9\u099c \u099a\u09b2\u09a4\u09bf \u09b0\u09c2\u09aa; \u09b0\u09cb\u099c\u0995\u09be\u09b0 \u0995\u09a5\u09be\u09af\u09bc \u09ae\u09be\u09a8\u09c1\u09b7 \u098f\u0987 \u09b8\u09b9\u099c\u099f\u09be \u09ac\u09c7\u099b\u09c7 \u09a8\u09c7\u09af\u09bc\u0964", "radicals": [], "reading_display": "\u3064\u304b\u308c", "reading_mnemonic": "The reading comes from \u75b2\u308c\u308b.", "reading_mnemonic_bn": "\u09aa\u09a1\u09bc\u09be\u099f\u09be \u0986\u09b8\u09c7 \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4 \u09b9\u0993\u09af\u09bc\u09be \u09ac\u09cb\u099d\u09be\u09a8\u09cb \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09aa\u09a6 \u09a5\u09c7\u0995\u09c7\u0987\u0964 \u09ae\u09c1\u0996\u09c7 \u09ac\u09b2\u09cb \u09ce\u09b8\u09c1\u0995\u09be\u09b0\u09c7; \u09b6\u09c7\u09b7\u09c7\u09b0 \u0995\u09be\u09b0\u09c7 \u09b6\u09c1\u09a8\u09c7 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4 \u09b9\u09af\u09bc\u09c7 \u0995\u09be\u0989\u0995\u09c7 \u0995\u09be\u09b0\u09c7 \u09ac\u09b2\u09c7 \u09a1\u09be\u0995\u09be\u09b0 \u0995\u09a5\u09be\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%96%B2%E3%82%8C"}, {"char": "\u75b2\u308c\u308b", "id": 6899, "image": null, "kanji": ["\u75b2"], "meaning": "To Get Tired", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003etired\u003c/kanji\u003e, so the verb version means \u003cvocabulary\u003eto get tired\u003c/vocabulary\u003e. \n\n\u75b2\u308c\u308b refers to a physical or mental kind of tiredness, like you just worked out or studied a ton, but isn\u0027t used to describe sleepiness.", "meaning_mnemonic_bn": "\u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be\u09b0 \u09b6\u09c7\u09b7\u09c7 \u0027\u0989\u0027 \u09a7\u09cd\u09ac\u09a8\u09bf \u09a5\u09be\u0995\u09be\u09af\u09bc \u09ac\u09cb\u099d\u09be \u09af\u09be\u09af\u09bc \u098f\u099f\u09be \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u0964 \u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be\u09b0 \u0985\u09b0\u09cd\u09a5 \u0027\u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4\u0027, \u09a4\u09be\u0987 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09b0\u09c2\u09aa\u09c7 \u0985\u09b0\u09cd\u09a5 \u0027\u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4 \u09b9\u09af\u09bc\u09c7 \u09aa\u09a1\u09bc\u09be\u0027\u0964 \u09b6\u09b0\u09c0\u09b0 \u09ac\u09be \u09ae\u09be\u09a5\u09be \u0996\u09be\u099f\u09bf\u09af\u09bc\u09c7 \u0996\u09c1\u09ac \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4 \u09b9\u0993\u09af\u09bc\u09be \u09ac\u09cb\u099d\u09be\u09af\u09bc\u2014\u09af\u09c7\u09ae\u09a8 \u09ad\u09be\u09b0\u09c0 \u09ac\u09cd\u09af\u09be\u09af\u09bc\u09be\u09ae \u09ac\u09be \u0985\u09a8\u09c7\u0995\u0995\u09cd\u09b7\u09a3 \u09aa\u09a1\u09bc\u09be; \u0998\u09c1\u09ae-\u0998\u09c1\u09ae \u09ad\u09be\u09ac \u09ac\u09cb\u099d\u09be\u09af\u09bc \u09a8\u09be\u0964", "radicals": [], "reading_display": "\u3064\u304b\u308c\u308b", "reading_mnemonic": "For example, you\u0027re bound \u003cvocabulary\u003eto get tired\u003c/vocabulary\u003e if you try to lift \u003creading\u003etwo ca\u003c/reading\u003ers (\u3064\u304b), right? So think about that as you learn this word\u0027s reading.", "reading_mnemonic_bn": "\u09a7\u09b0\u09cb, \u09a6\u09c1\u0987\u099f\u09be \u0997\u09be\u09a1\u09bc\u09bf \u09a4\u09c1\u09b2\u09a4\u09c7 \u0997\u09c7\u09b2\u09c7 \u09a4\u09c1\u09ae\u09bf \u09a8\u09bf\u09b6\u09cd\u099a\u09bf\u09a4 \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4 \u09b9\u09af\u09bc\u09c7 \u09aa\u09a1\u09bc\u09ac\u09c7\u0964 \u0027\u099f\u09c1-\u0995\u09be\u0027 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09a4\u09be\u0987 \u0027\u09ce\u09b8\u09c1\u0995\u09be\u09b0\u09c7\u09b0\u09c7\u0027 \u09aa\u09a1\u09bc\u09be\u09b0 \u0995\u09a5\u09be \u09ae\u09a8\u09c7 \u0995\u09b0\u09bf\u09af\u09bc\u09c7 \u09a6\u09c7\u09ac\u09c7\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%96%B2%E3%82%8C%E3%82%8B"}, {"char": "\u9078\u3076", "id": 3628, "image": null, "kanji": ["\u9078"], "meaning": "To Choose", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003e\"choose\"\u003c/kanji\u003e, so the verb version is \u003cvocabulary\u003eto choose\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u09c7 \u098f\u0995\u099f\u09be \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be \u099c\u09cb\u09a1\u09bc\u09be \u0986\u099b\u09c7\u0964 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be\u09b0 \u09b6\u09c7\u09b7 \u09a7\u09cd\u09ac\u09a8\u09bf \u0989-\u098f\u09b0 \u09ae\u09a4\u09cb, \u09a4\u09be\u0987 \u098f\u099f\u09be \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u0964 \u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be\u09b0 \u0985\u09b0\u09cd\u09a5 \u09ac\u09be\u099b\u09b . I guess the idea is that if they\u0027re tired, they\u0027ve done some good work. Tell your coworkers \u304a\u75b2\u308c\u69d8\u3067\u3057\u305f when they leave for the day, or just use \u304a\u75b2\u308c in more casual situations with friends!", "meaning_mnemonic_bn": "\u09a4\u09c1\u09ae\u09bf \u098f\u0995 \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4 \u09ae\u09be\u09a8\u09c1\u09b7\u0995\u09c7 \u09b8\u09ae\u09cd\u09ae\u09be\u09a8\u09c7\u09b0 \u09a1\u09be\u0995 \u09a6\u09bf\u099a\u09cd\u099b\u0964 \u0995\u09c7\u0989 \u09b8\u09be\u09b0\u09be\u09a6\u09bf\u09a8 \u0996\u09c7\u099f\u09c7 \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4 \u09b9\u09b2\u09c7 \u09a4\u09be\u0995\u09c7 \u09ac\u09b2\u09cb, \u09ad\u09be\u09b2\u09cb \u0995\u09be\u099c \u0995\u09b0\u09c7\u099b\u0964 \u0985\u09ab\u09bf\u09b8 \u09b6\u09c7\u09b7\u09c7 \u09ac\u09be \u0995\u09a0\u09bf\u09a8 \u09aa\u09cd\u09b0\u09cd\u09af\u09be\u0995\u099f\u09bf\u09b8\u09c7\u09b0 \u09aa\u09b0\u09c7 \u098f\u0987 \u0995\u09a5\u09be \u09ac\u09b2\u09be \u09b9\u09af\u09bc\u0964 \u09ae\u09a8\u09c7 \u09b9\u09af\u09bc, \u0995\u09c7\u0989 \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4 \u09ae\u09be\u09a8\u09c7 \u09b8\u09c7 \u09ad\u09be\u09b2\u09cb\u0987 \u09aa\u09b0\u09bf\u09b6\u09cd\u09b0\u09ae \u0995\u09b0\u09c7\u099b\u09c7\u0964 \u09b8\u09b9\u0995\u09b0\u09cd\u09ae\u09c0 \u09ac\u09c7\u09b0\u09bf\u09af\u09bc\u09c7 \u0997\u09c7\u09b2\u09c7 \u09a4\u09be\u0995\u09c7 \u09aa\u09c2\u09b0\u09cd\u09a3 \u09b8\u09ae\u09cd\u09ae\u09be\u09a8\u09c7\u09b0 \u09a1\u09be\u0995 \u09a6\u09be\u0993, \u0986\u09b0 \u09ac\u09a8\u09cd\u09a7\u09c1\u09a6\u09c7\u09b0 \u09b8\u09be\u09a5\u09c7 \u09b6\u09c1\u09a7\u09c1 \u0995\u09cd\u09b2\u09be\u09a8\u09cd\u09a4-\u0985\u0982\u09b6\u099f\u09be \u09ac\u09b2\u09cb\u0964", "radicals": [], "reading_display": "\u304a\u3064\u304b\u308c\u3055\u307e", "reading_mnemonic": "The reading comes from \u75b2\u308c and \u69d8, combined together into one word.", "reading_mnemonic_bn": "\u09aa\u09a1\u09bc\u09be\u099f\u09be \u09ae\u09a8\u0
