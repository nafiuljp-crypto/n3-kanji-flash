u0964 \u098f\u0987 \u0987\u09af\u09bc\u09be \u09a7\u09b0\u09c7 \u09b0\u09be\u0996\u09cb, \u09a4\u09be\u09b9\u09b2\u09c7\u0987 \u0987\u09af\u09bc\u09be\u09ae\u09c7\u09b0\u09c1 \u09aa\u09a1\u09bc\u09be \u09ae\u09a8\u09c7 \u09a5\u09be\u0995\u09ac\u09c7\u0964", "url": "https://www.wanikani.com/vocabulary/%E8%BE%9E%E3%82%81%E3%82%8B"}, {"char": "\u5b8c\u7d50", "id": 7643, "image": null, "kanji": ["\u5b8c", "\u7d50"], "meaning": "Conclusion", "meaning_mnemonic": "The \u003ckanji\u003eperfect\u003c/kanji\u003e way to \u003ckanji\u003etie\u003c/kanji\u003e up a research paper is with a \u003cvocabulary\u003econclusion\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u098f\u0995\u099f\u09be \u0997\u09ac\u09c7\u09b7\u09a3\u09be\u09aa\u09a4\u09cd\u09b0 \u09b6\u09c7\u09b7 \u0995\u09b0\u09be\u09b0 \u09a8\u09bf\u0996\u09c1\u0981\u09a4 \u0989\u09aa\u09be\u09af\u09bc \u09b9\u09b2\u09cb \u0989\u09aa\u09b8\u0982\u09b9\u09be\u09b0 \u09a6\u09bf\u09af\u09bc\u09c7 \u09b8\u09ac \u09b8\u09c1\u09a4\u09cb \u09ac\u09c7\u0981\u09a7\u09c7 \u09ab\u09c7\u09b2\u09be\u0964", "radicals": [], "reading_display": "\u304b\u3093\u3051\u3064", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own.", "reading_mnemonic_bn": "\u09a4\u09c1\u09ae\u09bf \u0995\u09be\u09a8 \u0995\u09c7\u099f\u09c7 \u09ab\u09c7\u09b2\u09b2\u09c7\u0964 \u0995\u09be\u09a8\u0995\u09c7\u099f\u09c7\u0964 \u098f\u09ad\u09be\u09ac\u09c7\u0987 \u0995\u09be\u09a8\u0995\u09c7\u09a4\u09b8\u09c1 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb\u0964", "url": "https://www.wanikani.com/vocabulary/%E5%AE%8C%E7%B5%90"}, {"char": "\u6cbb\u3059", "id": 3845, "image": null, "kanji": ["\u6cbb"], "meaning": "To Cure", "meaning_mnemonic": "The kanji means \u003ckanji\u003ecure\u003c/kanji\u003e, so this verb means \u003cvocabulary\u003eto cure\u003c/vocabulary\u003e, \u003cvocabulary\u003eto heal\u003c/vocabulary\u003e or \u003cvocabulary\u003eto ease\u003c/vocabulary\u003e something. \n\nThis verb is for when someone actively cures something. (The illness doesn\u0027t just get better on its own.) How can you remember that? Because when you try to cure someone and you mess up, they can \u003creading\u003esue\u003c/reading\u003e (\u3059). Basically, to cure someone is to risk getting sued.", "meaning_mnemonic_bn": "\u098f\u0987 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09b0 \u09ae\u09be\u09a8\u09c7 \u0995\u09cb\u09a8\u09cb \u0995\u09bf\u099b\u09c1 \u09b8\u09be\u09b0\u09be\u09a8\u09cb, \u09b0\u09cb\u0997 \u09b8\u09be\u09b0\u09be\u09a8\u09cb \u09ac\u09be \u0989\u09aa\u09b6\u09ae \u0995\u09b0\u09be\u0964 \u0995\u09c7\u0989 \u09a8\u09bf\u099c\u09c7 \u09a5\u09c7\u0995\u09c7 \u09b8\u09be\u09b0\u09be\u09af\u09bc \u09a8\u09be, \u09a4\u09c1\u09ae\u09bf \u09b8\u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09ad\u09be\u09ac\u09c7 \u09b8\u09be\u09b0\u09be\u0993\u0964 \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09b8\u09be\u09b0\u09be\u09a4\u09c7 \u0997\u09bf\u09af\u09bc\u09c7 \u0997\u09cb\u09b2\u09ae\u09be\u09b2 \u0995\u09b0\u09b2\u09c7 \u09b8\u09c7 \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09ae\u09be\u09ae\u09b2\u09be \u0995\u09b0\u09c7 \u09a6\u09bf\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7, \u09b8\u09c1 \u098f\u09b0 \u09ae\u09a4\u09cb \u09b6\u09cb\u09a8\u09be\u09af\u09bc\u0964 \u09ae\u09be\u09a8\u09c7 \u0995\u09be\u0989\u0995\u09c7 \u09b8\u09be\u09b0\u09be\u09a8\u09cb \u09ae\u09be\u09a8\u09c7\u0987 \u09ae\u09be\u09ae\u09b2\u09be\u09b0 \u099d\u09c1\u0981\u0995\u09bf \u09a8\u09c7\u0993\u09af\u09bc\u09be\u0964", "radicals": [], "reading_display": "\u306a\u304a\u3059", "reading_mnemonic": "This word uses a kun\u0027yomi reading you didn\u0027t learn with the kanji, so here\u0027s a mnemonic:\n\nI need you \u003cvocabulary\u003eto cure\u003c/vocabulary\u003e him, and I need you to cure him right \u003creading\u003enow\u003c/reading\u003e (\u306a\u304a). NOW NOW NOW!\n\nThis also shares a reading with \u76f4\u3059, a similar word that you already learned means \"to fix.\" Fixing and curing are basically the same, right? Call me crazy, but there might just be an etymological connection there that can help you remember this reading.", "reading_mnemonic_bn": "\u09a4\u09be\u0995\u09c7 \u09b8\u09be\u09b0\u09be\u09a4\u09c7\u0987 \u09b9\u09ac\u09c7, \u0986\u09b0 \u098f\u0995\u09cd\u09b7\u09c1\u09a8\u09bf, \u09a8\u09be\u0993 \u09a8\u09be\u0993 \u09a8\u09be\u0993! \u098f\u0987 \u09a8\u09be\u0993 \u09b6\u09ac\u09cd\u09a6\u099f\u09be\u0987 \u09a8\u09be\u0993\u09b8\u09c1 \u09aa\u09a1\u09bc\u09be\u09b0 \u09b8\u09c1\u09b0\u0964 \u09b8\u09be\u09b0\u09be\u09a8\u09cb \u0986\u09b0 \u09a0\u09bf\u0995 \u0995\u09b0\u09be \u09aa\u09cd\u09b0\u09be\u09af\u09bc \u098f\u0995\u0987 \u0995\u09be\u099c, \u09a4\u09be\u0987 \u0986\u0997\u09c7 \u09af\u09c7 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09a0\u09bf\u0995 \u0995\u09b0\u09be \u09ac\u09cb\u099d\u09be\u09af\u09bc \u09b8\u09c7\u099f\u09be \u09b6\u09bf\u0996\u09c7\u099b, \u09a4\u09be\u09b0 \u09ae\u09a4\u09cb \u098f\u099f\u09be\u0993 \u09a8\u09be\u0993\u09b8\u09c1\u0964", "url": "https://www.wanikani.com/vocabulary/%E6%B2%BB%E3%81%99"}, {"char": "\u304a\u7b11\u3044", "id": 4060, "image": null, "kanji": ["\u7b11"], "meaning": "Comedy", "meaning_mnemonic": "You know that \u7b11\u3046 is \"to laugh.\" This is a noun version of that, though it\u0027s not \"a laugh,\" (that\u0027s \u7b11\u3044). Add \u304a to that and you have the thing that makes you laugh. It\u0027s \u003cvocabulary\u003ecomedy\u003c/vocabulary\u003e. It\u0027s the \u003cvocabulary\u003ejoke\u003c/vocabulary\u003e that\u0027s elevated with \u304a because it made you laugh SOOOOO much. Haha!", "meaning_mnemonic_bn": "\u09a4\u09c1\u09ae\u09bf \u099c\u09be\u09a8\u09cb, \u09b9\u09be\u09b8\u09be\u09b0 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09aa\u09a6\u099f\u09be\u09b0 \u09ae\u09be\u09a8\u09c7 \u09b9\u09be\u09b8\u09be\u0964 \u098f\u099f\u09be \u09a4\u09be\u09b0 \u09ac\u09bf\u09b6\u09c7\u09b7\u09cd\u09af \u09b0\u09c2\u09aa, \u09a4\u09ac\u09c7 \u09b6\u09c1\u09a7\u09c1 \u2018\u098f\u0995\u099f\u09be \u09b9\u09be\u09b8\u09bf\u2019 \u09a8\u09af\u09bc\u2014\u2018\u09b9\u09be\u09b8\u09bf\u2019 \u09b9\u09b2\u09cb \u0986\u09b2\u09be\u09a6\u09be \u09b6\u09ac\u09cd\u09a6\u0964 \u098f\u09b0 \u09b8\u09be\u09ae\u09a8\u09c7 \u2018\u0993\u2019 \u09af\u09cb\u0997 \u0995\u09b0\u09b2\u09c7 \u09af\u09be \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09b9\u09be\u09b8\u09be\u09af\u09bc, \u09b8\u09c7\u099f\u09be\u0987 \u0995\u09ae\u09c7\u09a1\u09bf\u0964 \u0985\u09b0\u09cd\u09a5\u09be\u09ce \u098f\u09ae\u09a8 \u099c\u09cb\u0995, \u09af\u09c7\u099f\u09be \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u098f\u09a4 \u09b9\u09be\u09b8\u09bf\u09af\u09bc\u09c7\u099b\u09c7 \u09af\u09c7 \u09b8\u09ae\u09cd\u09ae\u09be\u09a8 \u09a6\u09bf\u09af\u09bc\u09c7 \u09a4\u09be\u09b0 \u09b8\u09be\u09ae\u09a8\u09c7 \u2018\u0993\u2019 \u09ac\u09b8\u09be\u09a8\u09cb \u09b9\u09af\u09bc\u09c7\u099b\u09c7\u0964 \u09b9\u09be\u09b9\u09be!", "radicals": [], "reading_display": "\u304a\u308f\u3089\u3044", "reading_mnemonic": "The reading is the same \u7b11\u3046 or \u7b11\u3044. It\u0027s also the same as what you learned with the kanji.", "reading_mnemonic_bn": "\u0989\u099a\u09cd\u099a\u09be\u09b0\u09a3\u099f\u09be \u09b9\u09be\u09b8\u09be\u09b0 \u0986\u0997\u09c7\u09b0 \u09b6\u09ac\u09cd\u09a6\u099f\u09be\u09b0 \u09ae\u09a4\u09cb\u0987; \u09b9\u09be\u09b8\u09bf\u09b0 \u0985\u0995\u09cd\u09b7\u09b0 \u09b6\u09c7\u0996\u09be\u09b0 \u09b8\u09ae\u09af\u09bc\u0993 \u098f\u099f\u09be\u0987 \u09aa\u09c7\u09af\u09bc\u09c7\u099b\u09bf\u09b2\u09c7\u0964 \u09ae\u09c1\u0996\u09c7 \u09ac\u09b2\u09cb \u2018\u0993\u2019, \u09a4\u09be\u09b0\u09aa\u09b0 \u2018\u0993\u09af\u09bc\u09be-\u09b0\u09be\u0987\u2019\u2014\u09af\u09c7\u09a8 \u09b9\u09be\u09b8\u09a4\u09c7 \u09b9\u09be\u09b8\u09a4\u09c7 \u2018\u0993, \u0993\u09af\u09bc\u09be-\u09b0\u09be\u0987!\u2019 \u09ac\u09b2\u09c7 \u0989\u09a0\u099b\u0964", "url": "https://www.wanikani.com/vocabulary/%E3%81%8A%E7%AC%91%E3%81%84"}, {"char": "\u6cbb\u308b", "id": 8927, "image": null, "kanji": ["\u6cbb"], "meaning": "To Get Better", "meaning_mnemonic": "The kanji \u6cbb means \u003ckanji\u003ecure\u003c/kanji\u003e, but this verb just refers to the more passive process of getting better: it means \u003cvocabulary\u003eto get better\u003c/vocabulary\u003e, \u003cvocabulary\u003eto get well\u003c/vocabulary\u003e, or simply \u003cvocabulary\u003eto heal\u003c/vocabulary\u003e. \n\n\u6cbb\u308b isn\u0027t about someone actively curing something, it\u0027s just about something getting better \u2014 like \u81ea\u7136\u306b\u6cbb\u308b (to heal naturally) or \u85ac\u3067\u6cbb\u308b (to get better with medicine). How to remember this? If you want to get better, tell your illness it\u0027s being \u003creading\u003eru\u003c/reading\u003ede (\u308b). As soon as you call it out for being rude, it\u0027ll heal. That\u0027s just science.", "meaning_mnemonic_bn": "\u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be \u0027\u09b8\u09be\u09b0\u09be\u09a8\u09cb\u0027 \u09ac\u09cb\u099d\u09be\u09af\u09bc, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u098f\u0987 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u099f\u09be \u09a8\u09bf\u099c\u09c7 \u0995\u09bf\u099b\u09c1 \u09b8\u09be\u09b0\u09be\u09af\u09bc \u09a8\u09be\u2014\u098f\u099f\u09be \u09b6\u09c1\u09a7\u09c1 \u09ad\u09be\u09b2\u09cb \u09b9\u09af\u09bc\u09c7 \u0993\u09a0\u09be, \u09b8\u09c1\u09b8\u09cd\u09a5 \u09b9\u0993\u09af\u09bc\u09be \u09ac\u09be \u09b8\u09c7\u09b0\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be\u0964 \u09af\u09c7\u09ae\u09a8 \u09aa\u09cd\u09b0\u09be\u0995\u09c3\u09a4\u09bf\u0995\u09ad\u09be\u09ac\u09c7 \u09b8\u09c7\u09b0\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be, \u09ac\u09be \u0993\u09b7\u09c1\u09a7\u09c7 \u09b8\u09c7\u09b0\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be\u0964 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09a4\u09c7: \u0985\u09b8\u09c1\u0996\u099f\u09be\u0995\u09c7 \u09ac\u09b2\u09cb \u09b8\u09c7 \u09b0\u09c1\u09a1, \u09ae\u09be\u09a8\u09c7 \u09b0\u09c1\u0964 \u09b0\u09c1\u09a1 \u09ac\u09b2\u09b2\u09c7\u0987 \u09b8\u09c7 \u09b8\u09b0\u09c7 \u0997\u09bf\u09af\u09bc\u09c7 \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09b8\u09be\u09b0\u09bf\u09af\u09bc\u09c7 \u09a6\u09c7\u09ac\u09c7\u2014\u098f\u0987 \u09a4\u09cb \u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8\u0964", "radicals": [], "reading_display": "\u306a\u304a\u308b", "reading_mnemonic": "This uses the same reading you learned with the related word \u6cbb\u3059, but here\u0027s a mnemonic just in case:\n\nWhen you\u0027re sick, your mom calls every day to say, \"You have \u003cvocabulary\u003eto get better\u003c/vocabulary\u003e, \u003creading\u003enow\u003c/reading\u003e (\u306a\u304a)! Do it \u2014 get better NOW!\" Bullying you into healing is a total Mom-move, and somehow it works. There, you\u0027re all better now.", "reading_mnemonic_bn": "\u0985\u09b8\u09c1\u0996\u09c7 \u09a5\u09be\u0995\u09b2\u09c7 \u09ae\u09be \u09b0\u09cb\u099c \u09ab\u09cb\u09a8 \u0995\u09b0\u09c7 \u09a7\u09ae\u0995 \u09a6\u09c7\u09a8, \u0027\u098f\u0996\u09a8\u0987 \u09b8\u09c1\u09b8\u09cd\u09a5 \u09b9\u0993, \u09a8\u09be\u0993! \u09a8\u09be\u0993!\u0027 \u09a4\u09c1\u09ae\u09bf \u0027\u09b0\u09c1\u0027 \u09ac\u09b2\u09c7 \u09b8\u09c7\u09b0\u09c7 \u09af\u09be\u0993\u2014\u09a8\u09be\u0993\u09b0\u09c1\u0964 \u09ae\u09be\u09af\u09bc\u09c7\u09b0 \u09a7\u09ae\u0995\u09c7\u0987 \u09b8\u09ac \u09a0\u09bf\u0995, \u09a4\u09c1\u09ae\u09bf \u098f\u0996\u09a8 \u09b8\u09c1\u09b8\u09cd\u09a5\u0964", "url": "https://www.wanikani.com/vocabulary/%E6%B2%BB%E3%82%8B"}, {"char": "\u76f4\u308b", "id": 2903, "image": null, "kanji": ["\u76f4"], "meaning": "To Be Fixed", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. You already learned that \u76f4\u3059 means \"to fix,\" where someone actively does the fixing. Well, \u76f4\u308b puts the focus on the thing getting fixed, so it means \u003cvocabulary\u003eto be fixed\u003c/vocabulary\u003e or \u003cvocabulary\u003eto be back in working order\u003c/vocabulary\u003e.\n\nIn other words, don\u0027t use it to say \"I fixed it,\" but do use it to say \"It\u0027s fixed!\" or \"It\u0027s back to normal!\" To remember this, imagine a British person excitedly shouting, \"My loo (\u308b) was broken, but now it\u0027s fixed!\u201d", "meaning_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u09c7 \u09b8\u09cb\u099c\u09be \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09b8\u09be\u09a5\u09c7 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be \u099c\u09c1\u09a1\u09bc\u09c7\u099b\u09c7\u0964 \u09b6\u09c7\u09b7\u09c7 \u0989-\u098f\u09b0 \u09ae\u09a4\u09cb \u09b6\u09ac\u09cd\u09a6, \u09a4\u09be\u0987 \u098f\u099f\u09bf \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u0964 \u0986\u0997\u09c7 \u09b6\u09c7\u0996\u09be \u0027\u09a0\u09bf\u0995 \u0995\u09b0\u09be\u0027 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09af\u09bc \u0995\u09c7\u0989 \u09a8\u09bf\u099c\u09c7 \u09a0\u09bf\u0995 \u0995\u09b0\u09c7; \u098f\u0987 \u0027\u09a0\u09bf\u0995 \u09b9\u0993\u09af\u09bc\u09be\u0027 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09af\u09bc \u099c\u09cb\u09b0 \u09aa\u09a1\u09bc\u09c7 \u099c\u09bf\u09a8\u09bf\u09b8\u099f\u09be \u09a0\u09bf\u0995 \u09b9\u09af\u09bc\u0964 \u09a4\u09be\u0987 \u098f\u09b0 \u09ae\u09be\u09a8\u09c7 \u0027\u09a0\u09bf\u0995 \u09b9\u09af\u09bc\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be\u0027 \u09ac\u09be \u0027\u0986\u09ac\u09be\u09b0 \u099a\u09be\u09b2\u09c1 \u09b9\u0993\u09af\u09bc\u09be\u0027\u0964 \u0027\u0986\u09ae\u09bf \u09a0\u09bf\u0995 \u0995\u09b0\u09c7\u099b\u09bf\u0027 \u09ac\u09b2\u09a4\u09c7 \u098f\u099f\u09bf \u09a8\u09af\u09bc; \u09ac\u09b2\u09cb \u0027\u09a0\u09bf\u0995 \u09b9\u09af\u09bc\u09c7 \u0997\u09c7\u099b\u09c7!\u0027 \u09ac\u09be \u0027\u0986\u09ac\u09be\u09b0 \u0986\u0997\u09c7\u09b0 \u09ae\u09a4\u09cb \u09b9\u09af\u09bc\u09c7 \u0997\u09c7\u099b\u09c7!\u0027\n\n\u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb, \u098f\u0995 \u09ac\u09cd\u09b0\u09bf\u099f\u09bf\u09b6 \u09b2\u09cb\u0995 \u0989\u09a4\u09cd\u09a4\u09c7\u099c\u09bf\u09a4 \u09b9\u09af\u09bc\u09c7 \u099a\u09bf\u09ce\u0995\u09be\u09b0 \u0995\u09b0\u099b\u09c7: \u0986\u09ae\u09be\u09b0 \u09b2\u09c1 (\u099f\u09af\u09bc\u09b2\u09c7\u099f) \u09a8\u09b7\u09cd\u099f \u099b\u09bf\u09b2, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u098f\u0996\u09a8 \u09a0\u09bf\u0995 \u09b9\u09af\u09bc\u09c7 \u0997\u09c7\u099b\u09c7!", "radicals": [], "reading_display": "\u306a\u304a\u308b", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You learned this reading with \u76f4\u3059, but here\u0027s a mnemonic in case you forgot:\n\nSomething needs \u003cvocabulary\u003eto be fixed\u003c/vocabulary\u003e \u003creading\u003enow\u003c/reading\u003e (\u306a\u304a)! Seriously, it\u0027s urgent! You need this thing \u003cvocabulary\u003eto be back in working order\u003c/vocabulary\u003e right now!", "reading_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u09aa\u09a1\u09bc\u09be \u0995\u09c1\u09a8-\u0987\u09af\u09bc\u09cb\u09ae\u09bf\u0964 \u0986\u0997\u09c7 \u0027\u09a0\u09bf\u0995 \u0995\u09b0\u09be\u0027 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09af\u09bc \u098f\u099f\u09bf \u09b6\u09bf\u0996\u09c7\u099b, \u09a4\u09ac\u09c1 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb: \u0995\u09bf\u099b\u09c1 \u098f\u0995\u099f\u09be \u09a0\u09bf\u0995 \u09b9\u09a4\u09c7 \u09b9\u09ac\u09c7 \u098f\u0996\u09a8\u0987 \u2014 \u0027\u09a8\u09be\u0993\u0027! \u09b8\u09a4\u09cd\u09af\u09bf\u0987 \u099c\u09b0\u09c1\u09b0\u09bf! \u099c\u09bf\u09a8\u09bf\u09b8\u099f\u09be \u098f\u0996\u09a8\u0987 \u0986\u09ac\u09be\u09b0 \u099a\u09be\u09b2\u09c1 \u09b9\u09a4\u09c7 \u09b9\u09ac\u09c7\u0964 \u09a4\u09be\u0987 \u0027\u09a8\u09be\u0993-\u09b0\u09c1\u0027 \u09ac\u09b2\u09c7 \u09a1\u09be\u0995\u09cb\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%9B%B4%E3%82%8B"}, {"char": "\u7b11\u304 u0027re in a \u003ckanji\u003ebind\u003c/kanji\u003e, visiting the \u003ckanji\u003ebureau\u003c/kanji\u003e may be your only option \u003cvocabulary\u003ein the end\u003c/vocabulary\u003e. You were really hoping to avoid it, but it looks like you\u0027ll need to go \u003cvocabulary\u003eafter all\u003c/vocabulary\u003e.\n\n\u7d50\u5c40 is used to talk about the final result after everything is said and done. It often carries the nuance that, despite the various factors leading up to something, things didn\u0027t go as expected or the outcome wasn\u0027t ideal, like \u7d50\u5c40\u884c\u304b\u306a\u304b\u3063\u305f (\u003cvocabulary\u003eultimately\u003c/vocabulary\u003e, I didn\u0027t end up going).", "meaning_mnemonic_bn": "\u09a4\u09c1\u09ae\u09bf \u09af\u0996\u09a8 \u09ac\u09be\u0981\u09a7\u09c7 \u09aa\u09a1\u09bc\u09cb, \u09ac\u09bf\u0989\u09b0\u09cb\u09a4\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be\u0987 \u09a4\u0996\u09a8 \u09b6\u09c7\u09b7 \u09ad\u09b0\u09b8\u09be\u0964 \u09a4\u09c1\u09ae\u09bf \u098f\u09a1\u09bc\u09be\u09a4\u09c7 \u099a\u09c7\u09af\u09bc\u09c7\u099b\u09bf\u09b2\u09c7, \u09a4\u09ac\u09c1 \u09b6\u09c7\u09b7\u09c7 \u09af\u09c7\u09a4\u09c7\u0987 \u09b9\u09ac\u09c7\u0964", "radicals": [], "reading_display": "\u3051\u3063\u304d\u3087\u304f", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well. Note the \u3051\u3064 gets changed to \u3051\u3063 as \u3064s in this situation often do.", "reading_mnemonic_bn": "\u09a4\u09c1\u09ae\u09bf \u0995\u09c7\u0995 \u09b9\u09be\u09a4\u09c7 \u09a8\u09bf\u09af\u09bc\u09c7 \u0995\u09cd\u09af\u09cb-\u0995\u09c1 \u0995\u09cd\u09af\u09cb-\u0995\u09c1 \u0995\u09b0\u09cb\u2014\u0995\u09c7\u0995\u09cd\u0995\u09cd\u09af\u09cb\u0995\u09c1\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%B5%90%E5%B1%80"}, {"char": "\u56f0\u96e3", "id": 4338, "image": null, "kanji": ["\u56f0", "\u96e3"], "m ith an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003esleep\u003c/kanji\u003e or \u003ckanji\u003elie down\u003c/kanji\u003e, so the verb vocab version is \u003cvocabulary\u003eto sleep\u003c/vocabulary\u003e or \u003cvocabulary\u003eto lie down\u003c/vocabulary\u003e\u2014just like what you do when you decide \u003cvocabulary\u003eto go to bed\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09be \u09a8\u09bf\u099c\u09c7\u0987 \u09b6\u09cb\u09af\u09bc\u09be \u09ac\u09cb\u099d\u09be\u09af\u09bc\u0964 \u09a4\u09be\u0987 \u098f\u0987 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09aa\u09a6\u09c7\u09b0 \u09ae\u09be\u09a8\u09c7 \u0998\u09c1\u09ae\u09be\u09a8\u09cb \u09ac\u09be \u09b6\u09c1\u09af\u09bc\u09c7 \u09aa\u09a1\u09bc\u09be\u2014\u09a0\u09bf\u0995 \u09af\u09c7\u09ae\u09a8 \u09a4\u09c1\u09ae\u09bf \u09ac\u09bf\u099b\u09be\u09a8\u09be\u09af\u09bc \u09af\u09be\u0993\u09af\u09bc\u09be\u09b0 \u09b8\u09bf\u09a6\u09cd\u09a7\u09be\u09a8\u09cd\u09a4 \u09a8\u09be\u0993\u0964", "radicals": [], "reading_display": "\u306d\u308b", "reading_mnemonic": "The reading is the same as the reading you learned with the kanji. So, you can go ahead and lie down for a moment before moving on to the next item.", "reading_mnemonic_bn": "\u09aa\u09a1\u09bc\u09be\u099f\u09be \u0995\u09be\u099e\u09cd\u099c\u09bf\u09a4\u09c7\u0987 \u09b6\u09bf\u0996\u09c7\u099b\u2014\u09a8\u09c7 \u09b0\u09c1\u0964 \u0995\u09c7\u0989 \u09a8\u09c7 \u09ac\u09b2\u09c7 \u09a1\u09be\u0995\u09b2\u09c7 \u09a4\u09c1\u09ae\u09bf \u098f\u0995\u099f\u09c1 \u09b6\u09c1\u09af\u09bc\u09c7 \u09a8\u09be\u0993, \u09a4\u09be\u09b0\u09aa\u09b0 \u09aa\u09b0\u09c7\u09b0\u099f\u09be\u09af\u09bc \u09af\u09be\u0993\u0964", "url": "https://www.wanikani.com/vocabulary/%E5%AF%9D%E3%82%8B"}, {"char": "\u7d50\u3073\u4ed8\u304f", "id": 9502, "image": null, "kanji": ["\u7d50", "\u4ed8"], "meaning": "To Be Connected", "meaning_mnemonic": "Remember how \u7d50\u3076 means \"to tie\" and \u4ed8\u304f means \"to be attached\"? Well, \u003cem\u003etie\u003c/em\u003e them together so that they\u0027re \u003cem\u003eattached\u003c/em\u003e, and you get \u003cvocabulary\u003eto be connected\u003c/vocabulary\u003e. The words are connected, and that\u0027s what they mean too. Very meta.\n\n\u7d50\u3073\u4ed8\u304f generally describes a natural connection forming between things, like \u540d\u524d\u3068\u9854\u304c\u7d50\u3073\u4ed8\u304f (a name connects with a face). Note that this is often written \u7d50\u3073\u3064\u304f, without the kanji \u4ed8.", "meaning_mnemonic_bn": "\u09ae\u09a8\u09c7 \u0995\u09b0\u09cb, \u09ac\u09be\u0981\u09a7\u09be \u09ae\u09be\u09a8\u09c7 \u099f\u09be\u0987 \u0995\u09b0\u09be \u0986\u09b0 \u09b2\u09be\u0997\u09be\u09a8\u09cb \u09ae\u09be\u09a8\u09c7 \u09b8\u0982\u09af\u09c1\u0995\u09cd\u09a4 \u09b9\u0993\u09af\u09bc\u09be\u0964 \u09a6\u09c1\u099f\u09cb\u0995\u09c7 \u098f\u0995\u09b8\u09be\u09a5\u09c7 \u099f\u09be\u0987 \u0995\u09b0\u09c7 \u09b2\u09be\u0997\u09bf\u09af\u09bc\u09c7 \u09a6\u09bf\u09b2\u09c7 \u09b9\u09af\u09bc \u09b8\u0982\u09af\u09c1\u0995\u09cd\u09a4 \u09b9\u0993\u09af\u09bc\u09be; \u09b6\u09ac\u09cd\u09a6\u0997\u09c1\u09b2\u09cb\u0993 \u099c\u09c1\u09a1\u09bc\u09c7 \u0986\u099b\u09c7, \u0985\u09b0\u09cd\u09a5\u0993 \u09ae\u09bf\u09b2\u09c7 \u09af\u09be\u09af\u09bc\u0964 \u098f\u099f\u09be \u09b8\u09cd\u09ac\u09be\u09ad\u09be\u09ac\u09bf\u0995 \u09af\u09cb\u0997 \u09ac\u09cb\u099d\u09be\u09af\u09bc, \u09af\u09c7\u09ae\u09a8 \u09a8\u09be\u09ae \u0986\u09b0 \u09ae\u09c1\u0996 \u099c\u09c1\u09a1\u09bc\u09c7 \u09af\u09be\u09af\u09bc\u0964", "radicals": [], "reading_display": "\u3080\u3059\u3073\u3064\u304f", "reading_mnemonic": "This is a combination of \u7d50\u3076 and \u4ed8\u304f, so as long as you know how to read those, you should be okay here!", "reading_mnemonic_bn": "\u098f\u099f\u09be \u09ac\u09be\u0981\u09a7\u09be \u0986\u09b0 \u09b2\u09be\u0997\u09be\u09a8\u09cb\u2014\u098f\u0987 \u09a6\u09c1\u0987 \u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u099c\u09cb\u09a1\u09bc\u09be\u0964 \u09ac\u09be\u0981\u09a7\u09be \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09ae\u09c1\u09b8\u09c1\u09ac\u09bf, \u09b2\u09be\u0997\u09be\u09a8\u09cb \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09ce\u09b8\u09c1\u0995\u09c1; \u099c\u09cb\u09a1\u09bc\u09be \u09b2\u09be\u0997\u09be\u09b2\u09c7\u0987 \u09ae\u09c1\u0996\u09c7 \u0986\u09b8\u09c7 \u09ae\u09c1\u09b8\u09c1\u09ac\u09bf\u09ce\u09b8\u09c1\u0995\u09c1\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%B5%90%E3%81%B3%E4%BB%98%E3%81%8F"}, {"char": "\u89b3\u5ff5", "id": 4557, "image": null, "kanji": ["\u89b3", "\u5ff5"], "meaning": "Idea", "meaning_mnemonic": "You have a \u003ckanji\u003ethought\u003c/kanji\u003e on a particular \u003ckanji\u003eview\u003c/kanji\u003e. This is your \u003cvocabulary\u003eidea\u003c/vocabulary\u003e or \u003cvocabulary\u003enotion\u003c/vocabulary\u003e on it.", "meaning_mnemonic_bn": "\u098f\u0995\u099f\u09be \u09a8\u09bf\u09b0\u09cd\u09a6\u09bf\u09b7\u09cd\u099f \u09a6\u09c3\u09b7\u09cd\u099f\u09bf\u09ad\u0999\u09cd\u0997\u09bf\u09b0 \u0989\u09aa\u09b0 \u09a4\u09cb\u09ae\u09be\u09b0 \u09ae\u09a8\u09c7 \u098f\u0995\u099f\u09be \u099a\u09bf\u09a8\u09cd\u09a4\u09be \u098f\u09b8\u09c7\u099b\u09c7\u0964 \u09b8\u09c7\u099f\u09be\u0987 \u09a4\u09cb\u09ae\u09be\u09b0 \u09ad\u09be\u09ac\u09a8\u09be, \u09a4\u09cb\u09ae\u09be\u09b0 \u09a7\u09be\u09b0\u09a3\u09be\u0964", "radicals": [], "reading_display": "\u304b\u3093\u306d\u3093", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "reading_mnemonic_bn": "\u0995\u09be\u09a8 \u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u09b8\u09be\u09a5\u09c7 \u09a8\u09c7\u09a8 \u09a7\u09cd\u09ac\u09a8\u09bf \u099c\u09c1\u09a1\u09bc\u09c7 \u09a6\u09be\u0993 \u2014 \u09b9\u09af\u09bc \u0995\u09be\u09a8\u09cd\u09a8\u09c7\u09a8\u0964 \u0995\u09be\u09a8 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09b2\u09c7\u0987 \u09aa\u09a1\u09bc\u09be\u099f\u09be \u09b8\u09b9\u099c\u09c7 \u09ae\u09a8\u09c7 \u09a5\u09be\u0995\u09ac\u09c7\u0964", "url": "https://www.wanikani.com/vocabulary/%E8%A6%B3%E5%BF%B5"}, {"char": "\u975e\u96e3\u3059\u308b", "id": 4841, "image": null, "kanji": ["\u975e", "\u96e3"], "meaning": "To Criticize", "meaning_mnemonic": "Know how \u975e\u96e3 is a criticism? Make it a verb and you have the word \u003cvocabulary\u003eto criticize\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09b8\u09ae\u09be\u09b2\u09cb\u099a\u09a8\u09be \u09ac\u09cb\u099d\u09be\u09af\u09bc\u0964 \u098f\u099f\u09be\u0995\u09c7 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be \u09ac\u09be\u09a8\u09be\u09b2\u09c7\u0987 \u09b9\u09af\u09bc \u09b8\u09ae\u09be\u09b2\u09cb\u099a\u09a8\u09be \u0995\u09b0\u09be \u2014 \u0995\u09be\u0989\u0995\u09c7 \u09a6\u09cb\u09b7 \u09a6\u09c7\u0993\u09af\u09bc\u09be, \u0996\u09c1\u0981\u099f\u09bf\u09af\u09bc\u09c7 \u09b8\u09ae\u09be\u09b2\u09cb\u099a\u09a8\u09be \u0995\u09b0\u09be\u0964", "radicals": [], "reading_display": "\u3072\u306a\u3093\u3059\u308b", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well. Of course, it will be really helpful to know the word \u975e\u96e3 to start.", "reading_mnemonic_bn": "\u09b9\u09bf\u09a8\u09be\u09a8\u09b8\u09c1\u09b0\u09c1 \u2014 \u09aa\u09cd\u09b0\u09a5\u09ae\u09c7 \u09ac\u09b2\u09cb \u09b9\u09bf\u09a8\u09be\u09a8\u0964 \u09b9\u09bf\u09a8\u09be\u09a8 \u09b6\u09c1\u09a8\u09a4\u09c7 \u09b9\u09c0\u09a8 \u098f\u09b0 \u09ae\u09a4\u09cb \u2014 \u0995\u09c7\u0989 \u0995\u09be\u0989\u0995\u09c7 \u09b9\u09c0\u09a8 \u09ac\u09b2\u099b\u09c7, \u098f\u099f\u09be\u0987 \u09b8\u09ae\u09be\u09b2\u09cb\u099a\u09a8\u09be\u0964 \u09b6\u09c7\u09b7\u09c7 \u09b8\u09c1\u09b0\u09c1 \u099c\u09c1\u09a1\u09bc\u09c7 \u09ac\u09b2\u09cb \u09b9\u09bf\u09a8\u09be\u09a8\u09b8\u09c1\u09b0\u09c1\u0964", "url": "https://www.wanikani.com/vocabulary/%E9%9D%9E%E9%9B%A3%E3%81%99%E3%82%8B"}, {"char": "\u547c\u3076", "id": 4648, "image": null, "kanji": ["\u547c"], "meaning": "To Call", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003ecall\u003c/kanji\u003e so the verb vocab version is \u003cvocabulary\u003eto call\u003c/vocabulary\u003e or \u003cvocabulary\u003eto call out\u003c/vocabulary\u003e. As in \"HEY, YOU!\"", "meaning_mnemonic_bn": "\u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be\u09b0 \u09b6\u09c7\u09b7\u09c7 \u0989 \u09a7\u09cd\u09ac\u09a8\u09bf \u0986\u099b\u09c7, \u09a4\u09be\u0987 \u098f\u099f\u09be \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u0964 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u0985\u09b0\u09cd\u09a5 \u09a1\u09be\u0995\u09be, \u09a4\u09be\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09a1\u09be\u0995\u09be \u09ac\u09be \u09a1\u09be\u0995 \u09a6\u09c7\u0993\u09af\u09bc\u09be\u0964 \u09af\u09c7\u09ae\u09a8: \u098f\u0987, \u09a4\u09c1\u09ae\u09bf!", "radicals": [], "reading_display": "\u3088\u3076", "reading_mnemonic": "The reading is the same as the kanji, so you should be good here. Just imagine yourself  calling out to someone: \"\u003creading\u003eYO\u003c/reading\u003e (\u3088)! You!\"", "reading_mnemonic_bn": "\u09aa\u09a1\u09bc\u09be \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09aa\u09a1\u09bc\u09be\u09b0 \u09ae\u09a4\u09cb\u0987, \u09a4\u09be\u0987 \u099a\u09bf\u09a8\u09cd\u09a4\u09be \u09a8\u09c7\u0987\u0964 \u0995\u09be\u0989\u0995\u09c7 \u09a1\u09be\u0995\u09be\u09b0 \u09b8\u09ae\u09af\u09bc \u09ad\u09be\u09ac\u09cb: \u0987\u09af\u09bc\u09cb! \u09a4\u09c1\u09ae\u09bf!", "url": "https://www.wanikani.com/vocabulary/%E5%91%BC%E3%81%B6"}, {"char": "\u795d\u3046", "id": 4687, "image": null, "kanji": ["\u795d"], "meaning": "To Celebrate", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003ecelebrate\u003c/kanji\u003e, so the verb vocab version is \u003cvocabulary\u003eto celebrate\u003c/vocabulary\u003e. When you burn this word, you should \u795d\u3046!", "meaning_mnemonic_bn": "\u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u09b6\u09c7\u09b7\u09c7 \u2018\u0989\u2019 \u09a7\u09cd\u09ac\u09a8\u09bf \u09a5\u09be\u0995\u09be\u09af\u09bc \u098f\u099f\u09be \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u0964 \u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09bf\u09b0 \u0985\u09b0\u09cd\u09a5 \u2018\u0989\u09a6\u09af\u09be\u09aa\u09a8 \u0995\u09b0\u09be\u2019, \u09a4\u09be\u0987 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09aa\u09a6\u099f\u09bf\u09b0 \u0985\u09b0\u09cd\u09a5\u0993 \u2018\u0989\u09a6\u09af\u09be\u09aa\u09a8 \u0995\u09b0\u09be\u2019\u3002 \u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u098f\u0995\u09ac\u09be\u09b0 \u09aa\u09c1\u09a1\u09bc\u09bf\u09af\u09bc\u09c7 \u09ab\u09c7\u09b2\u09b2\u09c7\u0987 \u09a4\u09c1\u09ae\u09bf \u0989\u09a6\u09af\u09be\u09aa\u09a8 \u0995\u09b0\u09cb!", "radicals": [], "reading_display": "\u3044\u308f\u3046", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you:\n\nEveryone\u0027s here \u003cvocabulary\u003eto celebrate\u003c/vocabulary\u003e, and all you can say is \"\u003creading\u003eEee, wha\u003c/reading\u003e...!?\" (\u3044\u308f). All your friends and family have come to celebrate your birthday, but you had no idea. Still confused and processing the situation, you keep saying, \"Eee... what?\" The surprise was a complete success!", "reading_mnemonic_bn": "\u09b8\u09ac\u09be\u0987 \u09a4\u09cb\u09ae\u09be\u09b0 \u099c\u09a8\u09cd\u09ae\u09a6\u09bf\u09a8 \u0989\u09a6\u09af\u09be\u09aa\u09a8 \u0995\u09b0\u09a4\u09c7 \u098f\u09b8\u09c7\u099b\u09c7, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09a4\u09c1\u09ae\u09bf \u099c\u09be\u09a8\u09a4\u09c7\u0987 \u09a8\u09be\u0964 \u0985\u09ac\u09be\u0995 \u09b9\u09af\u09bc\u09c7 \u09a4\u09c1\u09ae\u09bf \u09b6\u09c1\u09a7\u09c1 \u09ac\u09b2\u099b, \u2018\u0987... \u0993\u09af\u09bc\u09be...!\u2019\u2014\u098f\u0987 \u2018\u0987\u0993\u09af\u09bc\u09be\u0989\u2019 \u09aa\u09a1\u09bc\u09be\u099f\u09be\u0987 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb\u0964 \u099a\u09ae\u0995\u099f\u09be \u09a6\u09be\u09b0\u09c1\u09a3 \u09b8\u09ab\u09b2!", "url": "https://www.wanikani.com/vocabulary/%E7%A5%9D%E3%81%86"}, {"char": "\u9055\u3044", "id": 4654, "image": null, "kanji": ["\u9055"], "meaning": "Difference", "meaning_mnemonic": "This is a single kanji with an \u3044 on the end, meaning you\u0027d think it\u0027s probably an adjective. However in this case, it\u0027s a noun. What\u0027s the noun form of \u003ckanji\u003edifferent\u003c/kanji\u003e? It\u0027s \u003cvocabulary\u003edifference\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u09b6\u09c7\u09b7\u09c7 \u098f\u0995\u099f\u09be \u099b\u09cb\u099f \u0987 \u0995\u09be\u09b0 \u09a5\u09be\u0995\u09c7 \u09a4\u09be\u0987 \u09a6\u09c7\u0996\u09c7 \u09ae\u09a8\u09c7 \u09b9\u09af\u09bc \u098f\u099f\u09be \u09ac\u09bf\u09b6\u09c7\u09b7\u09a3\u0964 \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u098f\u099f\u09be \u0986\u09b8\u09b2\u09c7 \u09ac\u09bf\u09b6\u09c7\u09b7\u09cd\u09af\u0964 \u09ad\u09bf\u09a8\u09cd\u09a8 \u0985\u09b0\u09cd\u09a5\u09c7\u09b0 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09ac\u09bf\u09b6\u09c7\u09b7\u09cd\u09af \u09b0\u09c2\u09aa \u09b9\u09b2\u09cb \u09aa\u09be\u09b0\u09cd\u09a5\u0995\u09cd\u09af\u0964", "radicals": [], "reading_display": "\u3061\u304c\u3044", "reading_mnemonic": "The reading is the same as the one you learned with the kanji. Not different at all.", "reading_mnemonic_bn": "\u09aa\u09a1\u09bc\u09be\u09b0 \u0989\u099a\u09cd\u099a\u09be\u09b0\u09a3 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09b8\u09be\u09a5\u09c7 l, "kanji": ["\u75db"], "meaning": "Painful", "meaning_mnemonic": "This is a single kanji with an \u3044 on the end, meaning you know it\u0027s probably an adjective. What\u0027s the adjective form of \u003ckanji\u003epain\u003c/kanji\u003e? It\u0027s \u003cvocabulary\u003epainful\u003c/vocabulary\u003e. \n\n\u75db\u3044 is commonly used to say that some part of the body hurts or feels sore.", "meaning_mnemonic_bn": "\u098f\u099f\u09bf \u098f\u0995\u099f\u09bf \u0995\u09be\u099e\u09cd\u099c\u09bf, \u09b6\u09c7\u09b7\u09c7 \u099b\u09cb\u099f \u09b8\u09cd\u09ac\u09b0\u09ac\u09b0\u09cd\u09a3 \u0986\u099b\u09c7\u0964 \u09a4\u09be\u0987 \u098f\u099f\u09bf \u09ac\u09bf\u09b6\u09c7\u09b7\u09a3\u0964 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09a4\u09c7 \u09ac\u09cd\u09af\u09a5\u09be \u0986\u099b\u09c7, \u09a4\u09be\u0987 \u0985\u09b0\u09cd\u09a5 \u09ac\u09cd\u09af\u09a5\u09be\u09a6\u09be\u09df\u0995\u0964 \u09b6\u09b0\u09c0\u09b0\u09c7\u09b0 \u0995\u09cb\u09a8\u09cb \u0985\u0982\u09b6 \u09ac\u09cd\u09af\u09a5\u09be \u09ac\u09be \u09ae\u099a\u09ae\u099a\u09c7 \u09b9\u09b2\u09c7 \u098f\u0987 \u09b6\u09ac\u09cd\u09a6 \u09ac\u09cd\u09af\u09ac\u09b9\u09be\u09b0 \u09b9\u09df\u0964", "radicals": [], "reading_display": "\u3044\u305f\u3044", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: An \u003creading\u003eeate\u003c/reading\u003er (\u3044\u305f) is someone who eats. But, the eater hurt his mouth. So now it\u0027s \u003cvocabulary\u003epainful\u003c/vocabulary\u003e to eat.", "reading_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u09c7 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be \u099c\u09cb\u09dc\u09be, \u09a4\u09be\u0987 \u0995\u09c1\u09a8\u09df\u09cb\u09ae\u09bf \u09aa\u09dc\u09be\u0964 \u09a4\u09c1\u09ae\u09bf \u098f\u099f\u09bf \u09b6\u09c7\u0996\u09cb\u09a8\u09bf, \u09a4\u09be\u0987 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb: \u098f\u0995\u099c\u09a8 \u0987\u099f\u09be\u09b0 \u0996\u09c1\u09ac \u0996\u09be\u09df, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09a4\u09be\u09b0 \u09ae\u09c1\u0996\u09c7 \u09ac\u09cd\u09af\u09a5\u09be\u0964 \u098f\u0996\u09a8 \u0996\u09c7\u09a4\u09c7 \u0997\u09c7\u09b2\u09c7\u0987 \u0987\u09a4\u09be\u0987 \u0987\u09a4\u09be\u0987 \u09ac\u09cd\u09af\u09a5\u09be\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%97%9B%E3%81%84"}, {"char": "\u7720\u3044", "id": 5058, "image": null, "kanji": ["\u7720"], "meaning": "Sleepy", "meaning_mnemonic": "This is a single kanji with an \u3044 on the end, meaning you know it\u0027s probably an adjective. What\u0027s the adjective form of \u003ckanji\u003esleep\u003c/kanji\u003e? It\u0027s \u003cvocabulary\u003esleepy\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u09a4\u09c1\u09ae\u09bf \u098f\u0995\u099f\u09be \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09b6\u09c7\u09b7\u09c7 \u0987 \u09a6\u09c7\u0996\u09b2\u09c7 \u09ac\u09cb\u099d\u09cb \u098f\u099f\u09be \u09ac\u09bf\u09b6\u09c7\u09b7\u09a3\u0964 \u0998\u09c1\u09ae \u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u09ac\u09bf\u09b6\u09c7\u09b7\u09a3 \u09b0\u09c2\u09aa \u0995\u09c0? \u0998\u09c1\u09ae\u0998\u09c1\u09ae \u09ad\u09be\u09ac, \u09ae\u09be\u09a8\u09c7 \u0998\u09c1\u09ae \u09aa\u09be\u099a\u09cd\u099b\u09c7 \u098f\u09ae\u09a8\u0964", "radicals": [], "reading_display": "\u306d\u3080\u3044", "reading_mnemonic": "You\u0027re so \u003cvocabulary\u003esleepy\u003c/vocabulary\u003e you can\u0027t even remember your own \u003creading\u003ename\u003c/reading\u003e (\u306d\u3080).", "reading_mnemonic_bn": "\u09a4\u09c1\u09ae\u09bf \u098f\u09a4 \u0998\u09c1\u09ae\u0998\u09c1\u09ae \u09af\u09c7 \u09a8\u09bf\u099c\u09c7\u09b0 \u09a8\u09be\u09ae\u0993 \u09ae\u09a8\u09c7 \u0995\u09b0\u09a4\u09c7 \u09aa\u09be\u09b0\u099b \u09a8\u09be\u0964 \u09a8\u09be\u09ae \u09ad\u09c1\u09b2\u09c7 \u09ae\u09c1\u0996\u09c7 \u0986\u09b8\u09c7 \u09a8\u09c7\u09ae\u09c1\u0987, \u09a8\u09c7\u09ae\u09c1\u0987\u2014\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u09c7\u0987 \u09aa\u09a1\u09bc\u09be\u09b0 \u09b8\u09c1\u09b0\u099f\u09be \u09a7\u09b0\u09cb\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%9C%A0%E3%81%84"}, {"char": "\u4e26", "id": 5110, "image": null, "kanji": ["\u4e26"], "meaning": "Ordinary", "meaning_mnemonic": "The things that \u003ckanji\u003eline up\u003c/kanji\u003e are \u003cvocabulary\u003eordinary\u003c/vocabulary\u003e and \u003cvocabulary\u003eaverage\u003c/vocabulary\u003e things. Because the majority of things (or people) fall into the average category, you could say most of them line up side by side with each other.\n\nThis might be why \u4e26 is often used in restaurants to refer to standard (or average) portion sizes. And in sushi restaurants, \u4e26 can refer to a standard set, as opposed to a more luxurious or premium one.\n\nNote that when describing something as \u4e26 outside of a restaurant or commercial context, it could have a slightly judgmental tone. Most people wouldn\u0027t love it if you called their work (or them) ordinary and average, you know?", "meaning_mnemonic_bn": "\u09af\u09c7 \u099c\u09bf\u09a8\u09bf\u09b8\u0997\u09c1\u09b2\u09cb \u09b8\u09be\u09b0\u09bf\u09ac\u09a6\u09cd\u09a7 \u09b9\u09af\u09bc \u09b8\u09c7\u0997\u09c1\u09b2\u09cb\u0987 \u09b8\u09be\u09a7\u09be\u09b0\u09a3 \u0986\u09b0 \u09ae\u09cb\u099f\u09be\u09ae\u09c1\u099f\u09bf\u0964 \u09ac\u09c7\u09b6\u09bf\u09b0\u09ad\u09be\u0997 \u099c\u09bf\u09a8\u09bf\u09b8 \u09ac\u09be \u09ae\u09be\u09a8\u09c1\u09b7 \u09ae\u09be\u099d\u09be\u09b0\u09bf \u0998\u09b0\u09be\u09a8\u09be\u09b0, \u09a4\u09be\u0987 \u09a4\u09be\u09b0\u09be \u09aa\u09be\u09b6\u09be\u09aa\u09be\u09b6\u09bf \u09b8\u09be\u09b0\u09bf\u09a4\u09c7 \u09a6\u09be\u0981\u09a1\u09bc\u09be\u09af\u09bc\u0964 \u09b0\u09c7\u09b8\u09cd\u099f\u09c1\u09b0\u09c7\u09a8\u09cd\u099f\u09c7 \u098f\u099f\u09be\u0987 \u09b8\u09be\u09a7\u09be\u09b0\u09a3 \u09aa\u09cd\u09b2\u09c7\u099f \u09ac\u09cb\u099d\u09be\u09af\u09bc, \u09b8\u09c1\u09b6\u09bf\u09a4\u09c7\u0993 \u09b8\u09be\u09a7\u09be\u09b0\u09a3 \u09b8\u09c7\u099f\u0964 \u09ac\u09be\u0987\u09b0\u09c7 \u0995\u09be\u0989\u0995\u09c7 \u09b8\u09be\u09a7\u09be\u09b0\u09a3 \u09ac\u09b2\u09b2\u09c7 \u098f\u0995\u099f\u09c1 \u09ac\u09bf\u099a\u09be\u09b0-\u09ae\u09c7\u09b6\u09be\u09a8\u09cb \u09b8\u09c1\u09b0 \u09b6\u09cb\u09a8\u09be \u09af\u09be\u09af\u09bc, \u09a4\u09be\u0987 \u0995\u09c7\u0989 \u09b8\u09c7\u099f\u09be \u09aa\u099b\u09a8\u09cd\u09a6 \u0995\u09b0\u09ac\u09c7 \u09a8\u09be\u0964\n\n\u09b9\u09a0\u09be\u09ce \u09ae\u09a8\u09c7 \u09b9\u09af\u09bc \u09a4\u09c1\u09ae\u09bf \u0996\u09c1\u09ac \u09b8\u09be\u09a7\u09be\u09b0\u09a3\u0964 \u09b8\u09c7\u0987 \u09ad\u09be\u09ac\u09a8\u09be \u09ac\u09a1\u09bc \u09a2\u09c7\u0989\u09af\u09bc\u09c7\u09b0 \u09ae\u09a4\u09cb \u09a7\u09be\u0995\u09cd\u0995\u09be \u09a6\u09c7\u09af\u09bc\u0964 \u09a4\u09c1\u09ae\u09bf \u09ac\u09b2\u09c7 \u0993\u09a0\u09cb \u0986\u09ae\u09bf \u09a4\u09cb \u09aa\u09c1\u09b0\u09cb \u09ae\u09cb\u099f\u09be\u09ae\u09c1\u099f\u09bf\u0964 \u0986\u09b0 \u09a8\u09be\u09ae\u09bf \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09a2\u09c7\u0989\u09af\u09bc\u09c7\u09b0 \u0997\u09b0\u09cd\u099c\u09a8\u09c7\u09b0 \u09ae\u09a4\u09cb \u0995\u09be\u09a8\u09c7 \u09ac\u09be\u099c\u09c7\u0964", "radicals": [], "reading_display": "\u306a\u307f", "reading_mnemonic": "Since this word is made up of a single kanji, it probably uses the kun\u0027yomi reading. You did not learn this reading, so here\u0027s a mnemonic to help you to remember:\n\nOne day, out of the blue, you realize you\u0027re very \u003cvocabulary\u003eordinary\u003c/vocabulary\u003e. The thought thought crashes into you like a big \u003creading\u003e\u6ce2\u003c/reading\u003e (\u306a\u307f). \"Oh my gosh\u2026 I\u0027m totally \u003cvocabulary\u003eaverage\u003c/vocabulary\u003e!\" you exclaim as \u6ce2 after \u6ce2 of disappointment and self-loathing washes over you.", "reading_mnemonic_bn": "\u09b9\u09a0\u09be\u09ce \u09ae\u09a8\u09c7 \u09b9\u09af\u09bc \u09a4\u09c1\u09ae\u09bf \u0996\u09c1\u09ac \u09b8\u09be\u09a7\u09be\u09b0\u09a3\u0964 \u09b8\u09c7\u0987 \u09ad\u09be\u09ac\u09a8\u09be \u09ac\u09a1\u09bc \u09a2\u09c7\u0989\u09af\u09bc\u09c7\u09b0 \u09ae\u09a4\u09cb \u09a7\u09be\u0995\u09cd\u0995\u09be \u09a6\u09c7\u09af\u09bc\u0964 \u09a4\u09c1\u09ae\u09bf \u09ac\u09b2\u09c7 \u0993\u09a0\u09cb \u0986\u09ae\u09bf \u09a4\u09cb \u09aa\u09c1\u09b0\u09cb \u09ae\u09cb\u099f\u09be\u09ae\u09c1\u099f\u09bf\u0964 \u0986\u09b0 \u09a8\u09be\u09ae\u09bf \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09a2\u09c7\u0989\u09af\u09bc\u09c7\u09b0 \u0997\u09b0\u09cd\u099c\u09a8\u09c7\u09b0 \u09ae\u09a4\u09cb \u0995\u09be\u09a8\u09c7 \u09ac\u09be\u099c\u09c7\u0964", "url": "https://www.wanikani.com/vocabulary/%E4%B8%A6"}, {"char": "\u4e26\u3076", "id": 5109, "image": null, "kanji": ["\u4e26"], "meaning": "To Line Up", "meaning_mnemonic": "The kanji means \u003ckanji\u003eline up\u003c/kanji\u003e, so the verb vocab version means \u003cvocabulary\u003eto line up\u003c/vocabulary\u003e or \u003cvocabulary\u003eto be lined up\u003c/vocabulary\u003e. \n\n\u4e26\u3076 is intransitive, so it describes things being in a line, rather than things you\u0027re putting in a line yourself. You can remember this because you always say \u003creading\u003eboo\u003c/reading\u003e (\u3076) when you arrive at a store or a restaurant and see that there are already a bunch of people lined up outside.\n\nFiguratively, this can also mean \u003cvocabulary\u003eto be on par\u003c/vocabulary\u003e in terms of ability or status. Just imagine two people lined up side-by-side in a race, neither one able to overtake the other.", "meaning_mnemonic_bn": "\u0985\u09b0\u09cd\u09a5 \u09b9\u09b2\u09cb \u09b2\u09be\u0987\u09a8\u09c7 \u09a6\u09be\u0981\u09a1\u09bc\u09be\u09a8\u09cb \u09ac\u09be \u09b2\u09be\u0987\u09a8\u09c7 \u09a5\u09be\u0995\u09be\u0964 \u098f\u0996\u09be\u09a8\u09c7 \u0995\u09be\u099c\u099f\u09be \u09a8\u09bf\u099c\u09c7 \u09a5\u09c7\u0995\u09c7 \u0998\u099f\u09c7, \u09a4\u09c1\u09ae\u09bf \u0995\u09be\u0989\u0995\u09c7 \u09b2\u09be\u0987\u09a8\u09c7 \u09ac\u09b8\u09be\u0993 \u09a8\u09be\u0964 \u09a6\u09cb\u0995\u09be\u09a8 \u09ac\u09be \u09b0\u09c7\u09b8\u09cd\u099f\u09c1\u09b0\u09c7\u09a8\u09cd\u099f\u09c7 \u0997\u09bf\u09af\u09bc\u09c7 \u09a6\u09c7\u0996\u09cb \u09b2\u09cb\u0995\u09c7\u09b0\u09be \u09ac\u09be\u0987\u09b0\u09c7 \u09b2\u09be\u0987\u09a8 \u0995\u09b0\u09c7\u099b\u09c7, \u09a4\u0996\u09a8 \u09a4\u09c1\u09ae\u09bf \u09ac\u09b2\u09c7 \u0993\u09a0\u09cb \u09ac\u09c1\u0964 \u09b0\u09c2\u09aa\u0995 \u0985\u09b0\u09cd\u09a5\u09c7 \u09b8\u09be\u09ae\u09b0\u09cd\u09a5\u09cd\u09af \u09ac\u09be \u09ae\u09b0\u09cd\u09af\u09be\u09a6\u09be\u09af\u09bc \u09b8\u09ae\u09be\u09a8 \u09b9\u0993\u09af\u09bc\u09be; \u09a6\u09cc\u09a1\u09bc\u09c7 \u09a6\u09c1\u099c\u09a8 \u09aa\u09be\u09b6\u09be\u09aa\u09be\u09b6\u09bf \u09b2\u09be\u0987\u09a8\u09c7, \u0995\u09c7\u0989 \u0995\u09be\u0989\u0995\u09c7 \u099b\u09be\u09a1\u09bc\u09be\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7 \u09a8\u09be\u0964", "radicals": [], "reading_display": "\u306a\u3089\u3076", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: \n\nYou expect all the deer \u003cvocabulary\u003eto line up\u003c/vocabulary\u003e when you visit \u003creading\u003eNara\u003c/reading\u003e (\u306a\u3089). You are the official Nara deer inspector, and the deer need to line up so you can inspect them whenever you come to town. (If you don\u0027t know about Nara and its deer, you should look them up \u2014 they\u0027re pretty famous.)", "reading_mnemonic_bn": "\u09aa\u09a1\u09bc\u09be \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb \u09a8\u09be\u09b0\u09be \u09a6\u09bf\u09af\  it means \u003cvocabulary\u003eto ache\u003c/vocabulary\u003e, \u003cvocabulary\u003eto hurt\u003c/vocabulary\u003e, or \u003cvocabulary\u003eto be in pain\u003c/vocabulary\u003e.\n\n\u75db\u3080 is an intransitive verb that suggests an ongoing sensation of pain or aching. It\u0027s a little more descriptive than \u75db\u3044, so you might see it used in writing or to describe a more persistent or recurring condition. It\u0027s also often used figuratively, especially in expressions like \u5fc3\u304c\u75db\u3080 (my heart aches).", "meaning_mnemonic_bn": "\u09ac\u09cd\u09af\u09a5\u09be \u09ac\u09cb\u099d\u09be\u09a8\u09cb \u099a\u09c7\u09a8\u09be \u09b6\u09ac\u09cd\u09a6\u099f\u09be\u09b0 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be \u09b0\u09c2\u09aa \u098f\u099f\u09be, \u09a4\u09be\u0987 \u0985\u09b0\u09cd\u09a5 \u09ac\u09cd\u09af\u09a5\u09be \u0995\u09b0\u09be, \u09ac\u09cd\u09af\u09a5\u09be \u09b2\u09be\u0997\u09be, \u09ac\u09cd\u09af\u09a5\u09be\u09af\u09bc \u09a5\u09be\u0995\u09be\u0964 \u0985\u0995\u09b0\u09cd\u09ae\u0995 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be \u09b9\u09bf\u09b8\u09c7\u09ac\u09c7 \u099f\u09be\u09a8\u09be \u09ac\u09cd\u09af\u09a5\u09be\u09b0 \u0985\u09a8\u09c1\u09ad\u09c2\u09a4\u09bf \u09ac\u09cb\u099d\u09be\u09af\u09bc, \u09b8\u09be\u09a7\u09be\u09b0\u09a3 \u09ac\u09cd\u09af\u09a5\u09be\u09b0 \u0995\u09a5\u09be\u09b0 \u099a\u09c7\u09af\u09bc\u09c7 \u098f\u0995\u099f\u09c1 \u09ac\u09c7\u09b6\u09bf \u09ac\u09b0\u09cd\u09a3\u09a8\u09be\u09ae\u09af\u09bc\u0964 \u09b2\u09c7\u0996\u09be\u09af\u09bc \u09ac\u09be \u09ac\u09be\u09b0\u09ac\u09be\u09b0 \u09ab\u09bf\u09b0\u09c7 \u0986\u09b8\u09be \u09ac\u09cd\u09af\u09a5\u09be\u09b0 \u09ac\u09c7\u09b2\u09be\u09af\u09bc \u09ac\u09c7\u09b6\u09bf \u09a6\u09c7\u0996\u09cb\u0964 \u09b0\u09c2\u09aa\u0995\u09c7\u0993 \u0986\u09b8\u09c7\u2014\u09ae\u09a8 \u09ac\u09cd\u09af\u09a5\u09be \u09aa\u09be\u09af\u09bc, \u09ac\u09c1\u0995\u099f\u09be \u0995\u09c7\u0981\u09a6\u09c7 \u0993\u09a0\u09c7 \u09ac\u09cb\u099d\ ve the \u003ckanji\u003efeeling\u003c/kanji\u003e of \u003ckanji\u003epleasant\u003c/kanji\u003eness, you are experiencing \u003cvocabulary\u003epleasure\u003c/vocabulary\u003e.\n\nWhile \u5feb\u611f can describe the thrill of achieving something satisfying, it\u0027s often associated with \u003cvocabulary\u003epleasurable feeling\u003c/vocabulary\u003es from taboo or unusual experiences. For example, it might refer to the pleasure of teasing someone, indulging in a bad habit like picking earwax, or feeling sensual delight.", "meaning_mnemonic_bn": "\u09af\u0996\u09a8 \u09a4\u09cb\u09ae\u09be\u09b0 \u09ae\u09a8\u09c7 \u098f\u0995 \u0986\u09a8\u09a8\u09cd\u09a6\u09ae\u09af\u09bc \u0985\u09a8\u09c1\u09ad\u09c2\u09a4\u09bf \u099c\u09be\u0997\u09c7, \u09a4\u0996\u09a8 \u09a4\u09c1\u09ae\u09bf \u098f\u0995 \u09a7\u09b0\u09a8\u09c7\u09b0 \u09b8\u09c1\u0996 \u09ac\u09be \u0986\u09a8\u09a8\u09cd\u09a6 \u09aa\u09be\u099a\u09cd\u099b\u09cb\u0964 \u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09aa\u09cd\u09b0\u09be\u09af\u09bc\u0987 \u098f\u09ae\u09a8 \u09b8\u09c1\u0996 \u09ac\u09cb\u099d\u09be\u09af\u09bc \u09af\u09be \u098f\u0995\u099f\u09c1 \u09b2\u09c1\u0995\u09be\u09a8\u09cb \u09ac\u09be \u0985\u099a\u09c7\u09a8\u09be \u0985\u09ad\u09bf\u099c\u09cd\u099e\u09a4\u09be \u09a5\u09c7\u0995\u09c7 \u0986\u09b8\u09c7, \u09af\u09c7\u09ae\u09a8 \u0995\u09be\u0989\u0995\u09c7 \u099c\u09cd\u09ac\u09be\u09b2\u09be\u09a8\u09cb, \u0995\u09be\u09a8 \u0996\u09cb\u0981\u099a\u09be\u09a8\u09cb, \u09ac\u09be \u09b6\u09b0\u09c0\u09b0\u09c0 \u0986\u09a8\u09a8\u09cd\u09a6\u0964", "radicals": [], "reading_display": "\u304b\u3044\u304b\u3093", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "reading_mnemonic_bn": "\u09aa\u09a1\u09bc\u09be\u099f\u09be \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb: \u0995\u09be\u0987\u0995\u09be\u09a8\u0964 \u0995\u09be\u0987 ing": "To Injure Something", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. \n\nThe kanji itself means \u003ckanji\u003epain\u003c/kanji\u003e, and this verb is transitive, so it means to inflict pain. In other words, it\u0027s \u003cvocabulary\u003eto injure something\u003c/vocabulary\u003e or \u003cvocabulary\u003eto hurt someone\u003c/vocabulary\u003e.\n\nThis verb focuses on the pain involved in an injury, so it can only be used for things that feel pain, like people and body parts.", "meaning_mnemonic_bn": "\u09b6\u09ac\u09cd\u09a6\u099f\u09bf\u09a4\u09c7 \u0995\u09be\u099e\u09cd\u099c\u09bf \u0986\u09b0 \u099c\u09cb\u09dc\u09be \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be \u0986\u099b\u09c7\u0964 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be \u09b6\u09c7\u09b7 \u09b9\u09df \u0989-\u09a7\u09cd\u09ac\u09a8\u09bf\u09a4\u09c7, \u09a4\u09be\u0987 \u098f\u099f\u09bf \u0995\u09cd\u09b0\u09bf\u09df\u09be\u0964 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u0985\u09b0\u09cd\u09a5 \u09ac\u09cd\u09af\u09a5\u09be, \u0986\u09b0 \u0995\u09cd\u09b0\u09bf\u09df\u09be\u099f\u09bf \u09b8\u0995\u09b0\u09cd\u09ae\u0995\u2014\u09a4\u09be\u0987 \u098f\u09b0 \u09ae\u09be\u09a8\u09c7 \u0995\u09bf\u099b\u09c1\u0995\u09c7 \u09ac\u09cd\u09af\u09a5\u09be \u09a6\u09c7\u0993\u09df\u09be, \u0995\u09be\u0989\u0995\u09c7 \u0986\u0998\u09be\u09a4 \u0995\u09b0\u09be \u09ac\u09be \u0995\u09b7\u09cd\u099f \u09a6\u09c7\u0993\u09df\u09be\u0964 \u098f\u0987 \u09ac\u09cd\u09af\u09a5\u09be \u09b6\u09c1\u09a7\u09c1 \u09ae\u09be\u09a8\u09c1\u09b7 \u09ac\u09be \u09b6\u09b0\u09c0\u09b0\u09c7\u09b0 \u0985\u0982\u09b6\u09c7\u09b0 \u09ae\u09a4\u09cb \u09ac\u09cd\u09af\u09a5\u09be-\u09ac\u09cb\u09a7 \u0995\u09b0\u09be \u099c\u09bf\u09a8\u09bf\u09b8\u09c7\u0987 \u09b2\u09be\u0997\u09c7\u0964", "radicals": [], "reading_display": "\u3044\u305f\u3081\u308b", "reading_mnemonic": "Since this word has okuriga ngs from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "reading_mnemonic_bn": "\u09ac\u09bf\u09af\u09bc\u09c7\u09b0 \u09ae\u09a3\u09cd\u09a1\u09aa\u09c7 \u099c\u09cb\u09b0\u09c7 \u09ac\u09b2\u09cb, \u0995\u09c7 \u0995\u09a8? \u098f\u0987 \u09a1\u09be\u0995\u09c7\u0987 \u099c\u09be\u09aa\u09be\u09a8\u09bf \u0989\u099a\u09cd\u099a\u09be\u09b0\u09a3 \u0995\u09c7\u0995\u09cd\u0995\u09cb\u09a8\u09cd \u09a4\u09cb\u09ae\u09be\u09b0 \u0995\u09be\u09a8\u09c7 \u09ac\u09be\u099c\u09ac\u09c7\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%B5%90%E5%A9%9A"}, {"char": "\u9069\u5f53", "id": 5378, "image": null, "kanji": ["\u9069", "\u5f53"], "meaning": "Appropriate", "meaning_mnemonic": "Everything is \u003ckanji\u003esuitable\u003c/kanji\u003e and \u003ckanji\u003eright\u003c/kanji\u003e. Therefore it is \u003cvocabulary\u003eappropriate\u003c/vocabulary\u003e, \u003cvocabulary\u003eproper\u003c/vocabulary\u003e, and \u003cvocabulary\u003esuitable\u003c/vocabulary\u003e. Strangely enough, this also means \u003cvocabulary\u003eirresponsible\u003c/vocabulary\u003e. Maybe it\u0027s because when everything is suitable and right for you, you\u0027re taking too much and not leaving enough for everyone else, making you irresponsible?", "meaning_mnemonic_bn": "\u09b8\u09ac\u0995\u09bf\u099b\u09c1 \u09a4\u09cb\u09ae\u09be\u09b0 \u099c\u09a8\u09cd\u09af \u0989\u09aa\u09af\u09c1\u0995\u09cd\u09a4 \u0986\u09b0 \u09a0\u09bf\u0995\u0964 \u09a4\u09be\u0987 \u098f\u099f\u09be \u0989\u09aa\u09af\u09c1\u0995\u09cd\u09a4, \u09a0\u09bf\u0995 \u0986\u09b0 \u09ae\u09be\u09a8\u09be\u09a8\u09b8\u0987\u0964 \u0985\u09a6\u09cd\u09ad\u09c1\u09a4\u09ad\u09be\u09ac\u09c7 \u098f\u09b0 \u09ae\u09be\u09a8\u09c7 \u09a6\u09be\u09af\u09bc\u09bf\u09a4\u09cd\u09ac\u09b9\u09c0\u09a8\u0993\u0964 \u0995\u09be\u09b0\u09a3 \u09b8\u09ac\u0995\u09bf\u099b\u09c1 \u09a4\u09cb\u09ae\u09be\u09b0 \u099c\u09a8\u09cd\u09af \u0989\u09aa\u09af\u09c1\u0995\u09cd\u09a4 \u0986\u09b0 \u09a0\u09bf\u0995 \u09b9\u09b2\u09c7 \u09a4\u09c1\u09ae\u09bf \u09ac\u09c7\u09b6\u09bf \u09a8\u09bf\u09af\u09bc\u09c7 \u09a8\u09bf\u099a\u09cd\u099b, \u0985\u09a8\u09cd\u09af\u09a6\u09c7\u09b0 \u099c\u09a8\u09cd\u09af \u0995\u09ae \u09b0\u09be\u0996\u099b, \u09a4\u09be\u0987 \u09a4\u09c1\u09ae\u09bf \u09a6\u09be\u09af\u09bc\u09bf\u09a4\u09cd\u09ac\u09b9\u09c0\u09a8 \u09b9\u09af\u09bc\u09c7 \u09af\u09be\u099a\u09cd\u099b\u0964", "radicals": [], "reading_display": "\u3066\u304d\u3068\u3046", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "reading_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u099c\u09c1\u0995\u09c1\u0997\u09cb, \u09a4\u09be\u0987 \u09b8\u09be\u09a7\u09be\u09b0\u09a3\u09a4 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u0993\u09a8\u09af\u09bc\u09ae\u09bf \u09aa\u09a1\u09bc\u09be \u09b2\u09be\u0997\u09c7\u0964 \u09a4\u09c1\u09ae\u09bf \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09aa\u09a1\u09bc\u09be \u099c\u09be\u09a8\u09b2\u09c7 \u098f\u099f\u09be\u0993 \u09aa\u09a1\u09bc\u09a4\u09c7 \u09aa\u09be\u09b0\u09ac\u09c7\u0964 \u09aa\u09a1\u09bc\u09be\u099f\u09be \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb: \u09a4\u09c7\u0995\u09bf\u09a4\u09cb \u2014 \u09af\u09c7\u09a8 \u09a4\u09c1\u09ae\u09bf \u09ac\u09b2\u099b, \u09a0\u09bf\u0995 \u09a4\u09cb?", "url": "https://www.wanikani.com/vocabulary/%E9%81%A9%E5%BD%93"}, {"char": "\u7d50\u5a5a\u3059\u308b", "id": 5512, "image": null, "kanji": ["\u7d50", "\u5a5a"], "meaning": "To Marry", "meaning_mnemonic": "\u7d50\u5a5a means \"marriage,\" so the verb version of that would be \u003cvocabulary\u003eto marry\u003c/vocabulary\u003e or \u003cvocabulary\u003eto get married\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6 \u09ae\u09be\u09a8\u09c7 \u09ac\u09bf\u09af\u09bc\u09c7; \u09a4\u09be\u0987 \u09a4\u09c1\u09ae\u09bf \u09ac\u09bf\u09af\u09bc\u09c7 \u0995\u09b0\u09b2\u09c7 \u09b8\u09c7\u099f\u09be\u0987 \u09ac\u09bf\u09af\u09bc\u09c7 \u0995\u09b0\u09be \u09ac\u09be \u09ac\u09bf\u09af\u09bc\u09c7 \u09b9\u09af\u09bc\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be\u0964", "radicals": [], "reading_display": "\u3051\u3063\u3053\u3093\u3059\u308b", "reading_mnemonic": "You\u0027ve already learned \u7d50\u5a5a, so you should be okay here. As with that word, watch out for \u7d50\u0027s \u3051\u3064 reading changing to \u3051\u3063.", "reading_mnemonic_bn": "\u0986\u0997\u09c7\u09b0 \u09ac\u09bf\u09af\u09bc\u09c7-\u09b6\u09ac\u09cd\u09a6\u099f\u09be\u0987 \u0995\u09be\u099c\u09c7 \u09b2\u09be\u0997\u09be\u0993; \u09ac\u09be\u0981\u09a7\u09be \u0985\u0982\u09b6\u09c7\u09b0 \u0995\u09c7\u09a4\u09b8\u09c1 \u09aa\u09a1\u09bc\u09be \u099b\u09cb\u099f \u09b9\u09af\u09bc\u09c7 \u0995\u09c7\u0995 \u09b9\u09af\u09bc\u0964 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb: \u0995\u09c7\u0995-\u0995\u09a8, \u09b6\u09c1\u09b0\u09c1!\u2014\u098f\u099f\u09be\u0987 \u0995\u09c7\u0995\u09cd\u0995\u09cb\u09a8\u09b8\u09c1\u09b0\u09c1\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%B5%90%E5%A9%9A%E3%81%99%E3%82%8B"}, {"char": "\u6b32\u3057\u3044", "id": 5589, "image": null, "kanji": ["\u6b32"], "meaning": "Wanted", "meaning_mnemonic": "This is a single kanji with an \u3044 on the end, meaning you know it\u0027s probably an adjective. What\u0027s the adjective form of \u003ckanji\u003ewant\u003c/kanji\u003e? It\u0027s also \u003cvocabulary\u003ewanted\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u098f\u0995\u099f\u09be \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09b6\u09c7\u09b7\u09c7 \u099b\u09cb\u099f \u098f\u0995\u099f\u09be \u09b8\u09cd\u09ac\u09b0\u09ac\u09b0\u09cd\u09a3 \u099c\u09cb\u09a1\u09bc\u09be \u09a5\u09be\u0995\u09b2\u09c7 \u09ac\u09cb\u099d\u09cb \u098f\u099f\u09bf \u09ac\u09bf\u09b6\u09c7\u09b7\u09a3\u0964 \u2018\u099a\u09be\u0993\u09af\u09bc\u09be\u2019 \u0985\u09b0\u09cd\u09a5\u09c7\u09b0 \u09ac\u09bf\u09b6\u09c7\u09b7\u09a3 \u09b0\u09c2\u09aa \u0995\u09c0? \u09b8\u09c7\u099f\u09be\u0987 \u2018\u099a\u09be\u0987\u2019 \u09ac\u09be \u2018\u099a\u09be\u0993\u09af\u09bc\u09be-\u099c\u09be\u09a4\u09c0\u09af\u09bc\u2019\u0964", "radicals": [], "reading_display": "\u307b\u3057\u3044", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: What do you want? A \u003creading\u003ehoe\u003c/reading\u003e (\u307b), like a garden hoe, you sicko.", "reading_mnemonic_bn": "\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u09c7 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be \u099c\u09cb\u09a1\u09bc\u09be, \u09a4\u09be\u0987 \u0995\u09c1\u09a8-\u09af\u09bc\u09cb\u09ae\u09bf \u09aa\u09a1\u09bc\u09be\u0964 \u098f\u0987 \u09aa\u09a1\u09bc\u09be \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u0986\u0997\u09c7 \u09b6\u09c7\u0996\u09be \u09b9\u09af\u09bc\u09a8\u09bf, \u09a4\u09be\u0987 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb: \u09a4\u09c1\u09ae\u09bf \u0995\u09c0 \u099a\u09be\u0993? \u098f\u0995\u099f\u09be \u0995\u09cb\u09a6\u09be\u09b2, \u09ac\u09be\u0997\u09be\u09a8\u09c7\u09b0 \u0995\u09cb\u09a6\u09be\u09b2\u2014\u09a4\u09c1\u09ae\u09bf \u09aa\u09be\u0997\u09b2 \u0995\u09cb\u09a5\u09be\u0995\u09be\u09b0! \u09b8\u09c7\u0987 \u0995\u09cb\u09a6\u09be\u09b2\u09c7\u09b0 \u2018\u09b9\u09cb\u2019 \u09a5\u09c7\u0995\u09c7\u0987 \u2018\u09b9\u09cb\u09b6\u09bf\u2019 \u09aa\u09a1\u09bc\u09be\u099f\u09be \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb\u0964", "url": "https://www.wanikani.com/vocabulary/%E6%AC%B2%E3%81%97%E3%81%84"}, {"char": "\u6c5a\u308c\u308b", "id": 5585, "image": null, "kanji": ["\u6c5a"], "meaning": "To Get Dirty", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003edirty\u003c/kanji\u003e so the verb vocab version is \u003cvocabulary\u003eto get dirty\u003c/vocabulary\u003e. You know you\u0027re not doing the dirtying, because it\u0027s \u003creading\u003erare\u003c/reading\u003e (\u308c\u308b) for you to get anything dirty, though things do get dirty on their own.", "meaning_mnemonic_bn": "\u09b6\u09c7\u09b7\u09c7\u09b0 \u09b9\u09bf\u09b0\u09be\u0997\u09be\u09a8\u09be \u2018\u0989\u2019 \u0986\u0993\u09af\u09bc\u09be\u099c\u09c7 \u09b6\u09c7\u09b7 \u09b9\u09af\u09bc, \u09a4\u09be\u0987 \u09ac\u09cb\u099d\u09cb \u098f\u099f\u09bf \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u0964 \u0995\u09be\u099e\u09cd\u099c\u09bf\u099f\u09bf\u09b0 \u0985\u09b0\u09cd\u09a5 \u2018\u09a8\u09cb\u0982\u09b0\u09be\u2019, \u09a4\u09be\u0987 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09b0 \u0985\u09b0\u09cd\u09a5 \u2018\u09a8\u09cb\u0982\u09b0\u09be \u09b9\u09af\u09bc\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be\u2019\u0964 \u09a4\u09c1\u09ae\u09bf \u09a8\u09bf\u099c\u09c7 \u09a8\u09cb\u0982\u09b0\u09be \u0995\u09b0\u099b \u09a8\u09be\u2014\u09a4\u09cb\u09ae\u09be\u09b0 \u09aa\u0995\u09cd\u09b7\u09c7 \u0995\u09bf\u099b\u09c1 \u09a8\u09cb\u0982\u09b0\u09be \u0995\u09b0\u09be \u09b0\u09c7\u09af\u09bc\u09be\u09b0; \u09ac\u09b0\u0982 \u099c\u09bf\u09a8\u09bf\u09b8 \u09a8\u09bf\u099c\u09c7 \u09a8\u09bf\u099c\u09c7\u0987 \u09a8\u09cb\u0982\u09b0\u09be \u09b9\u09af\u09bc\u09c7 \u09af\u09be\u09af\u09bc\u0964", "radicals": [], "reading_display": "\u3088\u3054\u308c\u308b", "reading_mnemonic": "Things seem \u003cvocabulary\u003eto get dirty\u003c/vocabulary\u003e easily around here, which is why \u003creading\u003eyou go\u003c/reading\u003e (\u3088\u3054) to great lengths to keep things clean.\n\nNote that the reading \u3088\u3054\u308c\u308b is generally used for getting physically dirty, whereas \u3051\u304c\u308c\u308b is more figurative, so more like \u201cto be defiled\u201d.", "reading_mnemonic_bn": " 03cvocabulary\u003etears\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u09a4\u09cb\u09ae\u09be\u09b0 \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u099a\u09cb\u0996\u09c7\u09b0 \u09aa\u09be\u09a8\u09bf\u09b0 \u09ac\u09bf\u09a8\u09cd\u09a6\u09c1\u0997\u09c1\u09b2\u09cb\u0987 \u09a4\u09cb\u09ae\u09be\u09b0 \u0985\u09b6\u09cd\u09b0\u09c1", "radicals": [], "reading_display": "\u306a\u307f\u3060", "reading_mnemonic": "Since this word is made up of a single kanji, it probably uses the kun\u0027yomi reading. You learned this reading with the kanji, but here\u0027s a mnemonic in case you need a refresher:\n\nYour \u003ckanji\u003eteardrop\u003c/kanji\u003es are like little waves. What are they? They\u0027re \u003creading\u003e\u6ce2\u3060\u003c/reading\u003e (\u306a\u307f\u3060).", "reading_mnemonic_bn": "\u09a4\u09cb\u09ae\u09be\u09b0 \u099a\u09cb\u0996\u09c7\u09b0 \u09aa\u09be\u09a8\u09bf\u09b0 \u09ac\u09bf\u09a8\u09cd\u09a6\u09c1\u0997\u09c1\u09b2\u09cb \u099b\u09cb\u099f \u099b\u09cb\u099f \u09a2\u09c7\u0989\u09af\u09bc\u09c7\u09b0 \u09ae\u09a4\u09cb \u0993\u0997\u09c1\u09b2\u09cb \u0995\u09c0 \u0986\u09b8\u09b2\u09c7 \u0993\u0997\u09c1\u09b2\u09cb \u09a8\u09be\u09ae\u09bf\u09a6\u09be", "url": "https://www.wanikani.com/vocabulary/%E6%B6%99"}, {"char": "\u76f4\u3061\u306b", "id": 9387, "image": null, "kanji": ["\u76f4"], "meaning": "Right Away", "meaning_mnemonic": "If someone tells you to get \u003ckanji\u003estraight\u003c/kanji\u003e to doing something, you ought to do it \u003cvocabulary\u003eright away\u003c/vocabulary\u003e. Go on, chop-chop!\n\n\u76f4\u3061\u306b means to do something \u003cvocabulary\u003eimmediately\u003c/vocabulary\u003e, and it has a nuance of urgency \u2014 for example, a tsunami warning asking people to immediately evacuate their homes or your doctor telling you to contact them at once if you experience a certain symptom. However, it can also mean \u003cvocabulary\u003edirectly\u003c/vocabulary\u003e, like \u5931\u6557\u306f\u76f4\u3061\u306b\u6b7b\u306b\u7e4b\u304c\u308b (failure will lead directly to death).", "meaning_mnemonic_bn": "\u0995\u09c7\u0989 \u09af\u09a6\u09bf \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u09ac\u09b2\u09c7 \u09b8\u09cb\u099c\u09be \u0995\u09be\u099c\u09c7 \u09b2\u09c7\u0997\u09c7 \u09af\u09be\u0993, \u09a4\u09be\u09b9\u09b2\u09c7 \u09a4\u09c1\u09ae\u09bf \u09b8\u0999\u09cd\u0997\u09c7 \u09b8\u0999\u09cd\u0997\u09c7 \u0995\u09be\u099c\u09c7 \u09b2\u09c7\u0997\u09c7 \u09af\u09be\u09ac\u09c7\u0964 \u09a6\u09c7\u09b0\u09bf \u09a8\u09af\u09bc, \u099d\u099f\u09aa\u099f!\n\n\u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09a4\u09be\u09ce\u0995\u09cd\u09b7\u09a3\u09bf\u0995 \u09ac\u09cb\u099d\u09be\u09af\u09bc, \u099c\u09b0\u09c1\u09b0\u09bf \u09ad\u09be\u09ac \u0986\u099b\u09c7\u0964 \u09af\u09c7\u09ae\u09a8 \u09b8\u09c1\u09a8\u09be\u09ae\u09bf\u09b0 \u09b8\u09a4\u09b0\u09cd\u0995\u09ac\u09be\u09b0\u09cd\u09a4\u09be \u09ac\u09b2\u09c7 \u098f\u0996\u09a8\u0987 \u0998\u09b0 \u099b\u09c7\u09a1\u09bc\u09c7 \u09b8\u09b0\u09c7 \u09af\u09be\u0993\u0964 \u09a1\u09be\u0995\u09cd\u09a4\u09be\u09b0\u0993 \u09ac\u09b2\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7\u09a8 \u0989\u09aa\u09b8\u09b0\u09cd\u0997 \u09a6\u09c7\u0996\u09b2\u09c7 \u09b8\u0999\u09cd\u0997\u09c7 \u09b8\u0999\u09cd\u0997\u09c7 \u09af\u09cb\u0997\u09be\u09af\u09cb\u0997 \u0995\u09b0\u09cb\u0964 \u098f\u099f\u09be \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u0985\u09b0\u09cd\u09a5\u09c7\u0993 \u09b9\u09af\u09bc; \u09af\u09c7\u09ae\u09a8 \u09ac\u09cd\u09af\u09b0\u09cd\u09a5\u09a4\u09be \u09b8\u09b0\u09be\u09b8\u09b0\u09bf \u09ae\u09c3\u09a4\u09cd\u09af\u09c1\u09a4\u09c7 \u09a8\u09bf\u09af\u09bc\u09c7 \u09af\u09be\u09af\u09bc\u0964", "radicals": [], "reading_display": "\u305f\u3060\u3061\u306b", "reading_mnemonic": "This word uses a rare reading for \u76f4 that you haven\u0027t seen before, so here\u0027s a mnemonic to help you remember it:\n\nEvery time your boss asks you to do something \u003cvocabulary\u003eright away\u003c/vocabulary\u003e, you do it and then yell \"\u003creading\u003eta-da\u003c/reading\u003e (\u305f\u3060)!!\" Imagine how annoying of an employee you must be, yelling \"ta-da!\" every time you finish a task. You get things done immediately, though, so no one can fire you \u2014 even if they probably want to.", "reading_mnemonic_bn": "\u09ac\u09b8 \u09af\u09a6\u09bf \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u0995\u09cb\u09a8\u09cb \u0995\u09be\u099c \u098f\u0996\u09a8\u0987 \u0995\u09b0\u09a4\u09c7 \u09ac\u09b2\u09c7, \u09a4\u09c1\u09ae\u09bf \u0995\u09be\u099c \u09b6\u09c7\u09b7 \u0995\u09b0\u09c7 \u099a\u09c7\u0981\u099a\u09bf\u09af\u09bc\u09c7 \u09ac\u09b2\u09cb \u09a4\u09be\u09a6\u09be! \u09ad\u09be\u09ac\u09cb, \u09aa\u09cd\u09b0\u09a4\u09bf\u099f\u09be \u0995\u09be\u099c\u09c7\u09b0 \u09aa\u09b0\u09c7 \u09a4\u09be\u09a6\u09be \u09ac\u09b2\u09c7 \u099a\u09c7\u0981\u099a\u09be\u09a8\u09cb \u0995\u09a4 \u09ac\u09bf\u09b0\u0995\u09cd\u09a4\u09bf\u0995\u09b0 \u098f\u0995 \u0995\u09b0\u09cd\u09ae\u099a\u09be\u09b0\u09c0 \u09a4\u09c1\u09ae\u09bf! \u09a4\u09ac\u09c1 \u0995\u09be\u099c \u09a4\u09be\u09ce\u0995\u09cd\u09b7\u09a3\u09bf\u0995 \u09b6\u09c7\u09b7 \u09b9\u09af\u09bc, \u09a4\u09be\u0987 \u0995\u09c7\u0989 \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u099a\u09be\u0995\u09b0\u09bf \u09a5\u09c7\u0995\u09c7 \u09ac\u09be\u09a6 \u09a6\u09bf\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7 \u09a8\u09be, \u09af\u09a6\u09bf\u0993 \u09b8\u09ac\u09be\u0987 \u09ae\u09a8 \u09a5\u09c7\u0995\u09c7 \u099a\u09be\u09af\u09bc\u0964 \u098f\u0987 \u09a4\u09be\u09a6\u09be \u09a1\u09be\u0995 \u09a5\u09c7\u0995\u09c7\u0987 \u09a4\u09be\u09a6\u09be\u099a\u09bf\u09a8\u09bf \u09aa\u09a1\u09bc\u09be\u099f\u09be \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb\u0964", "url": "https://www.wanikani.com/vocabulary/%E7%9B%B4%E3%81%A1%E3%81%AB"}, {"char": "\u9045\u308c\u308b", "id": 5859, "image": null, "kanji": ["\u9045"], "meaning": "To Be Late", "meaning_mnemonic": "If something or someone is \u003ckanji\u003eslow\u003c/kanji\u003e, and they \"do slow\" they are going \u003cvocabulary\u003eto be late\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u0995\u09c7\u0989 \u09ac\u09be \u0995\u09bf\u099b\u09c1 \u09af\u09a6\u09bf \u09a7\u09c0\u09b0 \u09b9\u09af\u09bc, \u0986\u09b0 \u09a7\u09c0\u09b0 \u0995\u09b0\u09c7 \u099a\u09b2\u09c7, \u09a4\u09be\u09b9\u09b2\u09c7 \u09b8\u09c7 \u09a6\u09c7\u09b0\u09bf \u0995\u09b0\u09c7 \u09ab\u09c7\u09b2\u09c7\u0964", "radicals": [], "reading_display": "\u304a\u304f\u308c\u308b", "reading_mnemonic": "What is slow and probably going to be late all the time? A big \u003creading\u003eoak\u003c/reading\u003e (\u304a\u304f). Oaks have trouble moving, and are slow, and therefore are always late, too.", "reading_mnemonic_bn": "\u09a7\u09c0\u09b0 \u0986\u09b0 \u09b8\u09ac\u09b8\u09ae\u09af\u09bc \u09a6\u09c7\u09b0\u09bf \u0995\u09b0\u09be \u099c\u09bf\u09a8\u09bf\u09b8 \u0995\u09c0? \u098f\u0995 \u09ac\u09bf\u09b6\u09be\u09b2 \u0993\u0995 \u0997\u09be\u099b\u0964 \u0993\u0995 \u0997\u09be\u099b\u09c7\u09b0 \u099a\u09b2\u09a4\u09c7 \u0995\u09b7\u09cd\u099f, \u09a4\u09be\u0987 \u09b8\u09c7 \u09a7\u09c0\u09b0, \u09a4\u09be\u0987 \u09b8\u09ac\u09b8\u09ae\u09af\u09bc \u09a6\u09c7\u09b0\u09bf\u0993 \u0995\u09b0\u09c7\u0964 \u0993\u0995 \u09a5\u09c7\u0995\u09c7 \u0993\u0995\u09c1 \u09a7\u09cd\u09ac\u09a8\u09bf, \u0986\u09b0 \u0993\u0995\u09c1\u09b0\u09c7\u09b0\u09c1 \u09aa\u09a1\u09bc\u09be\u09b0 \u0995\u09a5\u09be \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb\u0964", "url": "https://www.wanikani.com/vocabulary/%E9%81%85%E3%82%8C%E3%82%8B"}, {"char": "\u6b6f\u79d1", "id": 9284, "image": null, "kanji": ["\u6b6f", "\u79d1"], "meaning": "Dentistry", "meaning_mnemonic": "\u003ckanji\u003eTooth\u003c/kanji\u003e \u003ckanji\u003escience\u003c/kanji\u003e gives you the science of \u003cvocabulary\u003edentistry\u003c/vocabulary\u003e, simple as that!\n\nNote that when used by itself, this word solely refers to the scientific field of dentistry. You\u0027ll often see it used in combination with other medical words, so have a look at the common word combinations if you wanna know more!", "meaning_mnemonic_bn": "\u09a6\u09be\u0981\u09a4\u09c7\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8 \u099c\u09c1\u09a1\u09bc\u09b2\u09c7\u0987 \u09b9\u09af\u09bc \u09a6\u09be\u0981\u09a4\u09c7\u09b0 \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be\u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8, \u098f\u0995\u09a6\u09ae \u09b8\u09cb\u099c\u09be\u0964 \u098f\u0987 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u098f\u0995\u09be \u09a5\u09be\u0995\u09b2\u09c7 \u09b6\u09c1\u09a7\u09c1 \u09a6\u09be\u0981\u09a4\u09c7\u09b0 \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be\u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8 \u09ac\u09cb\u099d\u09be\u09af\u09bc; \u0985\u09a8\u09cd\u09af \u099a\u09bf\u0995\u09bf\u09ce\u09b8\u09be\u09b0 \u09b6\u09ac\u09cd\u09a6\u09c7\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u099c\u09c1\u09a1\u09bc\u09c7 \u0996\u09c1\u09ac \u09a6\u09c7\u0996\u09be \u09af\u09be\u09af\u09bc\u0964", "radicals": [], "reading_display": "\u3057\u304b", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. You haven\u0027t learned this reading for \u6b6f yet, so here\u0027s a mnemonic to help you:\n\nYou know who benefits from great \u003cvocabulary\u003edentistry\u003c/vocabulary\u003e? \u003creading\u003eShee\u003c/reading\u003ep (\u3057)! Have you seen one smile? Their wool makes a great, endless source of \u003cvocabulary\u003edental\u003c/vocabulary\u003e floss. That\u0027s their secret. Just think of the sheep and their perfect teeth and you\u0027ll never forget this reading!", "reading_mnemonic_bn": "\u09ad\u09c7\u09a1\u09bc\u09be\u09b0 (\u09b6\u09bf) \u09aa\u09b6\u09ae\u0987 \u09af\u09c7\u09a8 \u0985\u09ab\u09c1\u09b0\u09a8\u09cd\u09a4 \u09a6\u09be\u0981\u09a4\u09c7\u09b0 \u09ab\u09cd\u09b2\u09b8, \u0986\u09b0 \u09a4\u09be\u09a6\u09c7\u09b0 \u09a8\u09bf\u0996\u09c1\u0981\u09a4 \u09a6\u09be\u0981\u09a4 \u09a6\u09c7\  [], "reading_display": "\u3046\u304b\u304c\u3046", "reading_mnemonic": "Excuse me, I\u0027d like \u003cvocabulary\u003eto inquire\u003c/vocabulary\u003e about Chairman Kaga. \u003creading\u003eOoh! Kaga\u003c/reading\u003e (\u3046\u304b\u304c). How exciting! You\u0027re asking questions about Chairman Kaga, the ruler over the Iron Chef kingdom.", "reading_mnemonic_bn": "\u09ae\u09be\u09ab \u0995\u09b0\u09cb, \u099a\u09c7\u09af\u09bc\u09be\u09b0\u09ae\u09cd\u09af\u09be\u09a8 \u0995\u09be\u0997\u09be\u09b0 \u09ac\u09bf\u09b7\u09af\u09bc\u09c7 \u099c\u09bf\u099c\u09cd\u099e\u09c7\u09b8 \u0995\u09b0\u09a4\u09c7 \u099a\u09be\u0987\u0964 \u09a4\u09c1\u09ae\u09bf \u0985\u09ac\u09be\u0995 \u09b9\u09af\u09bc\u09c7 \u09ac\u09b2\u09cb, \u0989! \u0995\u09be\u0997\u09be \u2014 \u09b6\u09c7\u09b7\u09c7 \u0986\u09b0\u09c7\u0995\u099f\u09be \u0989 \u099c\u09cb\u09a1\u09bc\u09cb, \u09b9\u09af\u09bc \u0989\u0995\u09be\u0997\u09be\u0989\u0964 \u0986\u09af\u09bc\u09b0\u09a8 \u09b6\u09c7\u09ab \u09b0\u09be\u099c\u09cd\u09af\u09c7\u09b0 \u09b6\u09be\u09b8\u0995 \u0995\u09be\u0997\u09be\u09b0 \u09a8\u09be\u09ae\u09c7\u0987 \u09aa\u09a1\u09bc\u09be\u099f\u09be \u09ae\u09a8\u09c7 \u09a5\u09be\u0995\u09ac\u09c7\u0964", "url": "https://www.wanikani.com/vocabulary/%E4%BC%BA%E3%81%86"}, {"char": "\u4f3a\u3044", "id": 6943, "image": null, "kanji": ["\u4f3a"], "meaning": "Inquiry", "meaning_mnemonic": "If \u4f3a\u3046 is \"to inquire\" or \"to visit\" then the noun version would be a polite way to say \u003cvocabulary\u003einquiry\u003c/vocabulary\u003e or \u003cvocabulary\u003eenquiry\u003c/vocabulary\u003e. In other words, a \u003cvocabulary\u003equestion\u003c/vocabulary\u003e. It can also mean a \u003cvocabulary\u003evisit\u003c/vocabulary\u003e.", "meaning_mnemonic_bn": "\u09af\u09c7 \u0995\u09cd\u09b0\u09bf\u09af\u09bc\u09be\u09aa\u09a6 \u09ae\u09be\u09a8\u09c7 \u099c\u09bf\u099c\u09cd\u099e\u09c7\u09b8 \u0995\u09b0\u09be \u09ac\u09be \u09a6\u09c7\u0996\u09be \u0995\u09b0\u09a4\u09c7 \u09a
