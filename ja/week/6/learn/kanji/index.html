    <script>
    /* Theme bootstrap. Runs before the stylesheet so data-theme is already
       set on the first paint (no flash of the wrong theme, including when
       navigating between pages). Saved choice beats the OS setting. */
    (function () {
        var KEY = 'n3theme:v1';

        function savedTheme() {
            try {
                var v = localStorage.getItem(KEY);
                return (v === 'dark' || v === 'light') ? v : null;
            } catch (e) { return null; }
        }

        function preferredTheme() {
            var saved = savedTheme();
            if (saved) return saved;
            return (window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var next = theme === 'dark' ? 'light' : 'dark';
            var label = btn.getAttribute('data-' + next) || next;
            btn.setAttribute('title', label);
            btn.setAttribute('aria-label', label);
        }

        /* The visible moon/sun label is swapped by CSS from data-theme; only
           the accessible name needs this late pass once the button exists. */
        applyTheme(preferredTheme());
        document.addEventListener('DOMContentLoaded', function () {
            applyTheme(document.documentElement.getAttribute('data-theme') ||
                preferredTheme());
        });
        document.addEventListener('click', function (e) {
            var btn = e.target && e.target.closest
                ? e.target.closest('#theme-toggle') : null;
            if (!btn) return;
            var next = document.documentElement.getAttribute('data-theme') === 'dark'
                ? 'light' : 'dark';
            try { localStorage.setItem(KEY, next); } catch (err) { /* private mode */ }
            applyTheme(next);
        });
    })();
    </script>
    <script>
    /* Password lock bootstrap. Runs before the stylesheet so the locked
       class is already on <html> for the first paint (no flash of page
       content). Only the SHA-256 of the site password is stored — here and
       as the localStorage value; the password itself is never written down.
       Any page with this key set to the hash stays unlocked in this browser. */
    (function () {
        var KEY = 'n3lock:v1';
        var HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
        var root = document.documentElement;

        function isUnlocked() {
            try { return localStorage.getItem(KEY) === HASH; } catch (e) { return false; }
        }

        function setLocked(locked) {
            root.classList.toggle('n3-locked', locked);
        }

        function sha256Hex(text) {
            return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text))
                .then(function (buf) {
                    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
                        return ('0' + b.toString(16)).slice(-2);
                    }).join('');
                });
        }

        setLocked(!isUnlocked());

        document.addEventListener('DOMContentLoaded', function () {
            var form = document.getElementById('lock-form');
            var input = document.getElementById('lock-input');
            var error = document.getElementById('lock-error');
            var errorTimer = null;

            function clearError() {
                if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
                if (error) error.hidden = true;
            }

            function showError() {
                if (!error) return;
                error.hidden = false;
                if (errorTimer) clearTimeout(errorTimer);
                errorTimer = setTimeout(clearError, 4000);
            }

            if (form && input) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    clearError();
                    var value = input.value;
                    if (!value) return;
                    if (!(window.crypto && crypto.subtle && window.TextEncoder)) return;
                    sha256Hex(value).then(function (hex) {
                        if (hex === HASH) {
                            try { localStorage.setItem(KEY, HASH); } catch (err) {}
                            setLocked(false);
                            input.value = '';
                            window.scrollTo(0, 0);
                        } else {
                            input.value = '';
                            input.focus();
                            showError();
                        }
                    }).catch(showError);
                });
                input.addEventListener('input', clearError);
                if (root.classList.contains('n3-locked')) input.focus();
            }

            var lockBtn = document.getElementById('lock-btn');
            if (lockBtn) {
                lockBtn.addEventListener('click', function () {
                    try { localStorage.removeItem(KEY); } catch (e) {}
                    setLocked(true);
                    clearError();
                    if (input) { input.value = ''; input.focus(); }
                    window.scrollTo(0, 0);
                });
            }
        });
    })();
    </script>

                    var rest = (m && m[3]) ? m[3] : '/';
                    if (!rest.endsWith('/')) rest += '/';
                    location.href = prefix + '/' + newLang + rest;
                });
            });

c1 \u09aa\u09a1\u09bc\u09be\u09b0 \u0995\u09a5\u09be \u09ae\u09a8\u09c7 \u0995\u09b0\u09be\u09af\u09bc\u0964", "stroke": 8, "url": "https://www.wanikani.com/kanji/%E5%AE%9F"}, {"char": "\u6b20", "compounds": [{"meaning": "a shortcoming", "reading": "\u3051\u3063\u3066\u3093", "word": "\u6b20\u70b9"}, {"meaning": "chip, lack", "reading": "\u304b\u3051\u308b", "word": "\u6b20\u3051\u308b"}, {"meaning": "absence", "reading": "\u3051\u3063\u305b\u304d", "word": "\u6b20\u5e2d"}], "example": null, "id": "\u6b20", "image": null, "kanji": [], "meaning": "lack, gap", "meaning_bn": "\u0985\u09ad\u09be\u09ac, \u09ab\u09be\u0981\u0995", "meaning_mnemonic": "This kanji is the same as the radical it comes from. \u003cradical\u003eLack\u003c/radical\u003e becomes \u003ckanji\u003eLack\u003c/kanji\u003e!", "meaning_mnemonic_bn": "\u098f\u0987 \u099a\u09bf\u09b9\u09cd\u09a8\u099f\u09bf \u09a4\u09be\u09b0 \u09b0\u09cd\u09af\u09be\u09a1\u09bf\u0995\u09cd\u09af\u09be\u09b2\u09c7\u09b0\u0987 \u09b0\u09c2\u09aa\u0964 \u09b0\u09cd\u09af\u09be\u09a1\u09bf\u0995\u09cd\u09af\u09be\u09b2\u09c7 \u099b\u09bf\u09b2 \u0985\u09ad\u09be\u09ac, \u099a\u09bf\u09b9\u09cd\u09a8\u09c7\u0993 \u09a4\u09be\u0987 \u0985\u09ad\u09be\u09ac!", "radicals": [{"char": "\u6b20", "image": null, "meaning": "Lack", "week": 1}], "reading_display": "\u3051\u3064 \u00b7 \u304b", "reading_mnemonic": "To remember \u3051\u3064, we use the word \"ketsup.\" It\u0027s the perfect blend of ketchup and catsup!\n\nYou\u0027re \u003ckanji\u003elack\u003c/kanji\u003eing something in your fridge. You look around, trying to find the \u003creading\u003eketsu\u003c/reading\u003ep (\u3051\u3064) you lack. You can\u0027t find it, because you lack it.", "reading_mnemonic_bn": "\u09a4\u09cb\u09ae\u09be\u09b0 \u09ab\u09cd\u09b0\u09bf\u099c\u09c7 \u0995\u09bf\u099b\u09c1 \u09a8\u09c7\u0987\u0964 \u09a4\u09c1\u09ae\u09bf \u0996\u09c1\u0981\u099c\u09c7 \u09ac\u09c7\u09a1\u09bc\u09be\u099a\u09cd\u099b \u09b8\u09c7\u0987 \u0995\u09c7\u099f\u09b \u09af\u09bc, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09a4\u09c1\u09ae\u09bf \u09ae\u09be\u099d\u0996\u09be\u09a8\u09c7 \u0995\u09cd\u09b0\u09b8 \u0997\u09c1\u0981\u099c\u09c7 \u098f\u0995 \u09ae\u09be\u09a5\u09be \u09a5\u09c7\u0995\u09c7 \u0985\u09a8\u09cd\u09af \u09ae\u09be\u09a5\u09be \u09a6\u09c7\u0996\u09b2\u09c7\u0987 \u09b8\u0999\u09cd\u0997\u09c7 \u09b8\u0999\u09cd\u0997\u09c7 \u09ae\u09be\u09aa \u09aa\u09c7\u09af\u09bc\u09c7 \u09af\u09be\u0993\u0964", "radicals": [{"char": "\u5341", "image": null, "meaning": "Cross", "week": 1}, {"char": "\u7530", "image": null, "meaning": "Rice Paddy", "week": 1}, {"char": "\u5bf8", "image": null, "meaning": "Measurement", "week": 2}], "reading_display": "\u305b\u3093 \u00b7 \u3082\u3063\u3071", "reading_mnemonic": "Hearing of your amazing \u003ckanji\u003especialty\u003c/kanji\u003e and cross measurement abilities, a \u003creading\u003ecen\u003c/reading\u003etaur (\u305b\u3093) from a far off land recruits you for a job. The centaur\u2019s father has just passed away and the centaur wants you to measure the rice paddies that have been left to him.", "reading_mnemonic_bn": "\u09a4\u09cb\u09ae\u09be\u09b0 \u0995\u09cd\u09b0\u09b8 \u09a6\u09bf\u09af\u09bc\u09c7 \u09ae\u09be\u09aa\u09be\u09b0 \u09ac\u09bf\u09b6\u09c7\u09b7\u09a4\u09cd\u09ac \u09b6\u09c1\u09a8\u09c7 \u09a6\u09c2\u09b0\u09c7\u09b0 \u09a6\u09c7\u09b6\u09c7\u09b0 \u098f\u0995 \u09b8\u09c7\u09a8\u09cd\u099f\u09b0 \u09a4\u09cb\u09ae\u09be\u0995\u09c7 \u0995\u09be\u099c\u09c7 \u09a8\u09c7\u09af\u09bc\u0964 \u09a4\u09be\u09b0 \u09ac\u09be\u09ac\u09be \u09b8\u09ac\u09c7 \u09ae\u09be\u09b0\u09be \u0997\u09c7\u099b\u09c7\u09a8, \u09a4\u09be\u0987 \u09b8\u09c7 \u099a\u09be\u09af\u09bc \u09a4\u09c1\u09ae\u09bf \u09a4\u09be\u09b0 \u09aa\u09be\u0993\u09af\u09bc\u09be \u09a7\u09be\u09a8\u0996\u09c7\u09a4\u0997\u09c1\u09b2\u09cb \u09ae\u09c7\u09aa\u09c7 \u09a6\u09be\u0993; \u09b8\u09c7\u09a8\u09cd\u099f\u09b0\u09c7\u09b0 \u09b6\u09c1\u09b0\u09c1\u09a4\u09c7\u0987 \u09b8\u09c7\
