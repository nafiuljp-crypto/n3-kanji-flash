{"items": [{"char": "\u7533\u3059", "id": 2733, "image": null, "kanji": ["\u7533"], "meaning": "To Say Humbly", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003esay humbly\u003c/kanji\u003e, and this is just the verb form, \u003cvocabulary\u003eto say humbly\u003c/vocabulary\u003e. You can also call this \u003cvocabulary\u003eto say\u003c/vocabulary\u003e \u2014 just remember that it\u0027s humble!\n\nThis is a very humble way to say \"to say,\" so it\u0027s used in especially formal situations, and only to talk about yourself or your associates. Because of its formality, it\u0027s almost always in the \u307e\u3059 form, which is \u7533\u3057\u307e\u3059.", "radicals": [], "reading_display": "\u3082\u3046\u3059", "reading_mnemonic": "The reading for this kanji is the kun\u0027yomi reading, but that\u0027s the reading you learned with the kanji. High Fives.", "url": "https://www.wanikani.com/vocabulary/%E7%94%B3%E3%81%99"}, {"char": "\u7c73", "id": 2762, "image": null, "kanji": ["\u7c73"], "meaning": "Rice", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well. \n\nNote that this word refers to the grains of rice more than something that\u0027s a meal. If you\u0027re eating rice at a meal you\u0027d call it \u3054\u306f\u3093. This is like when you\u0027re talking about the rice in the fields or rice grains or something like that.", "radicals": [], "reading_display": "\u3053\u3081", "reading_mnemonic": "Since this word is made up of a single kanji, it should use the kun\u0027yomi reading. When learning the kanji, you didn\u0027t learn that reading, so here\u0027s a mnemonic to help you with this word: \n\n\"Everyone, we have rice! \u003creading\u003eCome\u003c/reading\u003e (\u3053\u3081) and get it!\"", "url": "https://www.wanikani.com/vocabulary/%E7%B1%B3"}, {"char": "\u53d6\u308b", "id": 3817, "image": null, "kanji": ["\u53d6"], "meaning": "To Take", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003etake\u003c/kanji\u003e, so the verb version is \u003cvocabulary\u003eto take something\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3068\u308b", "reading_mnemonic": "Since this word has okurigana (hiragana attached to the kanji) you know that it\u0027s probably going to be the kun\u0027yomi reading. You already know this kun\u0027yomi reading, so you should be able to read this word.", "url": "https://www.wanikani.com/vocabulary/%E5%8F%96%E3%82%8B"}, {"char": "\u5168\u7c73", "id": 3431, "image": null, "kanji": ["\u5168", "\u7c73"], "meaning": "All America", "meaning_mnemonic": "\u7c73 means \"rice,\" but remember how it can mean \"America\" too? Well, \u003ckanji\u003eall\u003c/kanji\u003e \u003ckanji\u003eAmerica\u003c/kanji\u003e is exactly what it sounds like: \u003cvocabulary\u003eall America\u003c/vocabulary\u003e. Just keep in mind that we\u0027re not talking about America as a continent here. This word specifically means \u003cvocabulary\u003ethe entire USA\u003c/vocabulary\u003e \u2014 no more, no less.", "radicals": [], "reading_display": "\u305c\u3093\u3079\u3044", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E5%85%A8%E7%B1%B3"}, {"char": "\u652f\u3048\u308b", "id": 2992, "image": null, "kanji": ["\u652f"], "meaning": "To Support", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003esupport\u003c/kanji\u003e so the verb version is \u003cvocabulary\u003et ding_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own.", "url": "https://www.wanikani.com/vocabulary/%E4%BC%9D%E8%A8%98"}, {"char": "\u5229\u304f", "id": 3267, "image": null, "kanji": ["\u5229"], "meaning": "To Work Well", "meaning_mnemonic": "You know the kanji means \u003ckanji\u003eprofit\u003c/kanji\u003e. When you make it into a verb, though, it means \u003cvocabulary\u003eto work well\u003c/vocabulary\u003e. If you think about it, when something works well it makes you a profit.", "radicals": [], "reading_display": "\u304d\u304f", "reading_mnemonic": "What works so well? Your special \u003creading\u003ekey\u003c/reading\u003e (\u304d) that can unlock anyone and anything\u0027s potential. Imagine putting it into a key slot in someone\u0027s back. Someone who\u0027s a good for nothing can\u0027t-do-anything is now an effective member of society! Go around using your key on other non-effective things and show them that anything is possible!", "url": "https://www.wanikani.com/vocabulary/%E5%88%A9%E3%81%8F"}, {"char": "\u301c\u500d", "id": 3338, "image": null, "kanji": ["\u500d"], "meaning": "Times", "meaning_mnemonic": "Throw this onto a number and you have yourself the number of \u003cvocabulary\u003etimes\u003c/vocabulary\u003e something has increased. For example, \uff13\u500d means something increased \"three fold.\"", "radicals": [], "reading_display": "\u3070\u3044", "reading_mnemonic": "The reading is the same as the one you learned with the kanji. Omit the \u301c when writing out the answer, though. That just represents that there should be something before the kanji in this word when being used.", "url": "https://www.wanikani.com/vocabulary/%E3%80%9C%E5%80%8D"}, {"char": "\u53d6\u308c\u308b", "id": 4073, "image": null, "kanji": ["\u53d6"], "meaning": "To Come Off", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb.\n\nThis is an intransitive verb. That means it does not take a direct object. Something comes off. Something is removed. No direct object here. That\u0027s why this verb means \u003cvocabulary\u003eto come off\u003c/vocabulary\u003e or \u003cvocabulary\u003eto be removed\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3068\u308c\u308b", "reading_mnemonic": "Since this word has okurigana (hiragana attached to the kanji) you know that it\u0027s probably going to be the kun\u0027yomi reading.\n\nLucky for you, the kanji readings for transitive and intransitive verbs are almost always the same. Once you learn one, you know them both! This reading is the same as \u53d6\u308b.", "url": "https://www.wanikani.com/vocabulary/%E5%8F%96%E3%82%8C%E3%82%8B"}, {"char": "\u7dd1", "id": 3617, "image": null, "kanji": ["\u7dd1"], "meaning": "Green", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "radicals": [], "reading_display": "\u307f\u3069\u308a", "reading_mnemonic": "The reading is the same as the one you learned with the kanji.", "url": "https://www.wanikani.com/vocabulary/%E7%B7%91"}, {"char": "\u4f8b\u3048\u3070", "id": 3657, "image": null, "kanji": ["\u4f8b"], "meaning": "For Example", "meaning_mnemonic": "This has almost the same meaning as the kanji it comes from. Instead of just simply being \"example,\" though, it\u0027s \u003cvocabulary\u003efor example\u003c/vocabulary\u003e. It can also sometimes mean \u003cvocabulary\u003esupposing that\u003c/vocabulary\u003e when talking about hypothetical scenarios. So, supposing that I start a sentence with this, I can be all like \"\u4f8b\u3048\u3070, I am using \u4f8b\u3048\u3070 in a sentence.\"", "radicals": [], "reading_display": "\u305f\u3068\u3048\u3070", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: Using all kinds of \"\u003cvocabulary\u003efor examples\u003c/vocabulary\u003e\" like this, you were \u003creading\u003etaught\u003c/reading\u003e (\u305f\u3068) many things throughout your life. For example, you were taught about...", "url": "https://www.wanikani.com/vocabulary/%E4%BE%8B%E3%81%88%E3%81%B0"}, {"char": "\u53c2\u308b", "id": 3662, "image": null, "kanji": ["\u53c2"], "meaning": "To Come", "meaning_mnemonic": "The kanji itself means \u003ckanji\u003eparticipate\u003c/kanji\u003e, so you\u0027d think this word would mean \"to participate\" but it\u0027s a little more complex than that. Think of it as \"to participate\" but where you have \u003cvocabulary\u003eto come\u003c/vocabulary\u003e or \u003cvocabulary\u003eto go\u003c/vocabulary\u003e in order to do it. This is the humble way to say those things, so you\u0027re going to these places with your tail between your legs, just happy you can participate more than anything. By extension, this is also a humble way to say \u003cvocabulary\u003eto visit\u003c/vocabulary\u003e, often used if you\u0027re visiting something sacred like a shrine or a tomb. \n\nHistorically, this word arose as a humble way to indicate visiting a person of higher social status. In a weird twist, this word has come to also mean \u003cvocabulary\u003eto be defeated\u003c/vocabulary\u003e or \u003cvocabulary\u003eto be at a loss\u003c/vocabulary\u003e. Think of it as what can happen when you\u0027re trying to participate while in an inferior position to someone or something. ", "radicals": [], "reading_display": "\u307e\u3044\u308b", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: You get \u003cvocabulary\u003eto come\u003c/vocabulary\u003e to participate! \"It\u0027s \u003creading\u003emy\u003c/reading\u003e (\u307e\u3044) lucky day!\" you exclaim.", "url": "https://www.wanikani.com/vocabulary/%E5%8F%82%E3%82%8B"}, {"char": "\u5e0c\u671b", "id": 3919, "image": null, "kanji": ["\u5e0c", "\u671b"], "meaning": "Hope", "meaning_mnemonic": "Both your \u003ckanji\u003ehope\u003c/kanji\u003es and \u003ckanji\u003ewish\u003c/kanji\u003ees are held within this vocab word. So, what is the meaning of this word? It is both \u003cvocabulary\u003ehope\u003c/vocabulary\u003e and \u003cvocabulary\u003ewish\u003c/vocabulary\u003e. Either will work.", "radicals": [], "reading_display": "\u304d\u307c\u3046", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E5%B8%8C%E6%9C%9B"}, {"char": "\u6027", "id": 7539, "image": null, "kanji": ["\u6027"], "meaning": "Gender", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.\n\n\u6027 is a somewhat formal word to talk about \u003cvocabulary\u003egender\u003c/vocabulary\u003e and \u003cvocabulary\u003esex\u003c/vocabulary\u003e, including sexual desire or activity. It\u0027s also a common suffix to describe the \u003cvocabulary\u003enature\u003c/vocabulary\u003e of something. \u5b89\u5168\u6027 refers to how safe something is by nature, for example, and \u30a6\u30a3\u30eb\u30b9\u6027 describes something virus-caused, like viral pneumonia.", "radicals": [], "reading_display": "\u305b\u3044", "reading_mnemonic": "This has the same reading as the kanji you learned, meaning you know the reading!", "url": "https://www.wanikani.com/vocabulary/%E6%80%A7"}, {"char": "\u6027\u683c", "id": 3701, "image": null, "kanji": ["\u6027", "\u683c"], "meaning": "Personality", "meaning_mnemonic": "Remember how \u6027 can also mean \u003ckanji\u003enature\u003c/kanji\u003e? Well, the \u003ckanji\u003estatus\u003c/kanji\u003e of your nature is your \u003cvocabulary\u003epersonality\u003c/vocabulary\u003e. What kind of personality do you have? Cheerful? Kind? Maybe you should take one of those online personality tests to find out.", "radicals": [], "reading_display": "\u305b\u3044\u304b\u304f", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E6%80%A7%E6%A0%BC"}, {"char": "\u671b\u307f", "id": 3688, "image": null, "kanji": ["\u671b"], "meaning": "Wish", "meaning_mnemonic": "A \u003ckanji\u003ehope\u003c/kanji\u003e is really a \u003cvocabulary\u003ewish\u003c/vocabulary\u003e that you have inside of you (though it can still be a \u003cvocabulary\u003ehope\u003c/vocabulary\u003e too).", "radicals": [], "reading_display": "\u306e\u305e\u307f", "reading_mnemonic": "What\u0027s your one big \u003cvocabulary\u003ewish\u003c/vocabulary\u003e? It\u0027s to have a different \u003creading\u003enose\u003c/reading\u003e (\u306e\u305e). Alternatively, you could think \"\u003creading\u003enose on me\u003c/reading\u003e\" for \u306e\u305e\u307f.", "url": "https://www.wanikani.com/vocabulary/%E6%9C%9B%E3%81%BF"}, {"char": "\u671b\u3080", "id": 3689, "image": null, "kanji": ["\u671b"], "meaning": "To Wish", "meaning_mnemonic": "If you have a \u003ckanji\u003ehope\u003c/kanji\u003e and you turn it into a verb, you\u0027d think it would be \"to hope.\" But what is really behind a hope? It\u0027s a desire or wish, right? That\u0027s why this word means \u003cvocabulary\u003eto wish\u003c/vocabulary\u003e or \u003cvocabulary\u003eto desire\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u306e\u305e\u3080", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: Your one wish that you have is to have a bigger \u003creading\u003enose\u003c/reading\u003e (\u306e\u305e). Feel your nose, it\u0027s too small. You wish it was two or three inches longer. Of course, if it helps to imagine you want a smaller nose or a nose at all, that\u0027s fine too. Just make sure you wish you have something nose-related.", "url": "https://www.wanikani.com/vocabulary/%E6%9C%9B%E3%82%80"}, {"char": "\u6b8b\u308a", "id": 3704, "image": null, "kanji": ["\u6b8b"], "meaning": "Remainder", "meaning_mnemonic": "This has the same meaning as the kanji. The little \u308a thrown on there is just a little \u003cvocabulary\u003eremainder\u003c/vocabulary\u003e sticking off the end of the kanji. No need to pay attention to that.", "radicals": [], "reading_display": "\u306e\u3053\u308a", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: You\u0027re waiting inside. The \u003cvocabulary\u003eremainder\u003c/vocabulary\u003e of your forces are out there, fighting. You don\u0027t know who will survive... or if they even will. You have a secret \u003creading\u003eknock\u003c/reading\u003e (\u306e\u3053), though, that you use to find out if it\u0027s one of the remaining forces outside or the enemy, broken through. You hear a knock. What is it? Is it your men or theirs? Imagine it out, focusing on the knock conversation that happens between you and the remainder.", "url": "https://www.wanikani.com/vocabulary/%E6%AE%8B%E3%82%8A"}, {"char": "\u6b8b\u308b", "id": 3705, "image": null, "kanji": ["\u6b8b"], "meaning": "To Remain Behind", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003eremainder\u003c/kanji\u003e, so the verb vocab version is \"to remainder.\" Let\u0027s make that sound better: \u003cvocabulary\u003eto remain behind\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u306e\u3053\u308b", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: You decide \u003cvocabulary\u003eto remain behind\u003c/vocabulary\u003e. Everyone else leaves, and you think you\u0027re alone. Then, someone \u003creading\u003eknock\u003c/reading\u003es (\u306e\u3053) on the door. Your heart jumps in your throat. They knock again.", "url": "https://www.wanikani.com/vocabulary/%E6%AE%8B%E3%82%8B"}, {"char": "\u9858\u671b", "id": 3690, "image": null, "kanji": ["\u9858", "\u671b"], "meaning": "Desire", "meaning_mnemonic": "The \u003ckanji\u003ehope\u003c/kanji\u003e you \u003ckanji\u003erequest\u003c/kanji\u003e is your \u003cvocabulary\u003edesire\u003c/vocabulary\u003e. Just imagine yourself hoping and requesting some higher power for something you really want. What is this? It\u0027s your \u003cvocabulary\u003edesire\u003c/vocabulary\u003e or \u003cvocabulary\u003ewish\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u304c\u3093\u307c\u3046", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E9%A1%98%E6%9C%9B"}, {"char": "\u6255\u3046", "id": 5927, "image": null, "kanji": ["\u6255"], "meaning": "To Pay", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003epay\u003c/kanji\u003e so the verb vocab version is \u003cvocabulary\u003eto pay\u003c/vocabulary\u003e.\n\nThis word also means \u003cvocabulary\u003eto brush off\u003c/vocabulary\u003e, like when you brush dirt or dust off of something.", "radicals": [], "reading_display": "\u306f\u3089\u3046", "reading_mnemonic": "The reading comes from the one you learned with the kanji.", "url": "https://www.wanikani.com/vocabulary/%E6%89%95%E3%81%86"}, {"char": "\u652f\u6255\u3046", "id": 9017, "image": null, "kanji": ["\u652f", "\u6255"], "meaning": "To Pay", "meaning_mnemonic": "The hiragana ends with an \u3046 sound, so you know this is a verb. To \u003ckanji\u003esupport\u003c/kanji\u003e \u003ckanji\u003epay\u003c/kanji\u003e is another way to say \u003cvocabulary\u003eto pay\u003c/vocabulary\u003e.\n\n\u652f\u6255\u3046 is a common word used when paying for something, such as a bill, fee, or purchase. It can be used in both casual and formal contexts, but it feels a bit more complete and proper than \u6255\u3046. For example, in casual conversation you\u0027d be more likely to say \u79c1\u304c\u6255\u3046\u3088 (I\u0027ll pay), but you could use \u652f\u6255\u3046 too \u2014 it would just sound slightly more polite.", "radicals": [], "reading_display": "\u3057\u306f\u3089\u3046", "reading_mnemonic": "This is just the on\u0027yomi reading of \u652f added on to \u6255\u3046. You learned that reading with the kanji, so you should be okay here.", "url": "https://www.wanikani.com/vocabulary/%E6%94%AF%E6%89%95%E3%81%86"}, {"char": "\u9aa8\u683c", "id": 3703, "image": null, "kanji": ["\u9aa8", "\u683c"], "meaning": "Bone Structure", "meaning_mnemonic": "Your \u003ckanji\u003ebone\u003c/kanji\u003e \u003ckanji\u003estatus\u003c/kanji\u003e is your \u003cvocabulary\u003ebone structure\u003c/vocabulary\u003e. It\u0027s the way all the bones in your \u003cvocabulary\u003eskeleton\u003c/vocabulary\u003e are arranged and put together!\n\n\u9aa8\u683c is a relatively formal word that refers to the skeletal structure or underlying frame of something. It can literally describe a person\u0027s physical build, or it can be used figuratively to talk about the basic \u003cvocabulary\u003eframework\u003c/vocabulary\u003e of a plan, argument, or piece of writing.", "radicals": [], "reading_display": "\u3053\u3063\u304b\u304f", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well. Just note that \u3053\u3064 changes to \u3053\u3063.", "url": "https://www.wanikani.com/vocabulary/%E9%AA%A8%E6%A0%BC"}, {"char": "\u53d6\u6750", "id": 3691, "image": null, "kanji": ["\u53d6", "\u6750"], "meaning": "Covering An Event", "meaning_mnemonic": "Your job is to \u003ckanji\u003etake\u003c/kanji\u003e \u003ckanji\u003ematerial\u003c/kanji\u003es from a bunch of different people because you\u0027re \u003cvocabulary\u003ecovering an event\u003c/vocabulary\u003e. This \u003cvocabulary\u003edata collection\u003c/vocabulary\u003e needs to be thorough, so you try to take all the materials you can from as many people as you can find.", "radicals": [], "reading_display": "\u3057\u3085\u3056\u3044", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You haven\u0027t learned the on\u0027yomi of \u53d6 yet, so here\u0027s a mnemonic to help you:\n\nYou\u0027re \u003cvocabulary\u003ecovering an event\u003c/vocabulary\u003e featuring all kinds of \u003creading\u003echu\u003c/reading\u003etes (\u3057\u3085). They have the whole range, from laundry chutes and garbage chutes, to evacuation chutes and so much more. You\u0027ll be doing some \u003cvocabulary\u003edata collection\u003c/vocabulary\u003e and interviews about all these chutes, and you can\u0027t wait!", "url": "https://www.wanikani.com/vocabulary/%E5%8F%96%E6%9D%90"}, {"char": "\u5e0c\u671b\u3059\u308b", "id": 3920, "image": null, "kanji": ["\u5e0c", "\u671b"], "meaning": "To Wish", "meaning_mnemonic": "You know that \u5e0c\u671b is a \"wish.\" When you \"do a wish,\" that means \u003cvocabulary\u003eto wish\u003c/vocabulary\u003e, \u003cvocabulary\u003eto request\u003c/vocabulary\u003e or \u003cvocabulary\u003eto hope\u003c/vocabulary\u003e.\n\nThis is a formal way to say that you wish for something, so you might use it at work to request an opportunity to work abroad, or let them know politely that you\u0027re resigning.", "radicals": [], "reading_display": "\u304d\u307c\u3046\u3059\u308b", "reading_mnemonic": "The reading comes from \u5e0c\u671b. It\u0027s also the on\u0027yomi jukugo reading as well, if that helps any.", "url": "https://www.wanikani.com/vocabulary/%E5%B8%8C%E6%9C%9B%E3%81%99%E3%82%8B"}, {"char": "\u652f\u6255\u3044", "id": 8728, "image": null, "kanji": ["\u652f", "\u6255"], "meaning": "Payment", "meaning_mnemonic": "The \u003ckanji\u003epay\u003c/kanji\u003e that \u003ckanji\u003esupport\u003c/kanji\u003es you is made in \u003cvocabulary\u003epayment\u003c/vocabulary\u003es. Whether you make payments to keep your house or your car, or you get payments from your boss, they keep you going.", "radicals": [], "reading_display": "\u3057\u306f\u3089\u3044", "reading_mnemonic": "This is a combination of the on\u0027yomi reading of \u652f and the kun\u0027yomi reading of \u6255. You\u0027ve learned them both, so you know this too!", "url": "https://www.wanikani.com/vocabulary/%E6%94%AF%E6%89%95%E3%81%84"}, {"char": "\u6b8b\u3059", "id": 3930, "image": null, "kanji": ["\u6b8b"], "meaning": "To Leave Behind", "meaning_mnemonic": "This word consists of kanji with hiragana attached. Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003eremainder\u003c/kanji\u003e, but you can\u0027t really \"to remainder.\" What is something that\u0027s similar that would make sense? How about \u003cvocabulary\u003eto leave behind\u003c/vocabulary\u003e. This is when you\u0027re actually doing the leaving behind too. For example, you eat some food and you leave behind your rice because you\u0027re a bad child. You can remember this because of \u3059. Every time you leave some food behind your mom would \u003creading\u003esue\u003c/reading\u003e you, because she was a terrible mom. Imagine this.", "radicals": [], "reading_display": "\u306e\u3053\u3059", "reading_mnemonic": "The reading for this word can come from level 14 item \u6b8b\u308b. Associate the two in your mind and you\u0027ll be able to read both.", "url": "https://www.wanikani.com/vocabulary/%E6%AE%8B%E3%81%99"}, {"char": "\u5869", "id": 3971, "image": null, "kanji": ["\u5869"], "meaning": "Salt", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "radicals": [], "reading_display": "\u3057\u304a", "reading_mnemonic": "The reading is the same as the one you learned with the kanji, no extra salt needed.", "url": "https://www.wanikani.com/vocabulary/%E5%A1%A9"}, {"char": "\u5869\u30b3\u30b7\u30e7\u30a6", "id": 9521, "image": null, "kanji": ["\u5869"], "meaning": "Salt And Pepper", "meaning_mnemonic": "You\u0027ve learned the word \u5869, meaning salt. Add \u30b3\u30b7\u30e7\u30a6, which means pepper, and you get \u003cvocabulary\u003esalt and pepper\u003c/vocabulary\u003e. You haven\u0027t learned the word for pepper yet, so here\u0027s a mnemonic to help you remember: If salt wanted to start a cooking podcast, who would be a better \u003creading\u003eco-show\u003c/reading\u003e (\u30b3\u30b7\u30e7\u30a6) host than pepper? Imagine the most classic pair of seasonings getting into a studio to co-show host a podcast. Now that\u0027s a spicy combo.\n\nJust a side note: The \u30b3\u30b7\u30e7\u30a6 part can also be written in different ways, such as in kanji, all hiragana, or as \u30b3\u30b7\u30e7\u30fc, especially on product packaging.", "radicals": [], "reading_display": "\u3057\u304a\u3053\u3057\u3087\u3046", "reading_mnemonic": "\u5869 uses the same reading you learned with the vocabulary, and if you remember your katakana too, you should be able to read this.", "url": "https://www.wanikani.com/vocabulary/%E5%A1%A9%E3%82%B3%E3%82%B7%E3%83%A7%E3%82%A6"}, {"char": "\u301c\u679a", "id": 7454, "image": null, "kanji": ["\u679a"], "meaning": "Flat Object Counter", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well, so this is \u003cvocabulary\u003eflat object counter\u003c/vocabulary\u003e.\n\nThis counter can be used with various \"flat\" things, such as \u003cvocabulary\u003eclothing items\u003c/vocabulary\u003e, \u003cvocabulary\u003esheets\u003c/vocabulary\u003e, paper, stamps, dishes, and more. Notice how they\u0027re all kind of flat shaped?", "radicals": [], "reading_display": "\u307e\u3044", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own.", "url": "https://www.wanikani.com/vocabulary/%E3%80%9C%E6%9E%9A"}, {"char": "\u301c\u9054", "id": 7549, "image": null, "kanji": ["\u9054"], "meaning": "Pluralizing Suffix", "meaning_mnemonic": "You\u0027ll see this attached to other words to make them \u003ckanji\u003eplural\u003c/kanji\u003e. That\u0027s why it\u0027s called a \u003cvocabulary\u003epluralizing suffix\u003c/vocabulary\u003e (or a \u003cvocabulary\u003eplural suffix\u003c/vocabulary\u003e for short).\n\n\u301c\u9054 is stuck onto the end of nouns (usually people or animals) to make them plural. It can also be used with a person\u0027s name, like \u30de\u30ea\u30a2\u9054. In that case, it refers to Maria and the group of people she\u0027s with (rather than a bunch of Maria clones or something).\n\nNote that you\u0027ll often just see this word written in hiragana as \u301c\u305f\u3061.", "radicals": [], "reading_display": "\u305f\u3061", "reading_mnemonic": "This is almost the same reading you learned with the kanji. Remember \u305f\u3064? Well this is read \u305f\u3061. Here\u0027s a mnemonic to help you remember it:\n\nIf you want to pluralize something, \u003creading\u003etouch\u003c/reading\u003e (\u305f\u3061) it to something else. One friend touches another friend, well now they\u0027re friends. Plural friends! All thanks to the good ol\u0027 pluralizing suffix touch!\n\nOh, and don\u0027t type the \u301c out when writing the answer. It\u0027s just there to let you know that there\u0027s usually something attached in front of this word.", "url": "https://www.wanikani.com/vocabulary/%E3%80%9C%E9%81%94"}, {"char": "\u4e88\u544a", "id": 4084, "image": null, "kanji": ["\u4e88", "\u544a"], "meaning": "Advance Notice", "meaning_mnemonic": "If you \u003ckanji\u003eannounce\u003c/kanji\u003e something \u003ckanji\u003ebeforehand\u003c/kanji\u003e you will have \u003cvocabulary\u003eadvance notice\u003c/vocabulary\u003e. Advance notice is always nice to give.\n\nYou\u0027ll also see this used as an abbreviation of \u4e88\u544a\u7de8, meaning \u003cvocabulary\u003etrailer\u003c/vocabulary\u003e or \u003cvocabulary\u003epreview\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3088\u3053\u304f", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E4%BA%88%E5%91%8A"}, {"char": "\u4f1d\u9054", "id": 4154, "image": null, "kanji": ["\u4f1d", "\u9054"], "meaning": "Transmission", "meaning_mnemonic": "When you \u003ckanji\u003etransmit\u003c/kanji\u003e something and you \u003ckanji\u003eattain\u003c/kanji\u003e it on the other end, you\u0027ve done a \u003cvocabulary\u003etransmission\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3067\u3093\u305f\u3064", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E4%BC%9D%E9%81%94"}, {"char": "\u544a\u3052\u308b", "id": 4082, "image": null, "kanji": ["\u544a"], "meanin eprice\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3042\u305f\u3044", "reading_mnemonic": "Imagine a numerical \u003cvocabulary\u003evalue\u003c/vocabulary\u003e written on \u003creading\u003ea tie\u003c/reading\u003e (\u3042\u305f\u3044). Now imagine that it\u0027s the \u003cvocabulary\u003eprice\u003c/vocabulary\u003e of a \u003creading\u003ene\u003c/reading\u003eigh (\u306d) from your favorite horse. It\u0027s a pretty high price, but you\u0027ll do anything to hear that horse neigh.\n\nGenerally, \u3042\u305f\u3044 refers to a numerical value in math, while \u306d is a formal word for \"price.\"", "url": "https://www.wanikani.com/vocabulary/%E5%80%A4"}, {"char": "\u5728\u7559\u3059\u308b", "id": 7502, "image": null, "kanji": ["\u5728", "\u7559"], "meaning": "To Reside", "meaning_mnemonic": "If \u5728\u7559 is \u003ckanji\u003eresidence\u003c/kanji\u003e, then the verb version of that would be \u003cvocabulary\u003eto reside\u003c/vocabulary\u003e.\n\nLike \u5728\u7559, this is also a more formal term. You might encounter it at the immigration office, but you probably won\u0027t hear it in everyday conversation.", "radicals": [], "reading_display": "\u3056\u3044\u308a\u3085\u3046\u3059\u308b", "reading_mnemonic": "The reading comes from \u5728\u7559 so you should be able to read this one already!", "url": "https://www.wanikani.com/vocabulary/%E5%9C%A8%E7%95%99%E3%81%99%E3%82%8B"}, {"char": "\u5b58\u5728\u3059\u308b", "id": 4482, "image": null, "kanji": ["\u5b58", "\u5728"], "meaning": "To Exist", "meaning_mnemonic": "Know how \u5b58\u5728 is existence? Well, make it a verb and then you have \u003cvocabulary\u003eto exist\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u305d\u3093\u3056\u3044\u3059\u308b", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E5%AD%98%E5%9C%A8%E3%81%99%E3%82%8B"}, {"char": "\u301c\u5b85", "id": 4636, "image": null, "kanji": ["\u5b85"], "meaning": "House", "meaning_mnemonic": "Just like its kanji, this word means \u003cvocabulary\u003ehouse\u003c/vocabulary\u003e or \u003cvocabulary\u003ehome\u003c/vocabulary\u003e. By extension, it also sometimes means \u003cvocabulary\u003ehousehold\u003c/vocabulary\u003e. It can go after someone\u2019s name to say whose house it is, as in \u5c71\u7530\u5b85 (Yamada\u2019s house), and after words that give more information about the house, such as \u5973\u6027\u5b85 (women\u2019s homes).", "radicals": [], "reading_display": "\u305f\u304f", "reading_mnemonic": "The reading is the same as the one you learned with the kanji. Go home now.", "url": "https://www.wanikani.com/vocabulary/%E3%80%9C%E5%AE%85"}, {"char": "\u5272\u308b", "id": 4613, "image": null, "kanji": ["\u5272"], "meaning": "To Divide", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003edivide\u003c/kanji\u003e so the verb vocab version is \u003cvocabulary\u003eto divide\u003c/vocabulary\u003e or \u003cvocabulary\u003eto split something\u003c/vocabulary\u003e.\n\nIt can also mean \u003cvocabulary\u003eto break something\u003c/vocabulary\u003e, as in \u30ef\u30a4\u30f3\u30b0\u30e9\u30b9\u3092\u5272\u308b (to break a wine glass). After all, you\u2019re technically dividing the object into parts if you break it, right?", "radicals": [], "reading_display": "\u308f\u308b", "reading_mnemonic": "The reading you learned with the kanji is the one you\u0027ll use here. It\u0027s the \u308f one, though, making it \u308f\u308b.", "url": "https://www.wanikani.com/vocabulary/%E5%89%B2%E3%82%8B"}, {"char": "\u5f79\u5272", "id": 4614, "image": null, "kanji": ["\u5f79", "\u5272"], "meaning": "Role", "meaning_mnemonic": "Let\u0027s \u003ckanji\u003edivide\u003c/kanji\u003e the \u003ckanji\u003eduty\u003c/kanji\u003e up amongst various people. Each person will have their own \u003cvocabulary\u003erole\u003c/vocabulary\u003e in completing this duty.", "radicals": [], "reading_display": "\u3084\u304f\u308f\u308a", "reading_mnemonic": "The readings are the ones you learned with the kanji. See how we divide up the duty of learning kanji into radicals and kanji and vocab? Makes it nice, right? Each piece is its own \u5f79\u5272.", "url": "https://www.wanikani.com/vocabulary/%E5%BD%B9%E5%89%B2"}, {"char": "\u73fe\u5728", "id": 4270, "image": null, "kanji": ["\u73fe", "\u5728"], "meaning": "Present", "meaning_mnemonic": "In the \u003ckanji\u003epresent time\u003c/kanji\u003e we \u003ckanji\u003eexist\u003c/kanji\u003e. What time is it? It\u0027s \u003cvocabulary\u003epresent\u003c/vocabulary\u003e and \u003cvocabulary\u003enow\u003c/vocabulary\u003e. It is the \u003cvocabulary\u003ecurrent\u003c/vocabulary\u003e time!", "radicals": [], "reading_display": "\u3052\u3093\u3056\u3044", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E7%8F%BE%E5%9C%A8"}, {"char": "\u4fa1\u5024\u89b3", "id": 4664, "image": null, "kanji": ["\u4fa1", "\u5024", "\u89b3"], "meaning": "Values", "meaning_mnemonic": "These \u003ckanji\u003eview\u003c/kanji\u003es that have \u003ckanji\u003emerit\u003c/kanji\u003e (\u4fa1\u5024) are your \u003cvocabulary\u003evalues\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u304b\u3061\u304b\u3093", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own.", "url": "https://www.wanikani.com/vocabulary/%E4%BE%A1%E5%80%A4%E8%A6%B3"}, {"char": "\u5168\u984d", "id": 7599, "image": null, "kanji": ["\u5168", "\u984d"], "meaning": "Total", "meaning_mnemonic": "\u003ckanji\u003eAll\u003c/kanji\u003e of the \u003ckanji\u003eamount\u003c/kanji\u003e is your \u003cvocabulary\u003etotal\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u305c\u3093\u304c\u304f", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own.", "url": "https://www.wanikani.com/vocabulary/%E5%85%A8%E9%A1%8D"}, {"char": "\u578b", "id": 4703, "image": null, "kanji": ["\u578b"], "meaning": "Model", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "radicals": [], "reading_display": "\u304b\u305f", "reading_mnemonic": "Since this word is made up of a single kanji, it probably uses the kun\u0027yomi reading. You did not learn this reading, so here\u0027s a mnemonic to help you to remember: \n\nWhat \u003cvocabulary\u003emodel\u003c/vocabulary\u003e \u003creading\u003ecata\u003c/reading\u003epult (\u304b\u305f) is this? Is it the trebuchet or the mangonel \u003cvocabulary\u003etype\u003c/vocabulary\u003e? Only one model can aim at your ex\u0027s window with the right trajectory. Catapult model matters!", "url": "https://www.wanikani.com/vocabulary/%E5%9E%8B"}, {"char": "\u5b9a\u984d", "id": 4675, "image": null, "kanji": ["\u5b9a", "\u984d"], "meaning": "Fixed Amount", "meaning_mnemonic": "A \u003ckanji\u003edetermine\u003c/kanji\u003ed \u003ckanji\u003eamount\u003c/kanji\u003e is an amount that is fixed, aka a \u003cvocabulary\u003efixed amount\u003c/vocabulary\u003e, \u003cvocabulary\u003efixed sum\u003c/vocabulary\u003e, or \u003cvocabulary\u003eflat rate\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3066\u3044\u304c\u304f", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E5%AE%9A%E9%A1%8D"}, {"char": "\u5c4a\u304f", "id": 4689, "image": null, "kanji": ["\u5c4a"], "meaning": "To Be Delivered", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003edeliver\u003c/kanji\u003e so the verb vocab version here is \u003cvocabulary\u003eto be delivered\u003c/vocabulary\u003e or \u003cvocabulary\u003eto arrive\u003c/vocabulary\u003e. You know this one is \"to be delivered\" (aka it\u0027s just getting delivered, you aren\u0027t doing the delivery) because when this item arrives at your house you say \"\u003creading\u003ecoo\u0027\u003c/reading\u003e\" (\u304f), it arrived.", "radicals": [], "reading_display": "\u3068\u3069\u304f", "reading_mnemonic": "The reading is the one you learned with the kanji: \u3068\u3069!", "url": "https://www.wanikani.com/vocabulary/%E5%B1%8A%E3%81%8F"}, {"char": "\u6b8b\u984d", "id": 4676, "image": null, "kanji": ["\u6b8b", "\u984d"], "meaning": "Remaining Amount", "meaning_mnemonic": "The\u00a0\u003ckanji\u003eremainder\u003c/kanji\u003e\u00a0\u003ckanji\u003eamount\u003c/kanji\u003e\u00a0is the\u00a0\u003cvocabulary\u003eremaining amount\u003c/vocabulary\u003e, aka the\u00a0\u003cvocabulary\u003ebalance\u003c/vocabulary\u003e.\n\nFor example, you will see this word used when displaying the balance of a prepaid card or e-money, like an IC card.", "radicals": [], "reading_display": "\u3056\u3093\u304c\u304f", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E6%AE%8B%E9%A1%8D"}, {"char": "\u984d", "id": 7653, "image": null, "kanji": ["\u984d"], "meaning": "Picture Frame", "meaning_mnemonic": "You previously learned this kanji with three different meanings. For the vocab word, we\u0027re just going to focus on one of those: \u003cvocabulary\u003epicture frame\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u304c\u304f", "reading_mnemonic": "This has the same reading as the kanji you learned, meaning you know the reading!", "url": "https://www.wanikani.com/vocabulary/%E9%A1%8D"}, {"char": "\u5272\u308c\u308b", "id": 4764, "image": null, "kanji": ["\u5272"], "meaning": "To Be Divided", "meaning_mnemonic": "Remember how \u5272\u308b is \"to divide\"? Now you\u0027re learning the intransitive version. Instead of you doing the dividing, something just gets divided or split up. So this is \u003cvocabulary\u003eto be divided\u003c/vocabulary\u003e or \u003cvocabulary\u003eto be split\u003c/vocabulary\u003e.\n\nIt can also mean \u003cvocabulary\u003eto break\u003c/vocabulary\u003e, as in \u30ef\u30a4\u30f3\u30b0\u30e9\u30b9\u304c\u5272\u308c\u308b (the wine glass breaks). After all, when an object breaks, it\u2019s divided into parts, right?", "radicals": [], "reading_display": "\u308f\u308c\u308b", "reading_mnemonic": "The reading is shared with \u5272\u308b.", "url": "https://www.wanikani.com/vocabulary/%E5%89%B2%E3%82%8C%E3%82%8B"}, {"char": "\u8863", "id": 6529, "image": null, "kanji": ["\u8863"], "meaning": "Clothes", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.\n\nIn modern Japanese, \u8863 is more often used to describe the \u003cvocabulary\u003eclothes\u003c/vocabulary\u003e your \u003cem\u003efood\u003c/em\u003e is wearing, e.g., the \u003cvocabulary\u003ecoating\u003c/vocabulary\u003e on tempura or the \u003cvocabulary\u003ebreading\u003c/vocabulary\u003e on deep-fried foods.", "radicals": [], "reading_display": "\u3053\u308d\u3082", "reading_mnemonic": "What are clothes, really? Some people say \u003cvocabulary\u003eclothes\u003c/vocabulary\u003e are the \u003creading\u003echromo\u003c/reading\u003esomes (\u3053\u308d\u3082) of your personal style \u2014 each garment carries information about your unique identity. Other people say clothes are simply the \u003creading\u003ekey\u003c/reading\u003e to not being \u003creading\u003enu\u003c/reading\u003ede (\u304d\u306c). What do you think?\n\nBoth \u3053\u308d\u3082 and \u304d\u306c mean \"clothes,\" but these usages are old-fashioned. Also note that the more modern meaning of \"coating\" or \"breading\" uses only the \u3053\u308d\u3082 reading!", "url": "https://www.wanikani.com/vocabulary/%E8%A1%A3"}, {"char": "\u5c4a\u3051\u308b", "id": 4907, "image": null, "kanji": ["\u5c4a"], "meaning": "To Deliver", "meaning_mnemonic": "\u5c4a\u304f is \"to be delivered.\" This word is when you\u0027re doing the actual delivering, making it \u003cvocabulary\u003eto deliver\u003c/vocabulary\u003e. You can remember this because you \u003creading\u003ecare\u003c/reading\u003e (\u3051\u308b) about the package so much that you deliver it yourself, thus doing the action of delivering it!", "radicals": [], "reading_display": "\u3068\u3069\u3051\u308b", "reading_mnemonic": "The reading is the same as \u5c4a\u304f and you can use that to deliver the memory to your brain.", "url": "https://www.wanikani.com/vocabulary/%E5%B1%8A%E3%81%91%E3%82%8B"}, {"char": "\u5024\u6bb5", "id": 5005, "image": null, "kanji": ["\u5024", "\u6bb5"], "meaning": "Price", "meaning_mnemonic": "The \u003ckanji\u003evalue\u003c/kanji\u003e is in various \u003ckanji\u003esteps\u003c/kanji\u003e. Each step is a different amount, and each amount is a \u003cvocabulary\u003eprice\u003c/vocabulary\u003e or \u003cvocabulary\u003ecost\u003c/vocabulary\u003e.\n\n\u5024\u6bb5 refers to the price attached to something you can buy, like in stores or markets. For example, you could use \u5024\u6bb5 to ask how much something costs at a shop or when talking about the price of a particular meal.", "radicals": [], "reading_display": "\u306d\u3060\u3093", "reading_mnemonic": "The reading is the kun\u0027yomi reading for \u5024 plus the on\u0027yomi reading for \u6bb5. Combine them together to get the reading here. You\u0027ve learned both of these readings already, so just remember \u5024 is \u306d because you \u003creading\u003eneigh\u003c/reading\u003e (\u306d) when you see a good \u003cvocabulary\u003eprice\u003c/vocabulary\u003e.", "url": "https://www.wanikani.com/vocabulary/%E5%80%A4%E6%AE%B5"}, {"char": "\u53d6\u308a\u66ff\u3048\u308b", "id": 5036, "image": null, "kanji": ["\u53d6", "\u66ff"], "meaning": "To Replace", "meaning_mnemonic": "\u003ckanji\u003eTake\u003c/kanji\u003e and \u003ckanji\u003ereplace\u003c/kanji\u003e something. That is \u003cvocabulary\u003eto replace\u003c/vocabulary\u003e something with something else.\n\n\u53d6\u308a\u66ff\u3048\u308b generally means \u003cvocabulary\u003eto swap out\u003c/vocabulary\u003e something with a new or different item of the same kind, like replacing an old gas meter with a new one, or exchanging books with your friend after you\u0027ve both read your own.", "radicals": [], "reading_display": "\u3068\u308a\u304b\u3048\u308b", "reading_mnemonic": "The readings are \u53d6\u308b and \u66ff\u3048\u308b put together into one. If you know those words you\u0027ll be able to read and understand this one as well.", "url": "https://www.wanikani.com/vocabulary/%E5%8F%96%E3%82%8A%E6%9B%BF%E3%81%88%E3%82%8B"}, {"char": "\u8a18\u9332", "id": 5208, "image": null, "kanji": ["\u8a18", "\u9332"], "meaning": "Record", "meaning_mnemonic": "\u003ckanji\u003eWrite down\u003c/kanji\u003e a \u003ckanji\u003erecord\u003c/kanji\u003e of the events so we have a \u003cvocabulary\u003erecord\u003c/vocabulary\u003e, please. Don\u0027t want people to forget about this momentous occasion, when King Felix got his perfect game.\n\n\u8a18\u9332 refers to the act of putting something on record or to the record itself. Just like English \"record,\" it can also refer to the best performance or most remarkable event of its kind that\u0027s been officially measured and noted, like the record for fastest baseball pitch.", "radicals": [], "reading_display": "\u304d\u308d\u304f", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E8%A8%98%E9%8C%B2"}, {"char": "\u9810\u3051\u308b", "id": 5381, "image": null, "kanji": ["\u9810"], "meaning": "To Deposit", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003edeposit\u003c/kanji\u003e so the verb vocab version is \u003cvocabulary\u003eto deposit\u003c/vocabulary\u003e or \u003cvocabulary\u003eto entrust\u003c/vocabulary\u003e. \n\nYou use \u9810\u3051\u308b when you leave something in someone else\u0027s care for a while, expecting to get it back. For example, you can use \u9810\u3051\u308b when you deposit money in a bank, leave your coat in a cloakroom, or even when you park your bicycle in a parking area. You can also use it when you leave your child with grandparents or leave your dog at a pet hotel.", "radicals": [], "reading_display": "\u3042\u305a\u3051\u308b", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You didn\u0027t learn that reading with this kanji, so here\u0027s a mnemonic to help you: \n\nIn terms of places where you want \u003cvocabulary\u003eto deposit\u003c/vocabulary\u003e your money, the last place on your list should be \u003creading\u003ea zoo\u003c/reading\u003e (\u3042\u305a). I mean seriously, you know the animals are just gonna munch up all your dolla bills. ", "url": "https://www.wanikani.com/vocabulary/%E9%A0%90%E3%81%91%E3%82%8B"}, {"char": "\u5e2f", "id": 5460, "image": null, "kanji": ["\u5e2f"], "meaning": "Obi", "meaning_mnemonic": "The kanji and the word are the same, except that this isn\u0027t just any type of \u003ckanji\u003ebelt\u003c/kanji\u003e. It\u0027s an \u003cvocabulary\u003eobi\u003c/vocabulary\u003e, a wide cloth \u003cvocabulary\u003ebelt\u003c/vocabulary\u003e worn with traditional clothes like kimono and yukata.", "radicals": [], "reading_display": "\u304a\u3073", "reading_mnemonic": "The reading is obi (\u304a\u3073), so if you know the meaning, you know the reading as well! If you need an extra reminder, ask yourself \"What is the first letter in belt?\" Hmm, I can\u0027t remember. \u003creading\u003eOH! \"B\"\u003c/reading\u003e (\u304a\u3073)! I remember now.", "url": "https://www.wanikani.com/vocabulary/%E5%B8%AF"}, {"char": "\u8fbc\u3080", "id": 5576, "image": null, "kanji": ["\u8fbc"], "meaning": "To Get Into", "meaning_mnemonic": "This word ends with the hiragana \u3046, which tells you it\u0027s a verb. The kanji \u8fbc means \u003ckanji\u003einto\u003c/kanji\u003e, so the verb version is \u003cvocabulary\u003eto get into\u003c/vocabulary\u003e.\n\nThis word generally attaches to the stem of another verb, and adds a nuance of moving something towards the center of something, or going deep into something. You\u2019ll be seeing lots of examples of words with \u8fbc\u3080 on the end, so you\u2019ll gradually get a feel for the nuance it adds!", "radicals": [], "reading_display": "\u3053\u3080", "reading_mnemonic": "Lucky for you, the reading you learned with the kanji is the one you use here.", "url": "https://www.wanikani.com/vocabulary/%E8%BE%BC%E3%82%80-5576"}, {"char": "\u9810\u304b\u308b", "id": 8956, "image": null, "kanji": ["\u9810"], "meaning": "To Look After", "meaning_mnemonic": "Because the hiragana ends with an \u3046 sound, you know this word is a verb. The kanji itself means \u003ckanji\u003edeposit\u003c/kanji\u003e, and this word is for when someone is depositing something (or someone) with you, because they want you \u003cvocabulary\u003eto look after\u003c/vocabulary\u003e, \u003cvocabulary\u003eto take care of\u003c/vocabulary\u003e, or \u003cvocabulary\u003eto hold on to\u003c/vocabulary\u003e it.\n\nRemember that \u9810\u3051\u308b is used when you leave something with someone else to take care of temporarily. \u9810\u304b\u308b, on the other hand, is used when you\u0027re the one receiving something to look after. You can remember this because you\u0027re great at taking care of cargo (\u304b\u308b). You\u0027re always looking after everyone\u0027s cargo, but you\u0027re happy to hold on to it for them.\n\nAlso note that even though \u9810\u304b\u308b ends with \u304b\u308b and kind of looks intransitive, it\u0027s actually an exception! It\u0027ll pretty much always have a direct object to specify what you\u0027re looking after.", "radicals": [], "reading_display": "\u3042\u305a\u304b\u308b", "reading_mnemonic": "Since this word consists of a kanji with hiragana attached, you can bet that it will use the kun\u0027yomi reading. You learned this before with the pair verb \u9810\u3051\u308b, but here\u0027s a mnemonic to remind you just in case:\n\nYou need someone \u003cvocabulary\u003eto look after\u003c/vocabulary\u003e your kids for the day. Hey, I have an idea! Leave them with the monkeys at \u003creading\u003ea zoo\u003c/reading\u003e (\u3042\u305a)! Monkeys love kids, and kids love monkeys. Now you can zoom off in your \u003creading\u003ecar\u003c/reading\u003es (\u304b) for the day!", "url": "https://www.wanikani.com/vocabulary/%E9%A0%90%E3%81%8B%E3%82%8B"}, {"char": "\u52e4\u3081\u308b", "id": 5813, "image": null, "kanji": ["\u52e4"], "meaning": "To Be Employed At", "meaning_mnemonic": "The kanji is \u003ckanji\u003ework\u003c/kanji\u003e which means this verb has something to do with working. It\u0027s not straight up \"to work,\" instead it\u0027s \"\u003cvocabulary\u003eto work for\u003c/vocabulary\u003e\" or \"\u003cvocabulary\u003eto be employed at\u003c/vocabulary\u003e.\"", "radicals": [], "reading_display": "\u3064\u3068\u3081\u308b", "reading_mnemonic": "The reading is the same as the other word that means \"to work as\" (\u52d9\u3081\u308b). Remember this and you\u0027ll be able to remember the reading for this word too.", "url": "https://www.wanikani.com/vocabulary/%E5%8B%A4%E3%82%81%E3%82%8B"}, {"char": "\u5e38\u52e4", "id": 5815, "image": null, "kanji": ["\u5e38", "\u52e4"], "meaning": "Full Time Employment", "meaning_mnemonic": "\u003ckanji\u003eNormal\u003c/kanji\u003e \u003ckanji\u003ework\u003c/kanji\u003e is work you do all day long, 8-hours a day, 5 days a week. That is \u003cvocabulary\u003efull time employment\u003c/vocabulary\u003e or \u003cvocabulary\u003efull time\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3058\u3087\u3046\u304d\u3093", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own.", "url": "https://www.wanikani.com/vocabulary/%E5%B8%B8%E5%8B%A4"}, {"char": "\u7533\u3057\u8fbc\u3080", "id": 5730, "image": null, "kanji": ["\u7533", "\u8fbc"], "meaning": "To Apply", "meaning_mnemonic": "I must \u003ckanji\u003esay humbly\u003c/kanji\u003e that I want to get \u003ckanji\u003einto\u003c/kanji\u003e this position, so I\u0027m planning \u003cvocabulary\u003eto apply\u003c/vocabulary\u003e for it and \u003cvocabulary\u003eto submit an application\u003c/vocabulary\u003e.\n\n\u7533\u3057\u8fbc\u3080 isn\u0027t just about applying, though. It\u0027s about officially communicating desires, whether you want \u003cvocabulary\u003eto propose\u003c/vocabulary\u003e marriage, challenge someone to a game of tennis, or even offer a donation to a good cause.", "radicals": [], "reading_display": "\u3082\u3046\u3057\u3053\u3080", "reading_mnemonic": "The readings come from the word \u7533\u3059 and the kanji \u8fbc, stuck together... humbly.", "url": "https://www.wanikani.com/vocabulary/%E7%94%B3%E3%81%97%E8%BE%BC%E3%82%80"}, {"char": "\u8fbc\u3081\u308b", "id": 5729, "image": null, "kanji": ["\u8fbc"], "meaning": "To Put In", "meaning_mnemonic": "You know the kanji \u8fbc means \u003ckanji\u003einto\u003c/kanji\u003e. This verb is transitive, meaning you are doing the action. If you \u201cdo something into something\u201d you are putting it into that thing. So this means \u003cvocabulary\u003eto put in\u003c/vocabulary\u003e or \u003cvocabulary\u003eto load something\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3053\u3081\u308b", "reading_mnemonic": "Lucky for you, the reading you learned with the kanji is the one you use here. In case you need a hand with the okurigana, here\u2019s a mnemonic for you:\n\nYou always try \u003cvocabulary\u003eto put in\u003c/vocabulary\u003e your emotions into the \u003creading\u003email\u003c/reading\u003e (\u3081\u308b) you send. You don\u0027t just load your mail with words, but also with emotions, to make it truly heartfelt mail.", "url": "https://www.wanikani.com/vocabulary/%E8%BE%BC%E3%82%81%E3%82%8B"}, {"char": "\u964d\u53c2", "id": 5752, "image": null, "kanji": ["\u964d", "\u53c2"], "meaning": "Surrender", "meaning_mnemonic": "I am going to \u003ckanji\u003edescend\u003c/kanji\u003e my \u003ckanji\u003eparticipat\u003c/kanji\u003eion in this conflict. I am going to descend all my weapons to the ground. I am going to \u003cvocabulary\u003esurrender\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3053\u3046\u3055\u3093", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own.", "url": "https://www.wanikani.com/vocabulary/%E9%99%8D%E5%8F%82"}, {"char": "\u98db\u3073\u8fbc\u307f", "id": 9332, "image": null, "kanji": ["\u98db", "\u8fbc"], "meaning": "Diving In", "meaning_mnemonic": "You\u2019re doing a \u98db\u3076 and \u8fbc\u3080 at the same time, or you \u003ckanji\u003ejump\u003c/kanji\u003e \u003ckanji\u003einto\u003c/kanji\u003e, meaning you\u0027re \u003cvocabulary\u003ediving in\u003c/vocabulary\u003e. Picture yourself standing somewhere up high, and then jumping to dive into a deep body of water.\n\nAlternatively, this can also refer to doing something, or joining or going somewhere without an appointment, announcement, or prior registration, which is where the \u003cvocabulary\u003edropping by\u003c/vocabulary\u003e meaning comes in. For some use cases of this, check out our common word combinations and context sentences below!", "radicals": [], "reading_display": "\u3068\u3073\u3053\u307f", "reading_mnemonic": "As long as you remember that we\u0027re combining the kun\u0027yomi readings of the verbs and then turning them into a noun, you should know how to read this. ", "url": "https://www.wanikani.com/vocabulary/%E9%A3%9B%E3%81%B3%E8%BE%BC%E3%81%BF"}, {"char": "\u6cb9", "id": 5928, "image": null, "kanji": ["\u6cb9"], "meaning": "Oil", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "radicals": [], "reading_display": "\u3042\u3076\u3089", "reading_mnemonic": "You need to apply \u003cvocabulary\u003eoil\u003c/vocabulary\u003e to \u003creading\u003ea bra\u003c/reading\u003e (\u3042\u3076\u3089) because it\u0027s stuck on you. You can\u0027t get it unhooked, so you have to slide it off. Problem is, it\u0027s too tight, which is why \u003creading\u003ea bra\u003c/reading\u003e needs oil to slide off.", "url": "https://www.wanikani.com/vocabulary/%E6%B2%B9"}, {"char": "\u6cb9\u65ad", "id": 5929, "image": null, "kanji": ["\u6cb9", "\u65ad"], "meaning": "Inattentiveness", "meaning_mnemonic": "If you let someone \u003ckanji\u003ecut off\u003c/kanji\u003e your \u003ckanji\u003eoil\u003c/kanji\u003e supply, it\u0027s probably because of your \u003cvocabulary\u003einattentiveness\u003c/vocabulary\u003e. You \u003cvocabulary\u003elet your guard down\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3086\u3060\u3093", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own.", "url": "https://www.wanikani.com/vocabulary/%E6%B2%B9%E6%96%AD"}, {"char": "\u52e4\u3081", "id": 5944, "image": null, "kanji": ["\u52e4"], "meaning": "Work", "meaning_mnemonic": "If \u52e4\u3081\u308b is \"to be employed at,\" then the noun version of this is \u003cvocabulary\u003ework\u003c/vocabulary\u003e. I mean, I really hope you\u0027re doing work at the place that employed you... if not you\u0027ll probably be fired.", "radicals": [], "reading_display": "\u3064\u3068\u3081", "reading_mnemonic": "The reading comes from \u52e4\u3081\u308b.", "url": "https://www.wanikani.com/vocabulary/%E5%8B%A4%E3%82%81"}, {"char": "\u63db\u3048\u308b", "id": 6238, "image": null, "kanji": ["\u63db"], "meaning": "To Exchange", "meaning_mnemonic": "The kanji is \u003ckanji\u003eexchange\u003c/kanji\u003e, so this verb is \u003cvocabulary\u003eto exchange\u003c/vocabulary\u003e. If you exchange one thing for another thing, you are going \u003cvocabulary\u003eto exchange\u003c/vocabulary\u003e it, after all. This word refers to exchanging one thing for something different.\n\nWondering about the difference between \u66ff\u3048\u308b and \u63db\u3048\u308b? \u66ff\u3048\u308b means swapping one thing for another of the same kind, whereas \u63db\u3048\u308b means exchanging or trading one thing for something different, often of similar value. So, you use \u66ff\u3048\u308b when switching out light bulbs, but opt for \u63db\u3048\u308b when trading jewelry for cash.", "radicals": [], "reading_display": "\u304b\u3048\u308b", "reading_mnemonic": "I don\u0027t like this car. I would like \u003cvocabulary\u003eto exchange\u003c/vocabulary\u003e it for another \u003creading\u003eca\u003c/reading\u003er (\u304b).", "url": "https://www.wanikani.com/vocabulary/%E6%8F%9B%E3%81%88%E3%82%8B"}, {"char": "\u7802", "id": 5666, "image": null, "kanji": ["\u7802"], "meaning": "Sand", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.", "radicals": [], "reading_display": "\u3059\u306a", "reading_mnemonic": "Since this word is made up of a single kanji, it probably uses the kun\u0027yomi reading. You did not learn this reading, so here\u0027s a mnemonic to help you to remember: If you walk around on the beach, you\u0027ll get \u003cvocabulary\u003esand\u003c/vocabulary\u003e in your shoes \u003creading\u003esooner\u003c/reading\u003e (\u3059\u306a) or later.", "url": "https://www.wanikani.com/vocabulary/%E7%A0%82"}, {"char": "\u964d\u53c2\u3059\u308b", "id": 6028, "image": null, "kanji": ["\u964d", "\u53c2"], "meaning": "To Surrender", "meaning_mnemonic": "\u964d\u53c2 is \"surrender\" so the verb version would be \u003cvocabulary\u003eto surrender\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3053\u3046\u3055\u3093\u3059\u308b", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own. The reading is the same as \u964d\u53c2 as well, of course.", "url": "https://www.wanikani.com/vocabulary/%E9%99%8D%E5%8F%82%E3%81%99%E3%82%8B"}, {"char": "\u6255\u3044", "id": 6035, "image": null, "kanji": ["\u6255"], "meaning": "Payment", "meaning_mnemonic": "If \u6255\u3046 is \"to pay\" or \"to brush off,\" then the noun version is \u003cvocabulary\u003epayment\u003c/vocabulary\u003e or \u003cvocabulary\u003ebrushing off\u003c/vocabulary\u003e.\n\nUsually \u6255\u3044 is tacked on the end of another word, like in \u30ab\u30fc\u30c9\u6255\u3044 (payment by credit card).\n\nWhen it indicates a kind of brushing off or brushing away, it appears in words like \u8db3\u6255\u3044 (sweeping an opponent\u0027s legs in judo) or, more figuratively, \u305b\u304d\u6255\u3044 (clearing one\u0027s throat).", "radicals": [], "reading_display": "\u306f\u3089\u3044", "reading_mnemonic": "The reading comes from \u6255\u3046, so know that and it will pay forward your knowledge to this one.\n\nNote that when \u6255\u3044 is added to the end of a compound, it becomes \u3070\u3089\u3044. ", "url": "https://www.wanikani.com/vocabulary/%E6%89%95%E3%81%84"}, {"char": "\u53d6\u308a\u623b\u3059", "id": 6255, "image": null, "kanji": ["\u53d6", "\u623b"], "meaning": "To Take Back", "meaning_mnemonic": "To \u003ckanji\u003etake\u003c/kanji\u003e and \u003ckanji\u003ereturn\u003c/kanji\u003e something to yourself is \u003cvocabulary\u003eto take back\u003c/vocabulary\u003e something. Give it back!", "radicals": [], "reading_display": "\u3068\u308a\u3082\u3069\u3059", "reading_mnemonic": "The readings come from \u53d6\u308b and \u623b\u3059. Combine them to get this.", "url": "https://www.wanikani.com/vocabulary/%E5%8F%96%E3%82%8A%E6%88%BB%E3%81%99"}, {"char": "\u6255\u3044\u623b\u3059", "id": 6246, "image": null, "kanji": ["\u6255", "\u623b"], "meaning": "To Repay", "meaning_mnemonic": "\u6255\u3044 is a \"payment\" and \u623b\u3059 is \"to return.\" If you return a payment, you are going \u003cvocabulary\u003eto repay\u003c/vocabulary\u003e, \u003cvocabulary\u003eto refund\u003c/vocabulary\u003e, or \u003cvocabulary\u003eto reimburse\u003c/vocabulary\u003e someone for their payment.", "radicals": [], "reading_display": "\u306f\u3089\u3044\u3082\u3069\u3059", "reading_mnemonic": "The readings come from \u6255\u3044 and \u623b\u3059.", "url": "https://www.wanikani.com/vocabulary/%E6%89%95%E3%81%84%E6%88%BB%E3%81%99"}, {"char": "\u7d05", "id": 5780, "image": null, "kanji": ["\u7d05"], "meaning": "Deep Red", "meaning_mnemonic": "The kanji and the word are exactly the same, so this also means \u003cvocabulary\u003edeep red\u003c/vocabulary\u003e, or \u003cvocabulary\u003ecrimson\u003c/vocabulary\u003e. Additionally, it can also mean \u003cvocabulary\u003erouge\u003c/vocabulary\u003e, usually in reference to the cosmetic.\n\n\u7d05 is also a bit of an old-fashioned and somewhat literary word, so keep that in mind!", "radicals": [], "reading_display": "\u304f\u308c\u306a\u3044", "reading_mnemonic": "This is where things get a little complicated. You already learned \u3079\u306b as a reading with \u53e3\u7d05. \u7d05 can also be read \u3079\u306b just by itself, and in that case, it means \u003cvocabulary\u003erouge\u003c/vocabulary\u003e. However, there\u2019s a different reading that\u2019s used for \u003cvocabulary\u003edeep red\u003c/vocabulary\u003e, which we\u2019d like to focus on here, so here\u2019s a mnemonic to help you remember it:\n\nThere\u0027s so much \u003cvocabulary\u003edeep red\u003c/vocabulary\u003e blood everywhere, there\u0027s no way of helping this person bleeding out. One might say, \u003creading\u003ecure \u306a\u3044\u003c/reading\u003e (\u304f\u308c\u306a\u3044).  Just remember: when there\u0027s deep red everywhere, cure \u306a\u3044.", "url": "https://www.wanikani.com/vocabulary/%E7%B4%85"}, {"char": "\u99d0\u5728", "id": 6363, "image": null, "kanji": ["\u99d0", "\u5728"], "meaning": "Residence", "meaning_mnemonic": "You\u0027re a \u003ckanji\u003eresident\u003c/kanji\u003e and you \u003ckanji\u003eexist\u003c/kanji\u003e in the place you\u0027re residing in. That means you have \u003cvocabulary\u003eresidence\u003c/vocabulary\u003e.", "radicals": [], "reading_display": "\u3061\u3085\u3046\u3056\u3044", "reading_mnemonic": "This is a jukugo word that uses the on\u0027yomi readings of the kanji. You should be able to read this on your own.", "url": "https://www.wanikani.com/vocabulary/%E9%A7%90%E5%9C%A8"}, {"char": "\u301c\u6b73", "id": 6991, "image": null, "kanji": ["\u6b73"], "meaning": "Years Old", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well. This is put on the end of numbers to show how old someone is.\n\nYou already learned \u301c\u624d (years old), and \u301c\u6b73 means the exact same thing. No trick questions here. The difference is that \u6b73 is a pretty complicated kanji, so \u624d is the simplified, more casual option for easier readability. Basically, \u624d is the jeans-and-t-shirt version, while \u6b73 shows up in a suit and tie when things get official.", "radicals": [], "reading_display": "\u3055\u3044", "reading_mnemonic": "The reading is the same as the one you learned with the kanji.", "url": "https://www.wanikani.com/vocabulary/%E3%80%9C%E6%AD%B3"}, {"char": "\u7802\u5229", "id": 9128, "image": null, "kanji": ["\u7802", "\u5229"], "meaning": "Gravel", "meaning_mnemonic": "If \u003ckanji\u003esand\u003c/kanji\u003e makes a lot of \u003ckanji\u003eprofit\u003c/kanji\u003e, it swells up and becomes \u003cvocabulary\u003egravel\u003c/vocabulary\u003e. They\u0027re like the fat cats of the beach.", "radicals": [], "reading_display": "\u3058\u3083\u308a", "reading_mnemonic": "You learned the reading for \u5229 with the kanji, but the reading for \u7802 is irregular, so here\u0027s a mnemonic to help you:\n\nYou\u0027re walking through that big fat \u003cvocabulary\u003egravel\u003c/vocabulary\u003e, when a pile of it starts moving, and something suddenly leaps out at you. It\u0027s a... \u003creading\u003eja\u003c/reading\u003eguar (\u3058\u3083)! Run!", "url": "https://www.wanikani.com/vocabulary/%E7%A0%82%E5%88%A9"}, {"char": "\u4fa1", "id": 4519, "image": null, "kanji": ["\u4fa1"], "meaning": "Value", "meaning_mnemonic": "The kanji and the word are exactly the same. That means they share meanings as well.\n\n\u4fa1 refers to the monetary value or the price of goods in a transaction. Although it\u0027s somewhat old-fashioned and less common these days, you may still see it used in advanced phrases like \u4fa1\u3092\u3064\u3051\u308b (to set a price) or \u4e00\u6587\u306e\u4fa1\u3082\u306a\u3044 (not even worth a penny).\n\nNote that \u3042\u305f\u3044 can also refer to a numerical value in mathematics, such as the value a variable or function takes, but it\u0027s more commonly written with the kanji \u5024 in this use.", "radicals": [], "reading_display": "\u3042\u305f\u3044", "reading_mnemonic": "Since this word is made up of a single kanji, it probably uses the kun\u0027yomi reading. You did not learn this reading, so here\u0027s a mnemonic to help you to remember: Okay, this is a great \u003cvocabulary\u003evalue\u003c/vocabulary\u003e and \u003cvocabulary\u003eprice\u003c/vocabulary\u003e. Wait, what is? \u003creading\u003eA tie\u003c/reading\u003e (\u3042\u305f\u3044). Get a tie, and it will make you more professional which will help you to get a better job. Great value, right there, just for a tie.", "url": "https://www.wanikani.com/vocabulary/%E4%BE%A1"}, {"char": "\u516c\u544a", "id": 4085, "image": null, "kanji": ["\u516c", "\u544a"], "meaning": "Public Notice", "meaning_mnemonic": "A \u003ckanji\u003epublic\u003c/kanji\u003e \u003ckanji\u003eannouncement\u003c/kanji\u003e is a \u003cvocabulary\u003epublic notice\u003c/vocabulary\u003e.\n\n\u516c\u544a looks and sounds a lot like \u5e83\u544a, but the meanings are different. You might remember \u5e83\u544a is for advertisements, but \u516c\u544a here is for the kind of official statements that companies or governments put out for the public, especially shareholders, creditors, or other stakeholders.\n\nYou can remember \u516c\u544a is a public notice because the kanji for \"public\" is \u516c, and it\u0027s not covered by a canopy like the other one. It\u0027s uncovered, all out in the open for everyone to see \u2014 public!", "radicals": [], "reading_display": "\u3053\u3046\u3053\u304f", "reading_mnemonic": "This is a jukugo word, which usually means on\u0027yomi readings from the kanji. If you know the readings of your kanji you\u0027ll know how to read this as well.", "url": "https://www.wanikani.com/vocabulary/%E5%85%AC%E5%91%8A"}, {"char": "\u7533\u3057\u7533\u3057", "id": 2734, "image": null, "kanji": ["\u7533"], "meaning": "Excuse Me", "meaning_mnemonic": "It\u0027s kind of like you\u0027re saying \u003ckanji\u003esay\u003c/kanji\u003e \u003ckanji\u003esay\u003c/kanji\u003e, and it\u2019s used in classical Japanese to get someone\u2019s attention, so this is \u003cvocabulary\u003eexcuse me\u003c/vocabulary\u003e or \u003cvocabulary\u003ehello\u003c/vocabulary\u003e.\n\nYou would generally encounter \u7533\u3057\u7533\u3057 in dialogues set in older times, unlike its modern, shortened version \u3082\u3057\u3082\u3057, which is used for telephone greetings (and almost always written in kana).", "radicals": [], "reading_display": "\u3082\u3046\u3057\u3082\u3046\u3057", "reading_mnemonic": "This word uses the reading you learned with the kanji. You should know it already.", "url": "https://www.wanikani.com/vocabulary/%E7%94%B3%E3%81%97%E7%94%B3%E3%81%97"}], "test_url": "/n3-kanji-flash/ja/week/4/test/vocab/", "type": "vocab", "week": 4}
