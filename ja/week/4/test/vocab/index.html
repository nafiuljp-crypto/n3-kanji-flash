    <script>
    /* Theme bootstrap. Runs before the stylesheet so data-theme is already
       set on the first paint (no flash of the wrong theme, including when
       navigating between pages). Saved choice beats the OS setting. */
    (function () {
        var KEY = 'n3theme:v1';

        function savedTheme() {
            try {
                var v = localStorage.getItem(KEY);
                return (v === 'dark' || v === 'light') ? v : null;
            } catch (e) { return null; }
        }

        function preferredTheme() {
            var saved = savedTheme();
            if (saved) return saved;
            return (window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var next = theme === 'dark' ? 'light' : 'dark';
            var label = btn.getAttribute('data-' + next) || next;
            btn.setAttribute('title', label);
            btn.setAttribute('aria-label', label);
        }

        /* The visible moon/sun label is swapped by CSS from data-theme; only
           the accessible name needs this late pass once the button exists. */
        applyTheme(preferredTheme());
        document.addEventListener('DOMContentLoaded', function () {
            applyTheme(document.documentElement.getAttribute('data-theme') ||
                preferredTheme());
        });
        document.addEventListener('click', function (e) {
            var btn = e.target && e.target.closest
                ? e.target.closest('#theme-toggle') : null;
            if (!btn) return;
            var next = document.documentElement.getAttribute('data-theme') === 'dark'
                ? 'light' : 'dark';
            try { localStorage.setItem(KEY, next); } catch (err) { /* private mode */ }
            applyTheme(next);
        });
    })();
    </script>
    <script>
    /* Password lock bootstrap. Runs before the stylesheet so the locked
       class is already on <html> for the first paint (no flash of page
       content). Only the SHA-256 of the site password is stored — here and
       as the localStorage value; the password itself is never written down.
       Any page with this key set to the hash stays unlocked in this browser. */
    (function () {
        var KEY = 'n3lock:v1';
        var HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
        var root = document.documentElement;

        function isUnlocked() {
            try { return localStorage.getItem(KEY) === HASH; } catch (e) { return false; }
        }

        function setLocked(locked) {
            root.classList.toggle('n3-locked', locked);
        }

        function sha256Hex(text) {
            return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text))
                .then(function (buf) {
                    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
                        return ('0' + b.toString(16)).slice(-2);
                    }).join('');
                });
        }

        setLocked(!isUnlocked());

        document.addEventListener('DOMContentLoaded', function () {
            var form = document.getElementById('lock-form');
            var input = document.getElementById('lock-input');
            var error = document.getElementById('lock-error');
            var errorTimer = null;

            function clearError() {
                if (errorTimer) { clearTimeout(errorTimer); errorTimer = null; }
                if (error) error.hidden = true;
            }

            function showError() {
                if (!error) return;
                error.hidden = false;
                if (errorTimer) clearTimeout(errorTimer);
                errorTimer = setTimeout(clearError, 4000);
            }

            if (form && input) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    clearError();
                    var value = input.value;
                    if (!value) return;
                    if (!(window.crypto && crypto.subtle && window.TextEncoder)) return;
                    sha256Hex(value).then(function (hex) {
                        if (hex === HASH) {
                            try { localStorage.setItem(KEY, HASH); } catch (err) {}
                            setLocked(false);
                            input.value = '';
                            window.scrollTo(0, 0);
                        } else {
                            input.value = '';
                            input.focus();
                            showError();
                        }
                    }).catch(showError);
                });
                input.addEventListener('input', clearError);
                if (root.classList.contains('n3-locked')) input.focus();
            }

            var lockBtn = document.getElementById('lock-btn');
            if (lockBtn) {
                lockBtn.addEventListener('click', function () {
                    try { localStorage.removeItem(KEY); } catch (e) {}
                    setLocked(true);
                    clearError();
                    if (input) { input.value = ''; input.focus(); }
                    window.scrollTo(0, 0);
                });
            }
        });
    })();
    </script>

    <script>
    /* Language switcher + cookie initializer. Runs before any UI renders. */
    (function () {
        function getCookie(name) {
            var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return m ? m[2] : null;
        }
        function setCookie(name, value) {
            /* Scoped to the site, not to every project on *.github.io (B15). */
            var path = '/n3-kanji-flash/' || '/';
            document.cookie = name + '=' + value + '; path=' + path +
                '; max-age=31536000; SameSite=Lax';
        }
        if (!getCookie('lang')) {
            setCookie('lang', 'ja');
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-lang]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var newLang = a.getAttribute('data-lang');
                    setCookie('lang', newLang);
                    var m = location.pathname.match(/^(.*?)\/(en|ja)(\/.*)?$/);
                    var prefix = m ? m[1] : location.pathname.replace(/\/?[^\/]*$/, '');
                    var rest = (m && m[3]) ? m[3] : '/';
                    if (!rest.endsWith('/')) rest += '/';
                    location.href = prefix + '/' + newLang + rest;
                });
            });
        });
    })();
    </script>

{"bn_pool": ["\u09ac\u09bf\u09a8\u09af\u09bc\u09c7\u09b0 \u09b8\u09be\u09a5\u09c7 \u09ac\u09b2\u09be, \u09ac\u09b2\u09be", "\u099a\u09be\u09b2", "\u09a8\u09c7\u0993\u09af\u09bc\u09be, \u0995\u09bf\u099b\u09c1 \u09a8\u09c7\u0993\u09af\u09bc\u09be, \u0995\u09bf\u099b\u09c1 \u09aa\u09be\u0993\u09af\u09bc\u09be", "\u09b8\u09ae\u0997\u09cd\u09b0 \u0986\u09ae\u09c7\u09b0\u09bf\u0995\u09be, \u09b8\u09ae\u0997\u09cd\u09b0 \u09af\u09c1\u0995\u09cd\u09a4\u09b0\u09be\u09b7\u09cd\u099f\u09cd\u09b0", "\u09b8\u09ae\u09b0\u09cd\u09a5\u09a8 \u0995\u09b0\u09be", "\u09b6\u09be\u0996\u09be \u0985\u09ab\u09bf\u09b8", "\u0995\u09bf\u099b\u09c1 \u0997\u09cd\u09b0\u09b9\u09a3 \u0995\u09b0\u09be, \u0995\u09bf\u099b\u09c1 \u09a8\u09c7\u0993\u09af\u09bc\u09be, \u0995\u09bf\u099b\u09c1 \u09aa\u09be\u0993\u09af\u09bc\u09be", "\u09ac\u09bf\u09a4\u09b0\u09a3 \u0995\u09b0\u09be, \u09ac\u09bf\u09b2\u09bf \u0995\u09b0\u09be, \u09aa\u09cc\u0981\u099b\u09c7 \u09a6\u09c7\u0993\u09af\u09bc\u09be", "\u099c\u09c0\u09ac\u09a8\u09c0, \u099c\u09c0\u09ac\u09a8\u0995\u09be\u09b9\u09bf\u09a8\u09c0", "\u09ad\u09be\u09b2\u09cb\u09ad\u09be\u09ac\u09c7 \u0995\u09be\u099c \u0995\u09b0\u09be, \u09b8\u09ae\u09cd\u09ad\u09ac \u09b9\u0993\u09af\u09bc\u09be, \u0995\u09be\u09b0\u09cd\u09af\u0995\u09b0 \u09b9\u0993\u09af\u09bc\u09be", "\u0997\u09c1\u09a3, \u0997\u09c1\u09a3", "\u0996\u09c1\u09b2\u09c7 \u0986\u09b8\u09be, \u09b8\u09b0\u09be\u09a8\u09cb \u09b9\u0993\u09af\u09bc\u09be, \u09aa\u09a1\u09bc\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be", "\u09b8\u09ac\u09c1\u099c", "\u0989\u09a6\u09be\u09b9\u09b0\u09a3\u09b8\u09cd\u09ac\u09b0\u09c2\u09aa, \u0989\u09a6\u09be\u09b9\u09b0\u09a3 \u09b9\u09bf\u09b8\u09c7\u09ac\u09c7, \u09a7\u09b0\u09c7 \u09a8\u09bf\u09b2\u09c7", "\u0986\u09b8\u09be, \u09af\u09be\u0993\u09af\u09bc\u09be, \u09a6\u09c7\u0996\u09be \u0995\u09b0\u09a4\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be, \u09aa\u09b0\u09be\u099c\u09bf\u09a4 \u09b9\u0993\u09af\u09bc\u09be, \u09b9\u09a4\u09ac\u09c1\u09a6\u09cd\u09a7\u09bf \u09b9\u0993\u09af\u09bc\u09be", "\u0986\u09b6\u09be, \u0987\u099a\u09cd\u099b\u09be, \u0986\u0995\u09be\u0999\u09cd\u0995\u09cd\u09b7\u09be", "\u09b2\u09bf\u0999\u09cd\u0997, \u09aa\u09cd\u09b0\u0995\u09c3\u09a4\u09bf, \u09af\u09cc\u09a8\u09a4\u09be", "\u09ac\u09cd\u09af\u0995\u09cd\u09a4\u09bf\u09a4\u09cd\u09ac", "\u0987\u099a\u09cd\u099b\u09be, \u0986\u09b6\u09be, \u0995\u09be\u09ae\u09a8\u09be", "\u0995\u09be\u09ae\u09a8\u09be \u0995\u09b0\u09be, \u0987\u099a\u09cd\u099b\u09be \u0995\u09b0\u09be, \u09aa\u09cd\u09b0\u09a4\u09cd\u09af\u09be\u09b6\u09be \u0995\u09b0\u09be", "\u09ac\u09be\u0995\u09bf \u0985\u0982\u09b6, \u0985\u09ac\u09b6\u09bf\u09b7\u09cd\u099f\u09be\u0982\u09b6, \u0989\u09a6\u09cd\u09ac\u09c3\u09a4\u09cd\u09a4, \u0985\u09ac\u09b6\u09bf\u09b7\u09cd\u099f", "\u09aa\u09bf\u099b\u09a8\u09c7 \u09a5\u09c7\u0995\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be, \u09a5\u09be\u0995\u09be, \u09aa\u09bf\u099b\u09a8\u09c7 \u09a5\u09be\u0995\u09be", "\u0987\u099a\u09cd\u099b\u09be, \u0995\u09be\u09ae\u09a8\u09be, \u0986\u0995\u09be\u0999\u09cd\u0995\u09cd\u09b7\u09be", "\u09aa\u09b0\u09bf\u09b6\u09cb\u09a7 \u0995\u09b0\u09be, \u099d\u09c7\u09a1\u09bc\u09c7 \u09ab\u09c7\u09b2\u09be", "\u09aa\u09b0\u09bf\u09b6\u09cb\u09a7 \u0995\u09b0\u09be", "\u09b9\u09be\u09a1\u09bc\u09c7\u09b0 \u0997\u09a0\u09a8, \u0995\u0999\u09cd\u0995\u09be\u09b2, \u0995\u09be\u09a0\u09be\u09ae\u09cb", "\u0985\u09a8\u09c1\u09b7\u09cd\u09a0\u09be\u09a8 \u0995\u09ad\u09be\u09b0 \u0995\u09b0\u09be, \u09a4\u09a5\u09cd\u09af \u09b8\u0982\u0997\u09cd\u09b0\u09b9, \u09b8\u09be\u0995\u09cd\u09b7\u09be\u09ce\u0995\u09be\u09b0", "\u0987\u099a\u09cd\u099b\u09be \u0995\u09b0\u09be, \u0985\u09a8\u09c1\u09b0\u09cb\u09a7 \u0995\u09b0\u09be, \u0986\u09b6\u09be \u0995\u09b0\u09be, \u0996\u09cb\u0981\u099c\u09be", "\u09aa\u09c7\u09ae\u09c7\u09a8\u09cd\u099f", "\u09aa\u09bf\u099b\u09a8\u09c7 \u09b0\u09c7\u0996\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be, \u09ac\u09be\u0995\u09bf \u09b0\u09be\u0996\u09be", "\u09b2\u09ac\u09a3", "\u09b2\u09ac\u09a3 \u0993 \u0997\u09cb\u09b2\u09ae\u09b0\u09bf\u099a", "\u09b8\u09ae\u09a4\u09b2 \u09ac\u09b8\u09cd\u09a4\u09c1\u09b0 \u0997\u09a3\u09a8\u09be\u09b8\u09c2\u099a\u0995, \u09aa\u09cb\u09b6\u09be\u0995, \u099a\u09be\u09a6\u09b0", "\u09ac\u09b9\u09c1\u09ac\u099a\u09a8\u09ac\u09be\u099a\u0995 \u09aa\u09cd\u09b0\u09a4\u09cd\u09af\u09af\u09bc, \u09ac\u09b9\u09c1\u09ac\u099a\u09a8 \u09aa\u09cd\u09b0\u09a4\u09cd\u09af\u09af\u09bc, \u09ac\u09b9\u09c1\u09ac\u099a\u09a8 \u09ac\u09bf\u09ad\u0995\u09cd\u09a4\u09bf", "\u0985\u0997\u09cd\u09b0\u09bf\u09ae \u09a8\u09cb\u099f\u09bf\u09b6, \u09aa\u09c2\u09b0\u09cd\u09ac \u09a8\u09cb\u099f\u09bf\u09b6, \u099f\u09cd\u09b0\u09c7\u09b2\u09be\u09b0, \u09aa\u09cd\u09b0\u09bf\u09ad\u09bf\u0989", "\u09aa\u09cd\u09b0\u09c7\u09b0\u09a3, \u09aa\u09cd\u09b0\u09c7\u09b0\u09a3 \u0995\u09b0\u09be, \u099c\u09be\u09a8\u09be\u09a8\u09cb", "\u0998\u09cb\u09b7\u09a3\u09be \u0995\u09b0\u09be, \u09ac\u09b2\u09be", "\u09aa\u09be\u09a4\u09be\u09b0 \u09b8\u0982\u0996\u09cd\u09af\u09be, \u09b8\u09ae\u09a4\u09b2 \u09ac\u09b8\u09cd\u09a4\u09c1\u09b0 \u09b8\u0982\u0996\u09cd\u09af\u09be", "\u09b8\u09a4\u09b0\u09cd\u0995\u09ac\u09be\u09a3\u09c0, \u09aa\u09b0\u09be\u09ae\u09b0\u09cd\u09b6, \u09b8\u09be\u09ac\u09a7\u09be\u09a8\u09a4\u09be", "\u0985\u09b0\u09cd\u099c\u09a8 \u0995\u09b0\u09be, \u09aa\u09cc\u0981\u099b\u09be\u09a8\u09cb, \u09aa\u09cc\u0981\u099b\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be, \u09aa\u09cc\u0981\u099b\u09be\u09a8\u09cb", "\u09aa\u09cc\u0981\u099b\u09c7 \u09a6\u09c7\u0993\u09af\u09bc\u09be", "\u09ac\u0987 \u0997\u09a3\u09a8\u09be\u09b0 \u098f\u0995\u0995, \u09ac\u0987\u09af\u09bc\u09c7\u09b0 \u09b8\u0982\u0996\u09cd\u09af\u09be \u0997\u09a3\u09a8\u09be\u09b0 \u098f\u0995\u0995", "\u099c\u09a1\u09bc\u09bf\u09a4 \u09a5\u09be\u0995\u09be, \u099c\u09a1\u09bc\u09bf\u09af\u09bc\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be, \u09aa\u09c7\u0981\u099a\u09bf\u09af\u09bc\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be", "\u09b8\u0999\u09cd\u0997\u09c7 \u09a8\u09bf\u09af\u09bc\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be, \u098f\u0995\u099c\u09a8 \u09ae\u09be\u09a8\u09c1\u09b7\u0995\u09c7 \u09a8\u09bf\u09af\u09bc\u09c7 \u0986\u09b8\u09be", "\u09af\u09cb\u0997\u09be\u09af\u09cb\u0997 \u0995\u09b0\u09be, \u09af\u09cb\u0997\u09be\u09af\u09cb\u0997 \u0995\u09b0\u09be, \u09af\u09cb\u0997\u09be\u09af\u09cb\u0997 \u0995\u09b0\u09be", "\u09a7\u09be\u09b0\u09be\u09ac\u09be\u09b9\u09bf\u0995, \u09aa\u09b0\u09aa\u09b0, \u0995\u09cd\u09b0\u09ae\u09bf\u0995, \u09b8\u09bf\u09b0\u09bf\u099c", "\u09b8\u09ae\u09cd\u09aa\u09b0\u09cd\u0995, \u09b8\u0982\u09af\u09cb\u0997, \u09aa\u09cd\u09b0\u09be\u09b8\u0999\u09cd\u0997\u09bf\u0995\u09a4\u09be, \u09aa\u09be\u09b0\u09b8\u09cd\u09aa\u09b0\u09bf\u0995 \u09b8\u09ae\u09cd\u09aa\u09b0\u09cd\u0995", "\u0985\u09ac\u09b8\u09cd\u09a5\u09be\u09a8, \u09ac\u09bf\u09a6\u09c7\u09b6\u09c7 \u0985\u09ac\u09b8\u09cd\u09a5\u09be\u09a8", "\u0985\u09b8\u09cd\u09a4\u09bf\u09a4\u09cd\u09ac", "\u0995\u09b0 \u09ac\u09c3\u09a6\u09cd\u09a7\u09bf, \u0995\u09b0 \u09ac\u09be\u09a1\u09bc\u09be\u09a8\u09cb, \u09ac\u09b0\u09cd\u09a7\u09bf\u09a4 \u0995\u09b0", "\u0995\u09b0\u09ae\u09c1\u0995\u09cd\u09a4, \u0995\u09b0 \u09a8\u09c7\u0987, \u09b6\u09c1\u09b2\u09cd\u0995\u09ae\u09c1\u0995\u09cd\u09a4", "\u09ae\u09c2\u09b2\u09cd\u09af, \u09ae\u09c2\u09b2\u09cd\u09af, \u0997\u09c1\u09a3", "\u09a6\u09be\u09ae, \u09ae\u09c2\u09b2\u09cd\u09af, \u0996\u09b0\u099a", "\u09ae\u09c2\u09b2\u09cd\u09af, \u09a6\u09be\u09ae", "\u09ac\u09b8\u09ac\u09be\u09b8 \u0995\u09b0\u09be, \u09a5\u09be\u0995\u09be, \u09a5\u09c7\u0995\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be", "\u09ac\u09bf\u09a6\u09cd\u09af\u09ae\u09be\u09a8 \u09a5\u09be\u0995\u09be", "\u09ac\u09be\u09a1\u09bc\u09bf, \u09ac\u09be\u09b8\u09be, \u0997\u09c3\u09b9\u09b8\u09cd\u09a5\u09be\u09b2\u09bf", "\u09ad\u09be\u0997 \u0995\u09b0\u09be, \u09ab\u09be\u099f\u09be\u09a8\u09cb, \u09ad\u09be\u0999\u09be", "\u09ad\u09c2\u09ae\u09bf\u0995\u09be", "\u09ac\u09b0\u09cd\u09a4\u09ae\u09be\u09a8, \u098f\u0996\u09a8, \u099a\u09b2\u09a4\u09bf", "\u09ae\u09c2\u09b2\u09cd\u09af\u09ac\u09cb\u09a7, \u09ae\u09c2\u09b2\u09cd\u09af\u09ac\u09cb\u09a7\u09c7\u09b0 \u09a7\u09be\u09b0\u09a3\u09be, \u09a8\u09c8\u09a4\u09bf\u0995 \u09ae\u09c2\u09b2\u09cd\u09af\u09ac\u09cb\u09a7", "\u09ae\u09cb\u099f, \u09b8\u09ae\u09cd\u09aa\u09c2\u09b0\u09cd\u09a3 \u09aa\u09b0\u09bf\u09ae\u09be\u09a3, \u09b8\u09b0\u09cd\u09ac\u09ae\u09cb\u099f", "\u09ae\u09a1\u09c7\u09b2, \u09a7\u09b0\u09a8, \u099b\u09be\u0981\u099a, \u09a8\u0995\u09b6\u09be", "\u09a8\u09bf\u09b0\u09cd\u09a6\u09bf\u09b7\u09cd\u099f \u09aa\u09b0\u09bf\u09ae\u09be\u09a3, \u09a8\u09bf\u09b0\u09cd\u09a6\u09bf\u09b7\u09cd\u099f \u0985\u0999\u09cd\u0995, \u09a8\u09bf\u09b0\u09cd\u09a6\u09bf\u09b7\u09cd\u099f \u09b9\u09be\u09b0", "\u09a1\u09c7\u09b2\u09bf\u09ad\u09be\u09b0\u09bf \u09b9\u0993\u09af\u09bc\u09be, \u0986\u09b8\u09be, \u09aa\u09cc\u0981\u099b\u09be\u09a8\u09cb", "\u0985\u09ac\u09b6\u09bf\u09b7\u09cd\u099f \u09aa\u09b0\u09bf\u09ae\u09be\u09a3, \u09ac\u09cd\u09af\u09be\u09b2\u09c7\u09a8\u09cd\u09b8", "\u099b\u09ac\u09bf\u09b0 \u09ab\u09cd\u09b0\u09c7\u09ae, \u09ab\u09cd\u09b0\u09c7\u09ae", "\u09ad\u09be\u0997 \u09b9\u0993\u09af\u09bc\u09be, \u09ab\u09be\u099f\u09be, \u09ad\u09be\u0999\u09be", "\u09aa\u09cb\u09b6\u09be\u0995, \u09aa\u09cd\u09b0\u09b2\u09c7\u09aa, \u09aa\u09be\u0989\u09b0\u09c1\u099f\u09bf\u09b0 \u0997\u09c1\u0981\u09a1\u09bc\u09be\u09b0 \u09aa\u09cd\u09b0\u09b2\u09c7\u09aa", "\u09a6\u09be\u09ae, \u0996\u09b0\u099a", "\u09aa\u09cd\u09b0\u09a4\u09bf\u09b8\u09cd\u09a5\u09be\u09aa\u09a8 \u0995\u09b0\u09be, \u09ac\u09a6\u09b2\u09c7 \u09a6\u09c7\u0993\u09af\u09bc\u09be, \u09ac\u09bf\u09a8\u09bf\u09ae\u09af\u09bc \u0995\u09b0\u09be", "\u09b0\u09c7\u0995\u09b0\u09cd\u09a1, \u09a8\u09a5\u09bf", "\u099c\u09ae\u09be \u09b0\u09be\u0996\u09be, \u0997\u099a\u09cd\u099b\u09bf\u09a4 \u09b0\u09be\u0996\u09be, \u0995\u09be\u09b0\u0993 \u0995\u09be\u099b\u09c7 \u09b0\u09c7\u0996\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be", "\u099c\u09be\u09aa\u09be\u09a8\u09bf \u0995\u09cb\u09ae\u09b0\u09ac\u09a8\u09cd\u09a7, \u09ac\u09c7\u09b2\u09cd\u099f", "\u09ad\u09c7\u09a4\u09b0\u09c7 \u09a2\u09cb\u0995\u09be, \u0997\u09ad\u09c0\u09b0\u09c7 \u09a2\u09cb\u0995\u09be", "\u09a6\u09c7\u0996\u09be\u09b6\u09cb\u09a8\u09be \u0995\u09b0\u09be, \u09af\u09a4\u09cd\u09a8 \u09a8\u09c7\u0993\u09af\u09bc\u09be, \u09a7\u09b0\u09c7 \u09b0\u09be\u0996\u09be", "\u099a\u09be\u0995\u09b0\u09bf \u0995\u09b0\u09be, \u0995\u09be\u099c \u0995\u09b0\u09be", "\u09aa\u09c2\u09b0\u09cd\u09a3\u0995\u09be\u09b2\u09c0\u09a8 \u099a\u09be\u0995\u09b0\u09bf, \u09aa\u09c2\u09b0\u09cd\u09a3\u0995\u09be\u09b2\u09c0\u09a8", "\u0986\u09ac\u09c7\u09a6\u09a8 \u0995\u09b0\u09be, \u0986\u09ac\u09c7\u09a6\u09a8 \u099c\u09ae\u09be \u09a6\u09c7\u0993\u09af\u09bc\u09be, \u09aa\u09cd\u09b0\u09b8\u09cd\u09a4\u09be\u09ac \u09a6\u09c7\u0993\u09af\u09bc\u09be", "\u09ad\u09c7\u09a4\u09b0\u09c7 \u09b0\u09be\u0996\u09be, \u0995\u09bf\u099b\u09c1 \u09ac\u09cb\u099d\u09be\u0987 \u0995\u09b0\u09be", "\u0986\u09a4\u09cd\u09ae\u09b8\u09ae\u09b0\u09cd\u09aa\u09a3", "\u09aa\u09be\u09a8\u09bf\u09a4\u09c7 \u099d\u09be\u0981\u09aa \u09a6\u09c7\u0993\u09af\u09bc\u09be, \u09b9\u09a0\u09be\u09ce \u098f\u09b8\u09c7 \u09aa\u09a1\u09bc\u09be", "\u09a4\u09c7\u09b2", "\u0985\u09b8\u09be\u09ac\u09a7\u09be\u09a8\u09a4\u09be, \u09b8\u09a4\u09b0\u09cd\u0995\u09a4\u09be \u09b9\u09be\u09b0\u09be\u09a8\u09cb", "\u0995\u09be\u099c, \u099a\u09be\u0995\u09b0\u09bf, \u09a6\u09be\u09af\u09bc\u09bf\u09a4\u09cd\u09ac", "\u09ac\u09bf\u09a8\u09bf\u09ae\u09af\u09bc \u0995\u09b0\u09be", "\u09ac\u09be\u09b2\u09bf, \u09ac\u09be\u09b2\u09c1\u0995\u09a3\u09be", "\u0986\u09a4\u09cd\u09ae\u09b8\u09ae\u09b0\u09cd\u09aa\u09a3 \u0995\u09b0\u09be", "\u09aa\u09b0\u09bf\u09b6\u09cb\u09a7, \u099d\u09c7\u09a1\u09bc\u09c7 \u09ab\u09c7\u09b2\u09be", "\u09ab\u09bf\u09b0\u09bf\u09af\u09bc\u09c7 \u09a8\u09c7\u0993\u09af\u09bc\u09be", "\u09b6\u09cb\u09a7 \u0995\u09b0\u09be,
