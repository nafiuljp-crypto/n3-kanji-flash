<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>見つかりません</title>
    <link rel="stylesheet" href="/n3-kanji-flash/static/style.css">
    <script>
    /* Language switcher + cookie initializer. Runs before any UI renders. */
    (function () {
        function getCookie(name) {
            var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return m ? m[2] : null;
        }
        function setCookie(name, value) {
            document.cookie = name + '=' + value + '; path=/; max-age=31536000; SameSite=Lax';
        }
        if (!getCookie('lang')) {
            setCookie('lang', 'ja');
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-lang]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var newLang = a.getAttribute('data-lang');
                    setCookie('lang', newLang);
                    var path = location.pathname;
                    var m = path.match(/^(.*?)\/(en|ja)(\/.*)?$/);
                    var prefix = m ? m[1] : path.replace(/\/?[^\/]*$/, '');
                    var rest = (m && m[3]) ? m[3] : '/';
                    if (!rest.endsWith('/')) rest += '/';
                    location.href = prefix + '/' + newLang + rest;
                });
            });
        });
    })();
    </script>
</head>
<body>
    <nav class="navbar">
        <a href="/n3-kanji-flash/ja/" class="nav-brand">📚 N3 漢字</a>
        <div class="nav-links">
            <a href="/n3-kanji-flash/ja/">ホーム</a>
            <div class="lang-switch">
                <span class="lang-label">言語:</span>
                
                    
                        <a href="#lang-en" data-lang="en" class="lang-link">EN</a>
                    
                
                    
                        <span class="lang-current">日本語</span>
                    
                
            </div>
        </div>
    </nav>

    <main class="container">
        
<section class="error-page">
    <h1>404</h1>
    <p>Not found</p>
    <a href="/n3-kanji-flash/ja/" class="btn btn-primary">ホームに戻る</a>
</section>

    </main>

    <footer class="footer">
        <p>日本語総まとめ N3 漢字 · Tailscale 限定</p>
    </footer>

    
</body>
</html>
