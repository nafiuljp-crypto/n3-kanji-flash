    <script>
    /* Theme bootstrap. Runs before the stylesheet so data-theme is already
       set on the first paint (no flash of the wrong theme, including when
       navigating between pages). Saved choice beats the OS setting. */
    (function () {
        var KEY = 'n3theme:v1';

        function savedTheme() {
            try {
                var v = localStorage.getItem(KEY);
                return (v === 'dark' || v === 'light') ? v : null;
            } catch (e) { return null; }
        }

        function preferredTheme() {
            var saved = savedTheme();
            if (saved) return saved;
            return (window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var next = theme === 'dark' ? 'light' : 'dark';
            var label = btn.getAttribute('data-' + next) || next;
            btn.setAttribute('title', label);
            btn.setAttribute('aria-label', label);
        }

        /* The visible moon/sun label is swapped by CSS from data-theme; only
           the accessible name needs this late pass once the button exists. */
        applyTheme(preferredTheme());
        document.addEventListener('DOMContentLoaded', function () {
            applyTheme(document.documentElement.getAttribute('data-theme') ||
                preferredTheme());
        });
        document.addEventListener('click', function (e) {
            var btn = e.target && e.target.closest
                ? e.target.closest('#theme-toggle') : null;
            if (!btn) return;
            var next = document.documentElement.getAttribute('data-theme') === 'dark'
                ? 'light' : 'dark';
            try { localStorage.setItem(KEY, next); } catch (err) { /* private mode */ }
            applyTheme(next);
        });
    })();
    </script>

    <script>
    /* Language switcher + cookie initializer. Runs before any UI renders. */
    (function () {
        function getCookie(name) {
            var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return m ? m[2] : null;
        }
        function setCookie(name, value) {
            /* Scoped to the site, not to every project on *.github.io (B15). */
            var path = '/n3-kanji-flash/' || '/';
            document.cookie = name + '=' + value + '; path=' + path +
                '; max-age=31536000; SameSite=Lax';
        }
        if (!getCookie('lang')) {
            setCookie('lang', 'ja');
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-lang]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var newLang = a.getAttribute('data-lang');
                    setCookie('lang', newLang);
                    var m = location.pathname.match(/^(.*?)\/(en|ja)(\/.*)?$/);
                    var prefix = m ? m[1] : location.pathname.replace(/\/?[^\/]*$/, '');
                    var rest = (m && m[3]) ? m[3] : '/';
                    if (!rest.endsWith('/')) rest += '/';
                    location.href = prefix + '/' + newLang + rest;
                });
            });
        });
    })();
    </script>

y it\u0027s the life radical.", "radicals": [], "reading_display": "", "reading_mnemonic": null, "url": "https://www.wanikani.com/radicals/life"}, {"alt": "\u4ea1", "char": "\u4ea1", "id": 212, "image": null, "kanji": [], "meaning": "Death", "meaning_mnemonic": "There\u0027s a lid on a lion. And you\u0027re stuck under the lid with the lion, which means you will surely meet your \u003cradical\u003edeath\u003c/radical\u003e. Or if you don\u0027t want to die, think of the poor lion. If you leave a lion under a lid for too long, death will come for it too. Either way, somebody\u0027s gonna die today.", "radicals": [], "reading_display": "", "reading_mnemonic": null, "url": "https://www.wanikani.com/radicals/death"}, {"alt": "\u518a", "char": "\u518a", "id": 226, "image": null, "kanji": [], "meaning": "Bookshelf", "meaning_mnemonic": "This looks like a bunch of books on a shelf. It\u0027s a \u003cradical\u003ebookshelf\u003c/radical\u003e!", "radicals": [], "reading_display": "", "reading_mnemonic": null, "url": "https://www.wanikani.com/radicals/bookshelf"}, {"alt": "\u7531", "char": "\u7531", "id": 268, "image": null, "kanji": [], "meaning": "Reason", "meaning_mnemonic": "This radical is the same as the kanji. It means \u003cradical\u003ereason\u003c/radical\u003e.", "radicals": [], "reading_display": "", "reading_mnemonic": null, "url": "https://www.wanikani.com/radicals/reason"}, {"alt": "\u5ba2", "char": "\u5ba2", "id": 295, "image": null, "kanji": [], "meaning": "Guest", "meaning_mnemonic": "This radical is the same as the kanji. It means \u003cradical\u003eguest\u003c/radical\u003e.", "radicals": [], "reading_display": "", "reading_mnemonic": null, "url": "https://www.wanikani.com/radicals/guest"}, {"alt": "\u4e88", "char": "\u4e88", "id": 339, "image": null, "kanji": [], "meaning": "Beforehand", "meaning_mnemonic": "This radical is the same as the kanji. It means \u003cradical\u003ebeforehand\u003c/radical\u003e.\n\nHere\u0027s a mnemonic refresher just in case:
