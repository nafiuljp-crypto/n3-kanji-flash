    <script>
    /* Language switcher + cookie initializer. Runs before any UI renders. */
    (function () {
        function getCookie(name) {
            var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return m ? m[2] : null;
        }
        function setCookie(name, value) {
            document.cookie = name + '=' + value + '; path=/; max-age=31536000; SameSite=Lax';
        }
        if (!getCookie('lang')) {
            setCookie('lang', 'ja');
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-lang]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var newLang = a.getAttribute('data-lang');
                    setCookie('lang', newLang);
                    var m = location.pathname.match(/^(.*?)\/(en|ja)(\/.*)?$/);
                    var prefix = m ? m[1] : location.pathname.replace(/\/?[^\/]*$/, '');
                    var rest = (m && m[3]) ? m[3] : '/';
                    if (!rest.endsWith('/')) rest += '/';
                    location.href = prefix + '/' + newLang + rest;
                });
            });
        });
    })();
    </script>

            <div class="stat-card"><div class="stat-num" id="final-pct">0%</div><div class="stat-label">Accuracy</div></div>
        </div>
        <div class="wrong-review hidden" id="wrong-review">
            <h3>Items to review</h3>
            <div class="wrong-list" id="wrong-list"></div>
        </div>
        <div class="done-actions">
            <button id="retry-wrong-btn" class="btn btn-primary hidden">Retry wrong answers</button>
            <button id="retake-btn" class="btn btn-secondary">Retake the whole test</button>
