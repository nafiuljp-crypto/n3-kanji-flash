    <script>
    /* Theme bootstrap. Runs before the stylesheet so data-theme is already
       set on the first paint (no flash of the wrong theme, including when
       navigating between pages). Saved choice beats the OS setting. */
    (function () {
        var KEY = 'n3theme:v1';

        function savedTheme() {
            try {
                var v = localStorage.getItem(KEY);
                return (v === 'dark' || v === 'light') ? v : null;
            } catch (e) { return null; }
        }

        function preferredTheme() {
            var saved = savedTheme();
            if (saved) return saved;
            return (window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches)
                ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var next = theme === 'dark' ? 'light' : 'dark';
            var label = btn.getAttribute('data-' + next) || next;
            btn.setAttribute('title', label);
            btn.setAttribute('aria-label', label);
        }

        /* The visible moon/sun label is swapped by CSS from data-theme; only
           the accessible name needs this late pass once the button exists. */
        applyTheme(preferredTheme());
        document.addEventListener('DOMContentLoaded', function () {
            applyTheme(document.documentElement.getAttribute('data-theme') ||
                preferredTheme());
        });
        document.addEventListener('click', function (e) {
            var btn = e.target && e.target.closest
                ? e.target.closest('#theme-toggle') : null;
            if (!btn) return;
            var next = document.documentElement.getAttribute('data-theme') === 'dark'
                ? 'light' : 'dark';
            try { localStorage.setItem(KEY, next); } catch (err) { /* private mode */ }
            applyTheme(next);
        });
    })();
    </script>

3", "id": 179, "image": null, "kanji": [], "meaning": "Tombstone", "meaning_mnemonic": "There is a stool sticking out of the dirt. You walk up and realize it has writing on it. It\u0027s actually a \u003cradical\u003etombstone\u003c/radical\u003e. You can sit on it and remember the people who are below the dirt now.", "meaning_mnemonic_bn": "\u09ae\u09be\u099f\u09bf \u09a5\u09c7\u0995\u09c7 \u098f\u0995\u099f\u09be \u09b8\u09cd\u099f\u09c1\u09b2 \u0989\u0981\u0995\u09bf \u09a6\u09bf\u09af\u09bc\u09c7 \u0986\u099b\u09c7\u0964 \u09a4\u09c1\u09ae\u09bf \u0995\u09be\u099b\u09c7 \u0997\u09bf\u09af\u09bc\u09c7 \u09a6\u09c7\u0996\u09cb, \u09a4\u09be\u09b0 \u0997\u09be\u09af\u09bc\u09c7 \u09b2\u09c7\u0996\u09be\u0964 \u098f\u099f\u09be \u0986\u09b8\u09b2\u09c7 \u098f\u0995\u099f\u09be \u09b8\u09ae\u09be\u09a7\u09bf\u09ab\u09b2\u0995\u0964 \u09a4\u09c1\u09ae\u09bf \u09a4\u09be\u09b0 \u0989\u09aa\u09b0 \u09ac\u09b8\u09c7 \u09a8\u09bf\u099a\u09c7 \u09ae\u09be\u099f\u09bf\u09b0 \u09a8\u09bf\u099a\u09c7 \u09af\u09be\u09b0\u09be \u0986\u099b\u09c7 \u09a4\u09be\u09a6\u09c7\u09b0 \u09ae\u09a8\u09c7 \u0995\u09b0\u09a4\u09c7 \u09aa\u09be\u09b0\u09cb\u0964", "radicals": [], "reading_display": "", "reading_mnemonic": null, "reading_mnemonic_bn": null, "url": "https://www.wanikani.com/radicals/tombstone"}, {"alt": "\u8fb0", "char": "\u8fb0", "id": 183, "image": null, "kanji": [], "meaning": "Landslide", "meaning_mnemonic": "If you kick a cliff twice you\u0027ll start a \u003cradical\u003elandslide\u003c/radical\u003e! Oh no!", "meaning_mnemonic_bn": "\u09a4\u09c1\u09ae\u09bf \u0996\u09be\u09a1\u09bc\u09be \u09aa\u09be\u09b9\u09be\u09a1\u09bc\u09c7 \u09a6\u09c1\u09ac\u09be\u09b0 \u09b2\u09be\u09a5\u09bf \u09ae\u09be\u09b0\u09b2\u09c7 \u09a7\u09b8 \u09a8\u09be\u09ae\u09ac\u09c7! \u0993\u09b0\u09c7 \u09ac\u09be\u09ac\u09be!", "radicals": [], "reading_display": "", "reading_mnemonic": null, "reading_mnemonic_bn": null, "url": "https://www.wanikani.com/radicals/landslide"}, {"alt": "\u97f3", "char": "\u97f3", "id": 197, "image": null, "kanji": [], "meaning": "Sound", "meaning_mnemonic": "This radical is the same as the kanji. It means \u003cradical\u003esound\u003c/radical\u003e. You can even see someone standing at a kind of square table here. It\u0027s a DJ at the turntables! Imagine them spinning records and scratching out all kinds of cool sounds.\n\nYou could also remember this with the kanji mnemonic we gave you. Here\u0027s the gist of it: If you stand on the sun, you\u0027ll hear a very loud sizzling sound.", "meaning_mnemonic_bn": "\u098f\u0987 \u09b0\u09cd\u09af\u09be\u09a1\u09bf\u0995\u09cd\u09af\u09be\u09b2\u099f\u09be \u0995\u09be\u099e\u09cd\u099c\u09bf\u09b0 \u09ae\u09a4\u09cb\u0987\u0964 \u098f\u09b0 \u09ae\u09be\u09a8\u09c7 \u09b6\u09ac\u09cd\u09a6\u0964 \u098f\u0996\u09be\u09a8\u09c7 \u098f\u0995\u099f\u09be \u099a\u09be\u09b0\u0995\u09cb\u09a8\u09be \u099f\u09c7\u09ac\u09bf\u09b2\u09c7\u09b0 \u09aa\u09be\u09b6\u09c7 \u098f\u0995\u099c\u09a8 \u09a6\u09be\u0981\u09a1\u09bc\u09bf\u09af\u09bc\u09c7 \u0986\u099b\u09c7\u0964 \u09b8\u09c7 \u098f\u0995\u099c\u09a8 \u09a1\u09bf\u099c\u09c7, \u099f\u09be\u09b0\u09cd\u09a8\u099f\u09c7\u09ac\u09bf\u09b2\u09c7 \u09b0\u09c7\u0995\u09b0\u09cd\u09a1 \u0998\u09c1\u09b0\u09bf\u09af\u09bc\u09c7 \u09b8\u09cd\u0995\u09cd\u09b0\u09cd\u09af\u09be\u099a \u0995\u09b0\u09c7 \u09a8\u09be\u09a8\u09be\u09a8 \u09ae\u099c\u09be\u09b0 \u09b6\u09ac\u09cd\u09a6 \u09ac\u09be\u09a8\u09be\u099a\u09cd\u099b\u09c7\u0964\n\n\u0986\u09b0\u09c7\u0995\u09ad\u09be\u09ac\u09c7 \u09ae\u09a8\u09c7 \u09b0\u09be\u0996\u09cb: \u09b8\u09c2\u09b0\u09cd\u09af\u09c7\u09b0 \u0993\u09aa\u09b0 \u09a6\u09be\u0981\u09a1\u09bc\u09be\u09b2\u09c7 \u0996\u09c1\u09ac \u099c\u09cb\u09b0\u09c7 \u099a\u09bf\u099f\u099a\u09bf\u099f \u09b6\u09ac\u09cd\u09a6 \u09b6\u09cb\u09a8\u09be \u09af\u09be\u09af\u09bc\u0964", "radicals": [], "reading_display": "", "reading_mnemonic": null, "reading_mnemonic_bn": null, "url": "https://www.wanikani.com/radicals/sou
