<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not found</title>
    <link rel="stylesheet" href="../../static/style.css">
    <script>
    /* Language switcher + cookie initializer. Runs before any UI renders. */
    (function () {
        function getCookie(name) {
            var m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return m ? m[2] : null;
        }
        function setCookie(name, value) {
            document.cookie = name + '=' + value + '; path=/; max-age=31536000; SameSite=Lax';
        }
        if (!getCookie('lang')) {
            setCookie('lang', 'ja');
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('[data-lang]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    var newLang = a.getAttribute('data-lang');
                    setCookie('lang', newLang);
                    var path = location.pathname;
                    var m = path.match(/^(.*?)\/(en|ja)(\/.*)?$/);
                    var prefix = m ? m[1] : path.replace(/\/?[^\/]*$/, '');
                    var rest = (m && m[3]) ? m[3] : '/';
                    if (!rest.endsWith('/')) rest += '/';
                    location.href = prefix + '/' + newLang + rest;
                });
            });
        });
    })();
    </script>
</head>
<body>
    <nav class="navbar">
        <a href="../../index.html" class="nav-brand">📚 N3 Kanji</a>
        <div class="nav-links">
            <a href="../../index.html">Home</a>
            <div class="lang-switch">
                <span class="lang-label">Language:</span>
                
                    
                        <span class="lang-current">EN</span>
                    
                
                    
                        <a href="#lang-ja" data-lang="ja" class="lang-link">日本語</a>
                    
                
            </div>
        </div>
    </nav>

    <main class="container">
        
<section class="error-page">
    <h1>404</h1>
    <p>Not found</p>
    <a href="../../index.html" class="btn btn-primary">Back to home</a>
</section>

    </main>

    <footer class="footer">
        <p>Sou Matome N3 Kanji · Tailscale only</p>
    </footer>

    
</body>
</html>
